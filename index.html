<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#102e61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学术猫">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>学术猫·论文工作台</title>
<style>
:root{
  --bg:#f6f2e8;--card:#fffdf8;--navy:#102e61;--navy2:#183f7a;--gold:#c99a34;
  --text:#182132;--muted:#717988;--line:#e7e0d5;--good:#2d7d5a;--warn:#b97822;
  --bad:#b95852;--shadow:0 8px 28px rgba(21,36,63,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:rgba(246,242,232,.92);backdrop-filter:blur(16px);padding:14px 18px 10px;border-bottom:1px solid rgba(231,224,213,.7)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:44px;height:44px;border-radius:13px;object-fit:cover;box-shadow:var(--shadow)}
.brand h1{font-size:18px;margin:0;color:var(--navy);font-weight:800;letter-spacing:.2px}
.brand p{font-size:12px;margin:3px 0 0;color:var(--muted)}
.view{display:none;padding:14px 14px 28px;max-width:760px;margin:0 auto}
.view.active{display:block}
.hero{background:linear-gradient(135deg,#102e61,#1a447f);color:#fff;border-radius:24px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-35px;bottom:-38px;width:170px;height:170px;border:2px solid rgba(202,154,52,.32);border-radius:50%;box-shadow:0 0 0 22px rgba(202,154,52,.08),0 0 0 46px rgba(202,154,52,.05)}
.hero-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.hero .eyebrow{font-size:12px;opacity:.78}.hero .big{font-size:30px;font-weight:850;margin-top:7px}.hero .big small{font-size:13px;font-weight:600;opacity:.8}
.progress{height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin:14px 0 8px}
.progress>span{height:100%;display:block;background:linear-gradient(90deg,#f2c565,#c99a34);border-radius:99px}
.hero-note{font-size:12px;opacity:.83}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 8px;text-align:center;box-shadow:0 3px 12px rgba(15,35,65,.03)}
.stat .label{font-size:10px;color:var(--muted);white-space:nowrap}.stat .num{font-size:18px;font-weight:800;color:var(--navy);margin-top:5px}.stat .unit{font-size:10px;font-weight:600}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}
.section-title h2{font-size:16px;margin:0;color:var(--navy)}.section-title .sub{font-size:11px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:15px;text-align:left;box-shadow:0 4px 14px rgba(18,46,97,.04);color:var(--text)}
.iconbox{width:34px;height:34px;border-radius:10px;background:#eef2f8;color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:9px}
.quick strong{display:block;color:var(--navy);font-size:14px}.quick span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 4px 14px rgba(18,46,97,.035);margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.row-start{display:flex;gap:10px;align-items:flex-start}
.title{font-weight:760;color:var(--text);font-size:14px}.meta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.55}
.chip{display:inline-flex;align-items:center;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:700}
.chip.good{color:var(--good);background:#eaf5ee}.chip.warn{color:var(--warn);background:#fff2dc}.chip.bad{color:var(--bad);background:#fbe8e5}.chip.blue{color:var(--navy);background:#e8eef8}
.small-progress{height:6px;background:#ece8e0;border-radius:99px;overflow:hidden;margin:10px 0 3px}.small-progress span{display:block;height:100%;background:var(--navy);border-radius:99px}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:30;border:0;width:54px;height:54px;border-radius:50%;background:var(--navy);color:#fff;font-size:26px;box-shadow:0 10px 25px rgba(16,46,97,.28)}
.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:99px;color:var(--muted);font-size:12px}
.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,253,248,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr)}
.navbtn{border:0;background:transparent;color:#8a8f98;font-size:10px;padding:3px 0}.navbtn .ico{font-size:19px;display:block;line-height:23px}.navbtn.active{color:var(--navy);font-weight:800}
.sheet-wrap{display:none;position:fixed;inset:0;z-index:100;background:rgba(12,18,30,.33);align-items:flex-end}.sheet-wrap.open{display:flex}
.sheet{width:100%;max-height:88vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:14px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px rgba(0,0,0,.15)}
.handle{width:42px;height:5px;background:#d8d2c8;border-radius:99px;margin:0 auto 14px}.sheet h3{margin:0 0 14px;color:var(--navy);font-size:18px}
.field{margin:10px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;padding:12px 13px;border-radius:13px;outline:none;font-size:16px;color:var(--text)}
.field textarea{min-height:86px;resize:vertical}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions{display:flex;gap:9px;margin-top:15px}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:750}.btn.primary{background:var(--navy);color:#fff;flex:1}.btn.soft{background:#ebe7df;color:var(--navy)}.btn.danger{background:#fbe8e5;color:var(--bad)}
.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:8px}.toolbar button{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:8px 10px;font-size:11px;color:var(--navy)}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.bar-chart{height:150px;display:flex;align-items:flex-end;gap:8px;padding:20px 4px 0;border-bottom:1px solid var(--line)}
.bar-wrap{flex:1;text-align:center;min-width:0}.bar{background:var(--navy);border-radius:6px 6px 2px 2px;min-height:2px;position:relative}.bar.gold{background:var(--gold)}
.bar-val{font-size:9px;color:var(--muted);position:absolute;top:-16px;left:50%;transform:translateX(-50%)}.bar-label{font-size:9px;color:var(--muted);margin-top:5px}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.summary{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px}.summary .l{font-size:10px;color:var(--muted)}.summary .n{font-size:21px;font-weight:850;color:var(--navy);margin-top:4px}
.focus-wrap{text-align:center;background:linear-gradient(145deg,#102e61,#173d75);color:white;border-radius:24px;padding:22px 16px;margin-bottom:12px}
.timer{width:190px;height:190px;border-radius:50%;border:3px solid rgba(201,154,52,.9);display:flex;align-items:center;justify-content:center;margin:18px auto;font-size:42px;font-weight:800}
.focus-controls{display:flex;justify-content:center;gap:9px}.focus-controls button{border:0;border-radius:99px;padding:10px 18px;font-weight:750}.focus-controls .go{background:#f2d48d;color:#102e61}.focus-controls .ghost{background:rgba(255,255,255,.14);color:#fff}
.detail-block{background:#f7f3eb;border-radius:13px;padding:11px;margin-top:9px}.detail-block b{font-size:11px;color:var(--navy)}.detail-block p{font-size:12px;line-height:1.6;margin:5px 0 0;color:#454c58;white-space:pre-wrap}
.kpi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:9px 0 12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}.kpi b{display:block;color:var(--navy);font-size:19px}.kpi span{font-size:10px;color:var(--muted)}
.notice{font-size:11px;color:var(--muted);background:#efeae1;border-radius:12px;padding:10px 12px;line-height:1.6}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill-btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;color:var(--navy);font-weight:700}
@media (max-width:390px){.stats4{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <img src="apple-touch-icon.png" alt="学术猫">
      <div><h1>学术猫·论文工作台</h1><p>硕士论文写作与管理助手</p></div>
    </div>
  </header>

  <main>
    <section class="view active" id="view-home"></section>
    <section class="view" id="view-chapters"></section>
    <section class="view" id="view-problems"></section>
    <section class="view" id="view-resources"></section>
    <section class="view" id="view-stats"></section>
    <section class="view" id="view-focus"></section>
  </main>
</div>

<button class="fab" id="fab" aria-label="新增">＋</button>

<nav class="bottomnav" id="bottomnav">
  <button class="navbtn active" data-view="home"><span class="ico">⌂</span>首页</button>
  <button class="navbtn" data-view="chapters"><span class="ico">▤</span>章节</button>
  <button class="navbtn" data-view="problems"><span class="ico">?</span>问题</button>
  <button class="navbtn" data-view="resources"><span class="ico">□</span>资料</button>
  <button class="navbtn" data-view="stats"><span class="ico">▥</span>统计</button>
</nav>

<div class="sheet-wrap" id="sheetWrap"><div class="sheet"><div class="handle"></div><div id="sheetContent"></div></div></div>

<script>
const STORAGE_KEY='academicCatThesisWorkbenchV2';
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=()=>new Date().toISOString().slice(0,10);
const fmt=n=>Number(n||0).toLocaleString('zh-CN');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const daysBetween=(a,b)=>Math.ceil((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);

const defaults={
  settings:{thesisTitle:'我的硕士学位论文',totalWordGoal:80000,dailyWordGoal:2000,submissionDate:'2026-11-15',defenseDate:'2026-12-20',focusMinutes:25,breakMinutes:5},
  chapters:[
    {id:uid(),title:'第1章 绪论',targetWords:9000,currentWords:0,status:'进行中',notes:''},
    {id:uid(),title:'第2章 研究区概况',targetWords:10000,currentWords:0,status:'未开始',notes:''},
    {id:uid(),title:'第3章 研究方法',targetWords:12000,currentWords:0,status:'未开始',notes:''},
    {id:uid(),title:'第4章 结果分析',targetWords:15000,currentWords:0,status:'未开始',notes:''},
    {id:uid(),title:'第5章 讨论',targetWords:9000,currentWords:0,status:'未开始',notes:''},
    {id:uid(),title:'第6章 结论与展望',targetWords:5000,currentWords:0,status:'未开始',notes:''}
  ],
  writingLogs:[],
  problems:[],
  feedback:[],
  literature:[],
  figures:[],
  milestones:[],
  todos:[],
  versions:[],
  defense:[],
  focusLogs:[]
};
let state=load();
let currentView='home';
let resourceTab='literature';
let problemFilter='all';
let focusSeconds=state.settings.focusMinutes*60;
let focusTimer=null,focusRunning=false;

function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return structuredClone(defaults);
    const v=JSON.parse(raw);
    return Object.assign(structuredClone(defaults),v,{
      settings:Object.assign({},defaults.settings,v.settings||{}),
      chapters:Array.isArray(v.chapters)?v.chapters:structuredClone(defaults.chapters)
    });
  }catch(e){return structuredClone(defaults)}
}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));renderAll()}
function totalWords(){return state.chapters.reduce((s,c)=>s+Number(c.currentWords||0),0)}
function todayWords(){return state.writingLogs.filter(x=>x.date===iso()).reduce((s,x)=>s+Number(x.words||0),0)}
function streak(){
  const dates=[...new Set(state.writingLogs.filter(x=>Number(x.words)>0).map(x=>x.date))].sort().reverse();
  if(!dates.length)return 0;
  let d=new Date();let n=0;
  for(;;){
    const k=d.toISOString().slice(0,10);
    if(dates.includes(k)){n++;d.setDate(d.getDate()-1)}
    else if(n===0){d.setDate(d.getDate()-1); if(dates.includes(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)} else break}
    else break;
  } return n;
}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}
function statusChip(s){
  const cls=s==='已解决'||s==='已完成'||s==='已引用'||s==='已精读'?'good':s==='未解决'||s==='高'?'bad':'warn';
  return `<span class="chip ${cls}">${esc(s)}</span>`
}
function go(view){
  currentView=view;
  $$('.view').forEach(v=>v.classList.remove('active'));
  $('#view-'+view).classList.add('active');
  $$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  $('#bottomnav').style.display=view==='focus'?'none':'grid';
  $('#fab').style.display=(view==='stats'||view==='focus')?'none':'block';
  window.scrollTo({top:0,behavior:'instant'});
  renderAll();
}
function openSheet(html){$('#sheetContent').innerHTML=html;$('#sheetWrap').classList.add('open')}
function closeSheet(){$('#sheetWrap').classList.remove('open')}
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet()});

function renderHome(){
  const total=totalWords(), goal=Number(state.settings.totalWordGoal||80000), p=pct(total,goal);
  const dleft=Math.max(0,daysBetween(iso(),state.settings.defenseDate));
  const unresolved=state.problems.filter(x=>x.status!=='已解决').length;
  const pending=state.feedback.filter(x=>x.status!=='已完成').length;
  const todoPending=state.todos.filter(x=>!x.done).length;
  $('#view-home').innerHTML=`
  <div class="hero">
    <div class="hero-top"><div><div class="eyebrow">论文总进度</div><div class="big">${fmt(total)} <small>/ ${fmt(goal)} 字</small></div></div><div style="font-weight:800">${p}%</div></div>
    <div class="progress"><span style="width:${p}%"></span></div>
    <div class="hero-note">${esc(state.settings.thesisTitle)}</div>
  </div>
  <div class="stats4">
    <div class="stat"><div class="label">今日目标</div><div class="num">${fmt(state.settings.dailyWordGoal)}<span class="unit">字</span></div></div>
    <div class="stat"><div class="label">今日已写</div><div class="num">${fmt(todayWords())}<span class="unit">字</span></div></div>
    <div class="stat"><div class="label">连续写作</div><div class="num">${streak()}<span class="unit">天</span></div></div>
    <div class="stat"><div class="label">答辩倒计时</div><div class="num">${dleft}<span class="unit">天</span></div></div>
  </div>
  <div class="section-title"><h2>快速开始</h2><span class="sub">把卡点和修改都留痕</span></div>
  <div class="quick">
    <button onclick="go('focus')"><div class="iconbox">✎</div><strong>开始写作</strong><span>专注计时 + 登记字数</span></button>
    <button onclick="problemForm()"><div class="iconbox">?</div><strong>记录问题</strong><span>${unresolved} 个问题待闭环</span></button>
    <button onclick="literatureForm()"><div class="iconbox">▭</div><strong>文献整理</strong><span>${state.literature.length} 篇已录入</span></button>
    <button onclick="feedbackForm()"><div class="iconbox">✓</div><strong>导师意见</strong><span>${pending} 项待修改</span></button>
    <button onclick="todoForm()"><div class="iconbox">☐</div><strong>今日待办</strong><span>${todoPending} 项待完成</span></button>
    <button onclick="resourceTab='defense';go('resources')"><div class="iconbox">◇</div><strong>答辩准备</strong><span>${state.defense.length} 项已记录</span></button>
  </div>
  <div class="section-title"><h2>最近动态</h2><span class="sub">写作 / 问题 / 修改</span></div>
  ${recentActivity()}
  <div class="section-title"><h2>设置与备份</h2><span class="sub">数据只保存在本机</span></div>
  <div class="settings-grid">
    <button class="pill-btn" onclick="settingsForm()">论文设置</button>
    <button class="pill-btn" onclick="exportBackup()">导出备份</button>
    <button class="pill-btn" onclick="importBackup()">导入备份</button>
    <button class="pill-btn" onclick="milestoneForm()">新增节点</button>
    <button class="pill-btn" onclick="versionForm()">记录版本</button>
    <button class="pill-btn" onclick="defenseForm()">答辩准备</button>
  </div>`;
}
function recentActivity(){
  let items=[];
  state.writingLogs.forEach(x=>items.push({date:x.date,title:`写作 +${x.words} 字`,meta:x.note||chapterTitle(x.chapterId)}));
  state.problems.forEach(x=>items.push({date:x.updatedAt||x.createdAt,title:`问题：${x.title}`,meta:`${x.status} · ${x.type||'未分类'}`}));
  state.feedback.forEach(x=>items.push({date:x.completedAt||x.createdAt,title:`修改：${x.title}`,meta:`${x.status} · ${x.source||'未注明来源'}`}));
  state.todos.forEach(x=>items.push({date:x.updatedAt||x.createdAt,title:`待办：${x.title}`,meta:x.done?'已完成':'待完成'}));
  state.versions.forEach(x=>items.push({date:x.date,title:`版本：${x.name}`,meta:x.stage||'版本记录'}));
  state.defense.forEach(x=>items.push({date:x.updatedAt||x.createdAt,title:`答辩：${x.title}`,meta:x.status||'待准备'}));
  items.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(!items.length)return `<div class="empty">还没有记录。今天写第一笔，就从这里开始。</div>`;
  return items.slice(0,5).map(x=>`<div class="card"><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.date)} · ${esc(x.meta)}</div></div>`).join('');
}
function chapterTitle(id){return state.chapters.find(x=>x.id===id)?.title||'未指定章节'}

function renderChapters(){
  $('#view-chapters').innerHTML=`
  <div class="section-title" style="margin-top:2px"><h2>章节进度</h2><span class="sub">${state.chapters.length} 个章节</span></div>
  ${state.chapters.map(c=>{
    const p=pct(c.currentWords,c.targetWords);
    return `<div class="card" onclick="chapterForm('${c.id}')">
      <div class="row"><div><div class="title">${esc(c.title)}</div><div class="meta">${fmt(c.currentWords)} / ${fmt(c.targetWords)} 字 · ${esc(c.status||'')}</div></div><b style="color:var(--navy)">${p}%</b></div>
      <div class="small-progress"><span style="width:${p}%"></span></div>
      ${c.notes?`<div class="meta">${esc(c.notes)}</div>`:''}
    </div>`}).join('')||'<div class="empty">暂无章节</div>'}`;
}
function renderProblems(){
  const list=state.problems.filter(x=>problemFilter==='all'||(problemFilter==='open'?x.status!=='已解决':x.status==='已解决'));
  const solved=state.problems.filter(x=>x.status==='已解决').length;
  $('#view-problems').innerHTML=`
  <div class="section-title" style="margin-top:2px"><h2>问题记录 / 答疑</h2><span class="sub">问题 → 处理 → 结论</span></div>
  <div class="tabs">
    <button class="${problemFilter==='all'?'active':''}" onclick="problemFilter='all';renderProblems()">全部 ${state.problems.length}</button>
    <button class="${problemFilter==='open'?'active':''}" onclick="problemFilter='open';renderProblems()">未闭环 ${state.problems.length-solved}</button>
    <button class="${problemFilter==='solved'?'active':''}" onclick="problemFilter='solved';renderProblems()">已解决 ${solved}</button>
  </div>
  ${list.map(x=>`<div class="card" onclick="problemDetail('${x.id}')">

function weekData(){
  const arr=[];
  const now=new Date();
  const dow=(now.getDay()+6)%7;
  const mon=new Date(now);mon.setDate(now.getDate()-dow);
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const k=d.toISOString().slice(0,10);
    arr.push({date:k,label:'一二三四五六日'[i],value:state.writingLogs.filter(x=>x.date===k).reduce((s,x)=>s+Number(x.words||0),0)});
  }
  return arr;
}
function monthData(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const days=new Date(y,m+1,0).getDate();
  const buckets=[0,0,0,0,0,0];
  state.writingLogs.forEach(x=>{
    const d=new Date(x.date+'T00:00:00');
    if(d.getFullYear()===y && d.getMonth()===m){
      const idx=Math.min(5,Math.floor((d.getDate()-1)/5));
      buckets[idx]+=Number(x.words||0);
    }
  });
  return buckets.map((v,i)=>({label:i<5?`${i*5+1}-${i*5+5}日`:`26-${days}日`,value:v}));
}

function timerText(){const m=Math.floor(focusSeconds/60),s=focusSeconds%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function toggleFocus(){
  focusRunning=!focusRunning;
  if(focusRunning){
    focusTimer=setInterval(()=>{focusSeconds--;const el=$('#timer');if(el)el.textContent=timerText();if(focusSeconds<=0){clearInterval(focusTimer);focusRunning=false;navigator.vibrate?.(200);alert('本轮专注完成，可以登记本次写作了。');focusSeconds=state.settings.focusMinutes*60;renderFocus()}},1000);

}

    <div class="form2"><div class="field"><label>预计提交日期</label><input id="f-submit" type="date" value="${s.submissionDate}"></div><div class="field"><label>答辩日期</label><input id="f-defense" type="date" value="${s.defenseDate}"></div></div>
    <div class="form2"><div class="field"><label>专注分钟</label><input id="f-focus" type="number" value="${s.focusMinutes}"></div><div class="field"><label>休息分钟</label><input id="f-break" type="number" value="${s.breakMinutes}"></div></div>
    <div class="notice">这些设置和所有论文记录都保存在当前 iPhone / 浏览器本地。建议定期导出 JSON 备份。</div>
    <div class="actions"><button class="btn primary" onclick="saveSettings()">保存设置</button></div>`);
}
function saveSettings(){
  state.settings={thesisTitle:$('#f-thesis').value.trim(),totalWordGoal:+$('#f-total').value||80000,dailyWordGoal:+$('#f-daily').value||2000,submissionDate:$('#f-submit').value,defenseDate:$('#f-defense').value,focusMinutes:+$('#f-focus').value||25,breakMinutes:+$('#f-break').value||5};
  focusSeconds=state.settings.focusMinutes*60;closeSheet();save();
}
function removeItem(key,id){
  if(!confirm('确定删除这条记录吗？'))return;
  state[key]=state[key].filter(x=>x.id!==id);closeSheet();save();
}
function exportBackup(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`学术猫论文工作台-备份-${iso()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importBackup(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!v||typeof v!=='object')throw new Error();if(confirm('导入会覆盖当前数据，确定继续吗？')){state=Object.assign(structuredClone(defaults),v);save();alert('导入成功')}}catch(e){alert('备份文件无法读取')}};r.readAsText(f)};
  inp.click();
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
renderAll();
