<html lang="zh-CN">
<head>

<title>学术猫·论文工作台 V6</title>
<style>
:root{

  --bad:#b95852;--shadow:0 8px 28px rgba(21,36,63,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:rgba(246,242,232,.92);backdrop-filter:blur(16px);padding:14px 18px 10px;border-bottom:1px solid rgba(231,224,213,.7)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:48px;height:48px;border-radius:15px;object-fit:cover;box-shadow:var(--shadow);background:#fff;border:1px solid rgba(201,154,52,.18)}
.brand h1{font-size:18px;margin:0;color:var(--navy);font-weight:800;letter-spacing:.2px}
.brand p{font-size:12px;margin:3px 0 0;color:var(--muted)}
.view{display:none;padding:14px 14px 28px;max-width:760px;margin:0 auto}
.view.active{display:block}
.hero{background:linear-gradient(135deg,#102e61,#1a447f);color:#fff;border-radius:24px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-35px;bottom:-38px;width:170px;height:170px;border:2px solid rgba(202,154,52,.32);border-radius:50%;box-shadow:0 0 0 22px rgba(202,154,52,.08),0 0 0 46px rgba(202,154,52,.05)}
.hero-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.hero .eyebrow{font-size:12px;opacity:.78}.hero .big{font-size:30px;font-weight:850;margin-top:7px}.hero .big small{font-size:13px;font-weight:600;opacity:.8}
.progress{height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin:14px 0 8px}
.progress>span{height:100%;display:block;background:linear-gradient(90deg,#f2c565,#c99a34);border-radius:99px}
.hero-note{font-size:12px;opacity:.83}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 8px;text-align:center;box-shadow:0 3px 12px rgba(15,35,65,.03)}
.stat .label{font-size:10px;color:var(--muted);white-space:nowrap}.stat .num{font-size:18px;font-weight:800;color:var(--navy);margin-top:5px}.stat .unit{font-size:10px;font-weight:600}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}
.section-title h2{font-size:16px;margin:0;color:var(--navy)}.section-title .sub{font-size:11px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:15px;text-align:left;box-shadow:0 4px 14px rgba(18,46,97,.04);color:var(--text)}
.iconbox{width:36px;height:36px;border-radius:12px;background:#f7f2e8;color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;margin-bottom:9px;border:1px solid rgba(201,154,52,.18)}
.quick strong{display:block;color:var(--navy);font-size:14px}.quick span{display:block;color:var(--muted);font-size:11px;margin-top:4px}

.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.row-start{display:flex;gap:10px;align-items:flex-start}
.title{font-weight:760;color:var(--text);font-size:14px}.meta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.55}
.chip{display:inline-flex;align-items:center;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:700}
.chip.good{color:var(--good);background:#eaf5ee}.chip.warn{color:var(--warn);background:#fff2dc}.chip.bad{color:var(--bad);background:#fbe8e5}.chip.blue{color:var(--navy);background:#e8eef8}
.small-progress{height:6px;background:#ece8e0;border-radius:99px;overflow:hidden;margin:10px 0 3px}.small-progress span{display:block;height:100%;background:var(--navy);border-radius:99px}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:30;border:0;width:54px;height:54px;border-radius:50%;background:var(--navy);color:#fff;font-size:26px;box-shadow:0 10px 25px rgba(16,46,97,.28)}
.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:99px;color:var(--muted);font-size:12px}
.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,253,248,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;overflow:hidden;gap:2px;justify-content:space-around}
.bottomnav::-webkit-scrollbar{display:none}
.navbtn{border:0;background:transparent;color:#8a8f98;font-size:11px;padding:4px 6px;flex:1;min-width:0}.navbtn .ico{font-size:18px;display:block;line-height:22px}.navbtn.active{color:var(--gold);font-weight:800}
.sheet-wrap{display:none;position:fixed;inset:0;z-index:100;background:rgba(12,18,30,.33);align-items:flex-end}.sheet-wrap.open{display:flex}
.sheet{width:100%;max-height:88vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:14px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px rgba(0,0,0,.15)}
.handle{width:42px;height:5px;background:#d8d2c8;border-radius:99px;margin:0 auto 14px}.sheet h3{margin:0 0 14px;color:var(--navy);font-size:18px}
.field{margin:10px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;padding:12px 13px;border-radius:13px;outline:none;font-size:16px;color:var(--text)}
.field textarea{min-height:86px;resize:vertical}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions{display:flex;gap:9px;margin-top:15px}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:750}.btn.primary{background:var(--navy);color:#fff;flex:1}.btn.soft{background:#ebe7df;color:var(--navy)}.btn.danger{background:#fbe8e5;color:var(--bad)}
.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:8px}.toolbar button{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:8px 10px;font-size:11px;color:var(--navy)}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;overflow:hidden}

.bar-val{font-size:9px;color:var(--muted);position:absolute;top:-16px;left:50%;transform:translateX(-50%)}.bar-label{font-size:9px;color:var(--muted);margin-top:5px}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.summary{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px}.summary .l{font-size:10px;color:var(--muted)}.summary .n{font-size:21px;font-weight:850;color:var(--navy);margin-top:4px}
.focus-wrap{text-align:center;background:linear-gradient(145deg,#102e61,#173d75);color:white;border-radius:24px;padding:22px 16px;margin-bottom:12px}
.timer{width:190px;height:190px;border-radius:50%;border:3px solid rgba(201,154,52,.9);display:flex;align-items:center;justify-content:center;margin:18px auto;font-size:42px;font-weight:800}
.focus-controls{display:flex;justify-content:center;gap:9px}.focus-controls button{border:0;border-radius:99px;padding:10px 18px;font-weight:750}.focus-controls .go{background:#f2d48d;color:#102e61}.focus-controls .ghost{background:rgba(255,255,255,.14);color:#fff}
.detail-block{background:#f7f3eb;border-radius:13px;padding:11px;margin-top:9px}.detail-block b{font-size:11px;color:var(--navy)}.detail-block p{font-size:12px;line-height:1.6;margin:5px 0 0;color:#454c58;white-space:pre-wrap}
.kpi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:9px 0 12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}.kpi b{display:block;color:var(--navy);font-size:19px}.kpi span{font-size:10px;color:var(--muted)}
.notice{font-size:11px;color:var(--muted);background:#efeae1;border-radius:12px;padding:10px 12px;line-height:1.6}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill-btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;color:var(--navy);font-weight:700}

.top-search{margin-left:auto;width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--navy);font-size:22px;display:flex;align-items:center;justify-content:center}
.health{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.health .hcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px}
.health .hlabel{font-size:10px;color:var(--muted)}.health .hnum{font-size:17px;font-weight:850;color:var(--navy);margin-top:4px;line-height:1.35}
.goodtxt{color:var(--good)!important}.warntxt{color:var(--warn)!important}.badtxt{color:var(--bad)!important}
.due-badge{font-size:10px;padding:4px 7px;border-radius:99px;background:#f2eee7;color:var(--muted);white-space:nowrap}
.due-badge.overdue{background:#fbe8e5;color:var(--bad)}.due-badge.today{background:#fff2dc;color:var(--warn)}
.searchbox{position:sticky;top:-14px;background:var(--card);padding:2px 0 9px;z-index:2}.searchbox input{width:100%;border:1px solid var(--line);background:#fff;padding:12px 13px;border-radius:13px;font-size:16px}
.checkrow{display:flex;gap:10px;align-items:flex-start}.checkrow input{width:20px;height:20px;margin-top:1px;flex:0 0 auto}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;min-width:0}.calendar-head button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;color:var(--navy);flex:0 0 auto}.calendar-head .title{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;width:100%;overflow:hidden}.cal-week{font-size:9px;color:var(--muted);text-align:center;padding:4px 0;min-width:0}
.cal-day{width:100%;min-width:0;padding:0;aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:10px;color:var(--muted);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.cal-day.empty{border-color:transparent;background:transparent}
.cal-day.lv1{background:#edf1f7}.cal-day.lv2{background:#cfd9e8;color:#27466f}.cal-day.lv3{background:#91a8c8;color:#fff}.cal-day.lv4{background:#173d75;color:#fff}.cal-day.today{outline:2px solid var(--gold)}.cal-dot{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.alert-card{border-left:4px solid var(--warn)}.alert-card.danger{border-left-color:var(--bad)}
.tag{display:inline-block;font-size:9px;padding:3px 6px;border-radius:7px;background:#eef2f8;color:var(--navy);margin:3px 3px 0 0}
.star{color:var(--gold);font-size:16px}.section-mini{background:#f8f5ef;border:1px solid var(--line);border-radius:13px;padding:10px;margin-top:8px}
.segment{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}.segment button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;padding:9px 6px;font-size:11px}.segment button.active{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:800}
.period-nav{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;margin:0 0 8px}.period-nav>button{border:1px solid var(--line);background:var(--card);color:var(--navy);border-radius:11px;padding:10px 9px;font-size:11px;font-weight:700}.period-center{min-width:0;text-align:center}.period-center b{display:block;color:var(--navy);font-size:12px;margin-bottom:5px}.period-center input{width:100%;max-width:180px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;color:var(--text);font-size:12px}.time-meta{margin-top:6px;color:#8a7b65;font-size:10px}.week-jump{cursor:pointer}.week-jump:active{transform:scale(.995)}
.spark{display:flex;align-items:flex-end;gap:5px;height:95px;padding-top:18px;border-bottom:1px solid var(--line)}.spark .bar-wrap{height:100%;display:flex;flex-direction:column;justify-content:flex-end}.spark .bar{width:100%}
.progress-ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--navy) var(--ring),#e9e5dd 0);position:relative}.progress-ring:after{content:"";position:absolute;inset:6px;background:var(--card);border-radius:50%}.progress-ring b{position:relative;z-index:1;font-size:11px;color:var(--navy)}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mini-cell{background:#f8f5ef;border-radius:12px;padding:9px;text-align:center}.mini-cell b{font-size:16px;color:var(--navy);display:block}.mini-cell span{font-size:9px;color:var(--muted)}
.badge-num{display:inline-flex;min-width:22px;height:22px;padding:0 6px;align-items:center;justify-content:center;border-radius:99px;background:#eef2f8;color:var(--navy);font-size:10px;font-weight:800}

@media (max-width:390px){.stats4{grid-template-columns:repeat(2,1fr)}.segment{grid-template-columns:repeat(5,1fr)}.period-nav{grid-template-columns:1fr 1.25fr 1fr}.period-nav>button{padding:9px 4px;font-size:10px}.calendar-grid{gap:4px}.cal-day{font-size:9px;border-radius:8px}.calendar-head button{padding:5px 8px}.calendar-head .title{font-size:13px}}

.settings-page-head{display:flex;align-items:center;gap:12px;margin:2px 2px 16px}
.settings-page-head img{width:54px;height:54px;border-radius:16px;object-fit:cover}
.settings-page-head h2{margin:0;color:var(--navy);font-size:19px}.settings-page-head p{margin:4px 0 0;color:var(--muted);font-size:11px}
.settings-section{margin:18px 0 8px}.settings-section h3{margin:0 2px 8px;color:var(--navy);font-size:14px}.settings-section .desc{font-size:10px;color:var(--muted);margin:-3px 2px 9px}
.setting-row{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 13px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.setting-row .left{min-width:0}.setting-row .name{font-size:13px;font-weight:750}.setting-row .value{font-size:10px;color:var(--muted);margin-top:3px;word-break:break-all}.setting-row .chev{color:#a0a5ad;font-size:18px}
.danger-zone{border:1px solid #efd0cc;background:#fff9f8}.version-badge{display:inline-flex;padding:3px 7px;border-radius:99px;background:#e8eef8;color:var(--navy);font-size:10px;font-weight:800}


.workspace-switch,.records-switch{margin:2px 0 12px}
.page-head{display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px}
.page-head h2{margin:0;color:var(--navy);font-size:17px}
.page-head .sub{font-size:11px;color:var(--muted)}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <img src="apple-touch-icon.png" alt="学术猫">
      <div><h1>学术猫·论文工作台</h1><p>极简猫系界面 · 写作、记录、统计一体化</p></div>
      <button class="top-search" onclick="globalSearch()" aria-label="全局搜索">⌕</button>
    </div>

  <main>
    <section class="view active" id="view-home"></section>
    <section class="view" id="view-chapters"></section>

    <section class="view" id="view-settings"></section>
    <section class="view" id="view-focus"></section>

</div>

<nav class="bottomnav" id="bottomnav">

  <button class="navbtn" data-view="settings"><span class="ico">◎</span>我的</button>
</nav>

<div class="sheet-wrap" id="sheetWrap"><div class="sheet"><div class="handle"></div><div id="sheetContent"></div></div></div>

 n.feedback=n.feedback.map(x=>withLegacyTime(x,x.createdAt||''));

function removeSection(cid,sid){if(!confirm('确定删除这个小节吗？'))return;const c=state.chapters.find(x=>x.id===cid);if(c)c.sections=c.sections.filter(x=>x.id!==sid);closeSheet();save()}

function renderProblems(){
 const list=state.problems.filter(x=>problemFilter==='all'||(problemFilter==='open'?x.status!=='已解决':problemFilter==='solved'?x.status==='已解决':x.priority==='高')).sort((a,b)=>((a.status==='已解决')-(b.status==='已解决'))||((b.priority==='高')-(a.priority==='高'))||String(b.updatedAt||b.createdAt).localeCompare(String(a.updatedAt||a.createdAt)));
 const solved=state.problems.filter(x=>x.status==='已解决').length,avgSolve=averageSolveDays();
 $('#view-problems').innerHTML=`<div class="page-head"><div><h2>写作台</h2><div class="sub">章节、问题与专注写作入口合并</div></div></div>${workspaceSwitcher('problems')}<div class="section-title" style="margin-top:2px"><h2>问题记录 / 答疑</h2><span class="sub">问题 → 处理 → 结果 → 复盘</span></div><div class="tabs"><button class="${problemFilter==='all'?'active':''}" onclick="problemFilter='all';renderProblems()">全部 ${state.problems.length}</button><button class="${problemFilter==='open'?'active':''}" onclick="problemFilter='open';renderProblems()">未闭环 ${state.problems.length-solved}</button><button class="${problemFilter==='solved'?'active':''}" onclick="problemFilter='solved';renderProblems()">已解决 ${solved}</button><button class="${problemFilter==='high'?'active':''}" onclick="problemFilter='high';renderProblems()">高优先级</button></div>${list.map(x=>`<div class="card" onclick="problemDetail('${x.id}')"><div class="row"><div class="title">${esc(x.title)}</div>${statusChip(x.status)}</div><div class="meta">${esc(x.chapter||'未指定章节')} · ${esc(x.type||'未分类')} · ${esc(x.priority||'中')}优先级 · ${esc(x.createdAt||'')}</div>${x.description?`<div class="meta">${esc(x.description).slice(0,95)}${x.description.length>95?'…':''}</div>`:''}${auditHTML(x)}</div>`).join('')||'<div class="empty">暂时没有问题记录。遇到卡点就记下来，解决后补上结果和复盘。</div>'}<div class="kpi-strip"><div class="kpi"><b>${state.problems.length}</b><span>问题总数</span></div><div class="kpi"><b>${solved}</b><span>已解决</span></div><div class="kpi"><b>${avgSolve===null?'—':avgSolve}</b><span>平均解决天数</span></div></div>`;
}
function averageSolveDays(){const v=state.problems.filter(x=>x.status==='已解决'&&x.createdAt&&x.resolvedAt).map(x=>Math.max(0,daysBetween(x.createdAt,x.resolvedAt)));return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null}
function problemForm(id){const x=state.problems.find(v=>v.id===id)||{title:'',chapter:'',type:'结构逻辑',description:'',status:'未解决',method:'',resolution:'',lesson:'',priority:'中',source:'自己发现',evidence:'',createdAt:iso(),resolvedAt:''};openSheet(`<h3>${id?'编辑问题':'记录今天遇到的问题'}</h3><div class="field"><label>问题标题</label><input id="f-title" value="${esc(x.title)}" placeholder="例如：第4章图表说明怎么写"></div><div class="form2"><div class="field"><label>所属章节</label><input id="f-chapter" value="${esc(x.chapter||'')}" placeholder="第4章"></div><div class="field"><label>问题类型</label><select id="f-type">${['结构逻辑','文字表达','图表规范','数据分析','文献引用','格式排版','方法设计','导师意见','答辩准备','其他'].map(s=>`<option ${x.type===s?'selected':''}>${s}</option>`)}</select></div></div><div class="form2"><div class="field"><label>来源</label><select id="f-source">${['自己发现','导师提出','同学讨论','文献启发','规范要求','答辩/评审','其他'].map(s=>`<option ${x.source===s?'selected':''}>${s}</option>`)}</select></div><div class="field"><label>优先级</label><select id="f-priority">${['高','中','低'].map(s=>`<option ${x.priority===s?'selected':''}>${s}</option>`)}</select></div></div><div class="field"><label>问题描述</label><textarea id="f-desc">${esc(x.description||'')}</textarea></div><div class="field"><label>状态</label><select id="f-status">${['未解决','处理中','已解决','需继续跟进'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`)}</select></div><div class="field"><label>解决方式 / 处理过程</label><textarea id="f-method">${esc(x.method||'')}</textarea></div><div class="field"><label>依据 / 相关资料</label><textarea id="f-evidence" placeholder="可记文献、规范、导师原话或数据依据">${esc(x.evidence||'')}</textarea></div><div class="field"><label>最终解决结果</label><textarea id="f-resolution">${esc(x.resolution||'')}</textarea></div><div class="field"><label>经验总结 / 下次怎么做</label><textarea id="f-lesson">${esc(x.lesson||'')}</textarea></div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('problems','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveProblem('${id}')">保存</button></div>`)}
function saveProblem(id){const old=state.problems.find(x=>x.id===id),status=$('#f-status').value,times=auditFields(old),now=nowStamp();const v={id:id||uid(),title:$('#f-title').value.trim(),chapter:$('#f-chapter').value.trim(),type:$('#f-type').value,source:$('#f-source').value,description:$('#f-desc').value.trim(),status,priority:$('#f-priority').value,method:$('#f-method').value.trim(),evidence:$('#f-evidence').value.trim(),resolution:$('#f-resolution').value.trim(),lesson:$('#f-lesson').value.trim(),...times,resolvedAt:status==='已解决'?(old?.resolvedAt||now):''};if(!v.title)return alert('请填写问题标题');const i=state.problems.findIndex(x=>x.id===id);if(i>=0)state.problems[i]=v;else state.problems.push(v);closeSheet();save()}
function problemDetail(id){const x=state.problems.find(v=>v.id===id);if(!x)return;openSheet(`<h3>${esc(x.title)}</h3><div class="row"><div class="meta">${esc(x.chapter||'未指定章节')} · ${esc(x.type||'未分类')} · ${esc(x.priority||'中')}优先级</div>${statusChip(x.status)}</div><div class="meta">来源：${esc(x.source||'未记录')}</div>${auditHTML(x)}${x.resolvedAt?`<div class="meta time-meta">✓ 解决 ${esc(fmtStamp(x.resolvedAt))}</div>`:''}${x.description?`<div class="detail-block"><b>问题描述</b><p>${esc(x.description)}</p></div>`:''}${x.method?`<div class="detail-block"><b>处理过程</b><p>${esc(x.method)}</p></div>`:''}${x.evidence?`<div class="detail-block"><b>依据 / 相关资料</b><p>${esc(x.evidence)}</p></div>`:''}${x.resolution?`<div class="detail-block"><b>解决结果</b><p>${esc(x.resolution)}</p></div>`:''}${x.lesson?`<div class="detail-block"><b>复盘总结</b><p>${esc(x.lesson)}</p></div>`:''}<div class="actions"><button class="btn soft" onclick="closeSheet();problemForm('${id}')">编辑</button>${x.status!=='已解决'?`<button class="btn primary" onclick="markSolved('${id}')">标记已解决</button>`:`<button class="btn primary" onclick="reopenProblem('${id}')">重新打开</button>`}</div>`)}
function markSolved(id){const x=state.problems.find(v=>v.id===id);if(x){x.status='已解决';x.resolvedAt=nowStamp();x.updatedAt=nowStamp();x.createdAt=x.createdAt||x.updatedAt}closeSheet();save()}
function reopenProblem(id){const x=state.problems.find(v=>v.id===id);if(x){x.status='需继续跟进';x.resolvedAt='';x.updatedAt=nowStamp();x.createdAt=x.createdAt||x.updatedAt}closeSheet();save()}

function renderResources(){
 const tabs=[['literature','文献'],['feedback','修改'],['todos','待办'],['meetings','会议'],['figures','图表'],['milestones','节点'],['versions','版本'],['finalcheck','定稿'],['defense','答辩']];let body='';
 if(resourceTab==='literature'){
  const eng=state.literature.filter(x=>x.language==='英文').length,cited=state.literature.filter(x=>x.status==='已引用').length;
  body=`<div class="mini-grid" style="margin-bottom:10px"><div class="mini-cell"><b>${state.literature.length}</b><span>全部文献</span></div><div class="mini-cell"><b>${eng}</b><span>英文文献</span></div><div class="mini-cell"><b>${cited}</b><span>已引用</span></div></div>`+state.literature.slice().sort((a,b)=>(b.favorite?1:0)-(a.favorite?1:0)||String(b.year).localeCompare(String(a.year))).map(x=>`<div class="card" onclick="literatureForm('${x.id}')"><div class="row"><div class="title">${x.favorite?'<span class="star">★</span> ':''}${esc(x.title)}</div>${statusChip(x.status||'待阅读')}</div><div class="meta">${esc(x.authors||'')} ${esc(x.year||'')} · ${esc(x.language||'未注明')} · 用于：${esc(x.usedIn||'未指定')}</div>${tagsHTML(x.tags)}${x.notes?`<div class="meta">${esc(x.notes).slice(0,100)}</div>`:''}${auditHTML(x)}</div>`).join('')||'<div class="empty">还没有文献。把“读过什么、能放哪一章、核心观点”整理成文献卡片。</div>';
 }else if(resourceTab==='feedback'){
  body=state.feedback.slice().sort((a,b)=>(a.status==='已完成')-(b.status==='已完成')||((b.priority==='高')-(a.priority==='高'))).map(x=>`<div class="card" onclick="feedbackForm('${x.id}')"><div class="row"><div class="title">${esc(x.title)}</div>${statusChip(x.status)}</div><div class="meta">${esc(x.round||'未分轮次')} · 来源：${esc(x.source||'')} · ${esc(x.chapter||'未指定章节')} · ${esc(x.priority||'中')}优先级</div>${x.detail?`<div class="meta">${esc(x.detail).slice(0,95)}</div>`:''}${auditHTML(x)}</div>`).join('')||'<div class="empty">还没有修改意见。导师、自查、盲审、格式规范都可以放这里。</div>';
 }else if(resourceTab==='todos'){
  const sorted=state.todos.slice().sort((a,b)=>(a.done===b.done?String(a.due||'9999').localeCompare(String(b.due||'9999')):a.done-b.done));
  body=sorted.map(x=>`<div class="card" onclick="todoForm('${x.id}')"><div class="row"><div class="title">${x.done?'✓ ':''}${esc(x.title)}</div>${dueBadge(x.due,x.done)||statusChip(x.done?'已完成':'待完成')}</div><div class="meta">${esc(x.chapter||'未指定章节')} · ${esc(x.priority||'中')}优先级${x.due?' · 截止 '+esc(x.due):''}</div>${x.notes?`<div class="meta">${esc(x.notes).slice(0,90)}</div>`:''}${auditHTML(x)}</div>`).join('')||'<div class="empty">还没有待办。把“今天要写什么、要补什么、要改什么”记在这里。</div>';
 }else if(resourceTab==='meetings'){
  body=state.meetings.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(x=>`<div class="card" onclick="meetingForm('${x.id}')"><div class="row"><div class="title">${esc(x.topic)}</div><span class="chip blue">${esc(x.date||'')}</span></div><div class="meta">${esc(x.withWhom||'导师沟通')}</div>${x.actions?`<div class="meta">下一步：${esc(x.actions).slice(0,100)}</div>`:''}${auditHTML(x,x.date)}</div>`).join('')||'<div class="empty">还没有导师会议记录。建议每次沟通后把“导师说了什么、下一步做什么”立即记下来。</div>';
 }else if(resourceTab==='figures'){
  body=state.figures.map(x=>`<div class="card" onclick="figureForm('${x.id}')"><div class="row"><div class="title">${esc(x.no||'未编号')} ${esc(x.title)}</div>${statusChip(x.status||'待制作')}</div><div class="meta">${esc(x.kind||'图')} · ${esc(x.chapter||'未指定章节')} · 图题${x.captionChecked?'✓':'○'} · 正文引用${x.citedInText?'✓':'○'} · 来源${x.sourceChecked?'✓':'○'}</div>${x.notes?`<div class="meta">${esc(x.notes)}</div>`:''}${auditHTML(x)}</div>`).join('')||'<div class="empty">还没有图表清单。后期最容易漏的是编号、图题、来源和正文引用。</div>';
 }else if(resourceTab==='milestones'){
  body=state.milestones.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(x=>`<div class="card" onclick="milestoneForm('${x.id}')"><div class="row"><div class="title">${esc(x.title)}</div>${x.date?dueBadge(x.date,x.status==='已完成'):statusChip(x.status||'待完成')}</div><div class="meta">${esc(x.date||'未定日期')} · ${esc(x.status||'待完成')}</div>${auditHTML(x,x.date)}</div>`).join('')||'<div class="empty">还没有时间节点。可添加初稿、预答辩、送审、答辩、定稿等。</div>';
 }else if(resourceTab==='versions'){
  body=state.versions.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(x=>`<div class="card" onclick="versionForm('${x.id}')"><div class="row"><div class="title">${esc(x.name)}</div><span class="chip blue">${esc(x.date||'')}</span></div><div class="meta">${esc(x.stage||'未分类')} · 当时 ${fmt(x.wordCount||0)} 字${x.fileLocation?' · '+esc(x.fileLocation):''}</div>${x.note?`<div class="meta">${esc(x.note)}</div>`:''}${auditHTML(x,x.date)}</div>`).join('')||'<div class="empty">还没有版本记录。形成重要稿件时记一笔，避免“哪个才是最新版”。</div>';
 }else if(resourceTab==='finalcheck'){
  const done=state.finalChecks.filter(x=>x.done).length;body=`<div class="card"><div class="row"><div><div class="title">定稿检查进度</div><div class="meta">建议送审/答辩前逐项清零</div></div><div class="progress-ring" style="--ring:${pct(done,state.finalChecks.length)}%"><b>${done}/${state.finalChecks.length}</b></div></div></div>`+state.finalChecks.map(x=>`<div class="card"><div class="checkrow"><input type="checkbox" ${x.done?'checked':''} onchange="toggleFinalCheck('${x.id}',this.checked)"><div style="flex:1"><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.category)}${x.notes?' · '+esc(x.notes):''}</div>${auditHTML(x)}</div><button class="pill-btn" style="padding:6px 8px" onclick="finalCheckForm('${x.id}')">编辑</button></div></div>`).join('')+`<button class="pill-btn" style="width:100%" onclick="finalCheckForm()">+ 自定义检查项</button>`;
 }else{
  body=state.defense.slice().sort((a,b)=>(a.status==='已完成')-(b.status==='已完成')).map(x=>`<div class="card" onclick="defenseForm('${x.id}')"><div class="row"><div class="title">${esc(x.title)}</div>${statusChip(x.status||'待准备')}</div><div class="meta">${esc(x.type||'答辩事项')} · 熟悉度 ${x.confidence||1}/5</div>${x.answer?`<div class="meta">${esc(x.answer).slice(0,100)}</div>`:''}${auditHTML(x)}</div>`).join('')||'<div class="empty">还没有答辩准备记录。可记录PPT、陈述稿、可能提问、回答要点和材料清单。</div>';
 }
 $('#view-resources').innerHTML=`<div class="page-head"><div><h2>记录中心</h2><div class="sub">资料流程与统计查看合并</div></div></div>${recordsSwitcher('resources')}<div class="section-title" style="margin-top:2px"><h2>资料与流程</h2><span class="sub">从写作到定稿/答辩</span></div><div class="tabs">${tabs.map(t=>`<button class="${resourceTab===t[0]?'active':''}" onclick="resourceTab='${t[0]}';renderResources()">${t[1]}</button>`).join('')}</div>${body}`;
}
function tagsHTML(tags){const arr=String(tags||'').split(/[,，\s]+/).filter(Boolean);return arr.length?`<div>${arr.slice(0,6).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}

function weekStart(date=statsAnchor){const d=dateObj(date),dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return localISO(d)}
function weekData(anchor=statsAnchor){const arr=[],mon=dateObj(weekStart(anchor));for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const k=localISO(d);arr.push({date:k,label:'一二三四五六日'[i],value:wordsOn(k)})}return arr}
function monthBuckets(date=statsAnchor){const d0=dateObj(date),y=d0.getFullYear(),m=d0.getMonth(),days=new Date(y,m+1,0).getDate(),b=[0,0,0,0,0,0];state.writingLogs.forEach(x=>{const d=dateObj(x.date);if(d.getFullYear()===y&&d.getMonth()===m){b[Math.min(5,Math.floor((d.getDate()-1)/5))]+=Number(x.words||0)}});return b.map((v,i)=>({label:i<5?`${i*5+1}-${i*5+5}`:`26-${days}`,value:v}))}
function yearData(year=dateObj(statsAnchor).getFullYear()){return Array.from({length:12},(_,m)=>({label:`${m+1}月`,value:state.writingLogs.filter(x=>{const d=dateObj(x.date);return d.getFullYear()===year&&d.getMonth()===m}).reduce((s,x)=>s+Number(x.words||0),0)}))}
function todaySessions(date=statsAnchor){return state.writingLogs.filter(x=>x.date===date).sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||''))).map((x,i)=>({label:`${i+1}`,value:Number(x.words||0),title:x.note||chapterTitle(x.chapterId)}))}
function barChart(data,labelPrefix=''){const max=Math.max(1,...data.map(x=>x.value));return `<div class="bar-chart">${data.map((x,i)=>`<div class="bar-wrap"><div class="bar ${i===data.length-1?'gold':''}" style="height:${Math.max(2,x.value/max*110)}px"><span class="bar-val">${x.value}</span></div><div class="bar-label">${esc(labelPrefix+x.label)}</div></div>`).join('')}</div>`}
function rangeDates(range,anchor=statsAnchor){const now=dateObj(anchor);if(range==='today')return [localISO(now),localISO(now)];if(range==='week'){const a=weekStart(anchor);return [a,addDays(a,6)]}if(range==='month')return [`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`,localISO(new Date(now.getFullYear(),now.getMonth()+1,0,12))];if(range==='year')return [`${now.getFullYear()}-01-01`,`${now.getFullYear()}-12-31`];return ['0000-01-01','9999-12-31']}
function inDateRange(v,a,b){const d=dateOnly(v);return !!d&&d>=a&&d<=b}
function rangeSummary(range,anchor=statsAnchor){const [a,b]=rangeDates(range,anchor),logs=state.writingLogs.filter(x=>x.date>=a&&x.date<=b),words=logs.reduce((s,x)=>s+Number(x.words||0),0),mins=logs.reduce((s,x)=>s+Number(x.minutes||0),0),problems=state.problems.filter(x=>inDateRange(x.createdAt,a,b)).length,solved=state.problems.filter(x=>inDateRange(x.resolvedAt,a,b)).length,todos=state.todos.filter(x=>x.done&&inDateRange(x.completedAt||x.updatedAt,a,b)).length,feedback=state.feedback.filter(x=>x.status==='已完成'&&inDateRange(x.completedAt||x.updatedAt,a,b)).length,meetings=state.meetings.filter(x=>x.date>=a&&x.date<=b).length;return {words,mins,sessions:logs.length,problems,solved,todos,feedback,meetings}}
function periodLabel(range=statsRange,anchor=statsAnchor){const [a,b]=rangeDates(range,anchor),d=dateObj(anchor);if(range==='today')return formatDateCN(a);if(range==='week')return `${a.replaceAll('-','.')} — ${b.replaceAll('-','.')}`;if(range==='month')return `${d.getFullYear()}年${d.getMonth()+1}月`;if(range==='year')return `${d.getFullYear()}年`;return '累计全部记录'}
function setStatsRange(range){statsRange=range;if(range!=='all'){statsAnchor=iso();calendarCursor=dateObj(statsAnchor);calendarCursor.setDate(1)}renderStats()}
function setStatsAnchor(v){if(!v)return;statsAnchor=dateOnly(v);calendarCursor=dateObj(statsAnchor);calendarCursor.setDate(1);renderStats()}
function moveStatsPeriod(n){if(statsRange==='all')return;const d=dateObj(statsAnchor);if(statsRange==='today')d.setDate(d.getDate()+n);else if(statsRange==='week')d.setDate(d.getDate()+n*7);else if(statsRange==='month'){d.setDate(1);d.setMonth(d.getMonth()+n)}else if(statsRange==='year')d.setFullYear(d.getFullYear()+n);statsAnchor=localISO(d);calendarCursor=dateObj(statsAnchor);calendarCursor.setDate(1);renderStats()}

async function clearAppCache(){if(!confirm('刷新程序缓存不会删除论文记录。确定继续吗？'))return;try{if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}const regs=await navigator.serviceWorker?.getRegistrations?.();if(regs)for(const r of regs)await r.update();alert('程序缓存已清理，即将重新加载。');location.reload()}catch(e){alert('缓存清理未完全完成，可以关闭 App 后重新打开。')}}
function showUsageHelp(){openSheet(`<h3>使用说明</h3><div class="detail-block"><b>建议工作流</b><p>1. 首页看今天优先事项和论文健康度。\n2. 写作时用“开始写作”，结束后登记字数和时长。\n3. 卡点记到“问题”，解决后补解决结果和复盘。\n4. 导师意见、文献、图表、会议、版本、答辩都放在“资料”。\n5. “记录”里可在“资料流程 / 统计分析”间切换；“我的”负责参数、备份和程序管理。</p></div><div class="detail-block"><b>数据安全</b><p>建议每周至少导出一次 JSON，并保存到 iCloud Drive 或电脑。删除网页 App、清理 Safari 网站数据或系统存储清理都可能影响本地记录。</p></div>`)}
function resetAllData(){if(!confirm('第一次确认：真的要清空全部论文数据吗？'))return;if(!confirm('第二次确认：此操作不可撤销。请确认你已经导出 JSON 备份。'))return;localStorage.removeItem(STORAGE_KEY);LEGACY_KEYS.forEach(k=>localStorage.removeItem(k));localStorage.removeItem(SNAPSHOT_KEY);state=load();save();alert('全部论文数据已清空。')}

function renderFocus(){
 $('#view-focus').innerHTML=`<div class="page-head"><div><h2>写作台</h2><div class="sub">章节、问题与专注写作入口合并</div></div></div>${workspaceSwitcher('focus')}<div class="section-title" style="margin-top:2px"><h2>专注写作</h2><button class="pill-btn" style="padding:8px 12px" onclick="go('home')">返回</button></div><div class="focus-wrap"><div style="font-size:12px;opacity:.75">沉浸写作计时</div><div class="timer" id="timer">${timerText()}</div><div class="focus-controls"><button class="go" onclick="toggleFocus()">${focusRunning?'暂停':'开始专注'}</button><button class="ghost" onclick="resetFocus()">重置</button></div></div><div class="card"><div class="title">完成一段后登记成果</div><div class="meta">记录字数、时长、章节和具体小节。章节总字数与小节字数会自动累计。</div><div class="actions"><button class="btn primary" onclick="writingLogForm()">登记本次写作</button></div></div><div class="section-title"><h2>最近写作记录</h2></div>${state.writingLogs.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,12).map(x=>`<div class="card" onclick="writingLogForm('${x.id}')"><div class="row"><div class="title">+${fmt(x.words)} 字</div><span class="chip blue">${esc(x.date)}</span></div><div class="meta">${esc(chapterTitle(x.chapterId))}${x.sectionId?' · '+esc(sectionTitle(x.chapterId,x.sectionId)):''} · ${fmt(x.minutes)} 分钟${x.note?' · '+esc(x.note):''}</div>${auditHTML(x,x.date)}</div>`).join('')||'<div class="empty">还没有写作记录。</div>'}`;
}
function timerText(){const m=Math.floor(focusSeconds/60),s=focusSeconds%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function toggleFocus(){focusRunning=!focusRunning;if(focusRunning){focusTimer=setInterval(()=>{focusSeconds--;const el=$('#timer');if(el)el.textContent=timerText();if(focusSeconds<=0){clearInterval(focusTimer);focusRunning=false;navigator.vibrate?.(200);alert('本轮专注完成，可以登记本次写作了。');focusSeconds=state.settings.focusMinutes*60;renderFocus()}},1000)}else clearInterval(focusTimer);renderFocus()}
function resetFocus(){clearInterval(focusTimer);focusRunning=false;focusSeconds=state.settings.focusMinutes*60;renderFocus()}
function writingLogForm(id,presetCid){const old=state.writingLogs.find(x=>x.id===id)||{date:iso(),chapterId:presetCid||state.settings.defaultChapterId||state.chapters[0]?.id||'',sectionId:'',words:'',minutes:state.settings.focusMinutes,note:''};openSheet(`<h3>${id?'编辑写作记录':'登记本次写作'}</h3><div class="field"><label>日期</label><input id="f-date" type="date" value="${old.date||iso()}"></div><div class="field"><label>所属章节</label><select id="f-ch" onchange="refreshSectionSelect()">${state.chapters.map(c=>`<option value="${c.id}" ${old.chapterId===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><div class="field"><label>具体小节（可选）</label><select id="f-sec"></select></div><div class="form2"><div class="field"><label>本次新增字数</label><input id="f-words" type="number" inputmode="numeric" value="${old.words||''}"></div><div class="field"><label>实际用时（分钟）</label><input id="f-min" type="number" inputmode="numeric" value="${old.minutes||state.settings.focusMinutes}"></div></div><div class="field"><label>本次完成内容</label><textarea id="f-note">${esc(old.note||'')}</textarea></div><div class="actions">${id?`<button class="btn danger" onclick="deleteWritingLog('${id}')">删除</button>`:'<button class="btn soft" onclick="closeSheet()">取消</button>'}<button class="btn primary" onclick="saveWritingLog('${id||''}')">保存</button></div>`);setTimeout(()=>refreshSectionSelect(old.sectionId||''),0)}
function refreshSectionSelect(selected=''){const sel=$('#f-sec'),cid=$('#f-ch')?.value;if(!sel)return;const secs=state.chapters.find(x=>x.id===cid)?.sections||[];sel.innerHTML=`<option value="">不指定小节</option>`+secs.map(s=>`<option value="${s.id}" ${selected===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}
function applyWritingDelta(cid,sid,delta){const c=state.chapters.find(x=>x.id===cid),now=nowStamp();if(c){c.currentWords=Math.max(0,Number(c.currentWords||0)+delta);c.updatedAt=now;c.createdAt=c.createdAt||now}if(c&&sid){const s=c.sections.find(x=>x.id===sid);if(s){s.currentWords=Math.max(0,Number(s.currentWords||0)+delta);s.updatedAt=now;s.createdAt=s.createdAt||now}}}
function saveWritingLog(id){const old=state.writingLogs.find(x=>x.id===id),words=+$('#f-words').value||0,minutes=+$('#f-min').value||0,cid=$('#f-ch').value,sid=$('#f-sec').value;if(words<=0)return alert('请填写本次新增字数');if(old)applyWritingDelta(old.chapterId,old.sectionId,-Number(old.words||0));applyWritingDelta(cid,sid,words);const workDate=$('#f-date').value,times=auditFields(old,workDate);const v={id:id||uid(),date:workDate,chapterId:cid,sectionId:sid,words,minutes,note:$('#f-note').value.trim(),...times};const i=state.writingLogs.findIndex(x=>x.id===id);if(i>=0)state.writingLogs[i]=v;else state.writingLogs.push(v);if(!old&&minutes>0){const ft=auditFields(null,workDate);state.focusLogs.push({id:uid(),date:v.date,minutes,task:v.note,...ft})}closeSheet();save();go('home')}
function deleteWritingLog(id){const x=state.writingLogs.find(v=>v.id===id);if(!x||!confirm('删除后会同步扣减对应章节/小节字数，确定吗？'))return;applyWritingDelta(x.chapterId,x.sectionId,-Number(x.words||0));state.writingLogs=state.writingLogs.filter(v=>v.id!==id);closeSheet();save()}

function literatureForm(id){const x=state.literature.find(v=>v.id===id)||{title:'',authors:'',year:'',language:'中文',paperType:'期刊论文',status:'待阅读',usedIn:'',tags:'',favorite:false,citation:'',notes:''};openSheet(`<h3>${id?'编辑文献':'新增文献卡片'}</h3><div class="field"><label>文献标题</label><input id="f-title" value="${esc(x.title)}"></div><div class="form2"><div class="field"><label>作者</label><input id="f-authors" value="${esc(x.authors)}"></div><div class="field"><label>年份</label><input id="f-year" value="${esc(x.year)}"></div></div><div class="form2"><div class="field"><label>语言</label><select id="f-language">${['中文','英文','其他'].map(s=>`<option ${x.language===s?'selected':''}>${s}</option>`)}</select></div><div class="field"><label>类型</label><select id="f-paperType">${['期刊论文','硕士论文','博士论文','会议论文','专著','标准/规范','报告','其他'].map(s=>`<option ${x.paperType===s?'selected':''}>${s}</option>`)}</select></div></div><div class="form2"><div class="field"><label>阅读状态</label><select id="f-status">${['待阅读','已浏览','已精读','已引用'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`)}</select></div><div class="field"><label>可用于</label><input id="f-used" value="${esc(x.usedIn)}" placeholder="第1章研究现状"></div></div><div class="field"><label>标签（逗号分隔）</label><input id="f-tags" value="${esc(x.tags||'')}" placeholder="易发性, 随机森林, 近五年"></div><div class="field"><label>收藏</label><select id="f-favorite"><option value="0" ${!x.favorite?'selected':''}>普通</option><option value="1" ${x.favorite?'selected':''}>★ 重点文献</option></select></div><div class="field"><label>参考文献格式 / DOI / 链接</label><textarea id="f-citation">${esc(x.citation)}</textarea></div><div class="field"><label>核心观点 / 可引用内容</label><textarea id="f-notes">${esc(x.notes)}</textarea></div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('literature','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveLiterature('${id}')">保存</button></div>`)}
function saveLiterature(id){const old=state.literature.find(x=>x.id===id),times=auditFields(old);const v={id:id||uid(),title:$('#f-title').value.trim(),authors:$('#f-authors').value.trim(),year:$('#f-year').value.trim(),language:$('#f-language').value,paperType:$('#f-paperType').value,status:$('#f-status').value,usedIn:$('#f-used').value.trim(),tags:$('#f-tags').value.trim(),favorite:$('#f-favorite').value==='1',citation:$('#f-citation').value.trim(),notes:$('#f-notes').value.trim(),...times};if(!v.title)return alert('请填写文献标题');const i=state.literature.findIndex(x=>x.id===id);if(i>=0)state.literature[i]=v;else state.literature.push(v);closeSheet();save()}
function feedbackForm(id){const x=state.feedback.find(v=>v.id===id)||{title:'',chapter:'',source:'导师',round:'第1轮修改',priority:'中',status:'待修改',detail:'',createdAt:iso(),completedAt:''};openSheet(`<h3>${id?'编辑修改任务':'新增导师意见 / 修改任务'}</h3><div class="field"><label>修改事项</label><input id="f-title" value="${esc(x.title)}"></div><div class="form2"><div class="field"><label>所属章节</label><input id="f-chapter" value="${esc(x.chapter)}"></div><div class="field"><label>来源</label><select id="f-source">${['导师','自查','盲审','格式规范','预答辩','正式答辩','其他'].map(s=>`<option ${x.source===s?'selected':''}>${s}</option>`)}</select></div></div><div class="field"><label>修改轮次</label><input id="f-round" value="${esc(x.round||'')}" placeholder="例如：导师第2轮 / 预答辩后"></div><div class="form2"><div class="field"><label>优先级</label><select id="f-priority">${['高','中','低'].map(s=>`<option ${x.priority===s?'selected':''}>${s}</option>`)}</select></div><div class="field"><label>状态</label><select id="f-status">${['待修改','进行中','已完成'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`)}</select></div></div><div class="field"><label>具体意见 / 修改说明</label><textarea id="f-detail">${esc(x.detail)}</textarea></div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('feedback','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveFeedback('${id}')">保存</button></div>`)}
function saveFeedback(id){const old=state.feedback.find(x=>x.id===id),status=$('#f-status').value,times=auditFields(old),now=nowStamp();const v={id:id||uid(),title:$('#f-title').value.trim(),chapter:$('#f-chapter').value.trim(),source:$('#f-source').value,round:$('#f-round').value.trim(),priority:$('#f-priority').value,status,detail:$('#f-detail').value.trim(),...times,completedAt:status==='已完成'?(old?.completedAt||now):''};if(!v.title)return alert('请填写修改事项');const i=state.feedback.findIndex(x=>x.id===id);if(i>=0)state.feedback[i]=v;else state.feedback.push(v);closeSheet();save()}
function todoForm(id){const x=state.todos.find(v=>v.id===id)||{title:'',chapter:'',priority:'中',due:'',notes:'',done:false,createdAt:iso(),updatedAt:iso()};openSheet(`<h3>${id?'编辑待办':'新增论文待办'}</h3><div class="field"><label>待办事项</label><input id="f-title" value="${esc(x.title)}"></div><div class="form2"><div class="field"><label>所属章节/模块</label><input id="f-chapter" value="${esc(x.chapter||'')}"></div><div class="field"><label>优先级</label><select id="f-priority">${['高','中','低'].map(s=>`<option ${x.priority===s?'selected':''}>${s}</option>`)}</select></div></div><div class="field"><label>截止日期</label><input id="f-due" type="date" value="${esc(x.due||'')}"></div><div class="field"><label>说明</label><textarea id="f-notes">${esc(x.notes||'')}</textarea></div><div class="field"><label>状态</label><select id="f-done"><option value="0" ${!x.done?'selected':''}>待完成</option><option value="1" ${x.done?'selected':''}>已完成</option></select></div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('todos','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveTodo('${id}')">保存</button></div>`)}

function figureForm(id){const x=state.figures.find(v=>v.id===id)||{kind:'图',no:'',title:'',chapter:'',status:'待制作',captionChecked:false,citedInText:false,sourceChecked:false,notes:''};openSheet(`<h3>${id?'编辑图表':'新增图表清单'}</h3><div class="form2"><div class="field"><label>类型</label><select id="f-kind"><option ${x.kind==='图'?'selected':''}>图</option><option ${x.kind==='表'?'selected':''}>表</option></select></div><div class="field"><label>编号</label><input id="f-no" value="${esc(x.no)}" placeholder="图3-2"></div></div><div class="field"><label>图表名称</label><input id="f-title" value="${esc(x.title)}"></div><div class="form2"><div class="field"><label>所属章节</label><input id="f-chapter" value="${esc(x.chapter)}"></div><div class="field"><label>状态</label><select id="f-status">${['待制作','制作中','待核对','已完成'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`)}</select></div></div><div class="field"><label>检查项</label><select id="f-caption"><option value="0" ${!x.captionChecked?'selected':''}>图题/表题未核对</option><option value="1" ${x.captionChecked?'selected':''}>图题/表题已核对</option></select></div><div class="form2"><div class="field"><label>正文引用</label><select id="f-cited"><option value="0" ${!x.citedInText?'selected':''}>未核对</option><option value="1" ${x.citedInText?'selected':''}>已核对</option></select></div><div class="field"><label>来源/注释</label><select id="f-sourcecheck"><option value="0" ${!x.sourceChecked?'selected':''}>未核对</option><option value="1" ${x.sourceChecked?'selected':''}>已核对</option></select></div></div><div class="field"><label>备注</label><textarea id="f-notes">${esc(x.notes)}</textarea></div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('figures','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveFigure('${id}')">保存</button></div>`)}

function versionForm(id){const x=state.versions.find(v=>v.id===id)||{name:'',date:iso(),stage:'章节稿',note:'',wordCount:totalWords(),fileLocation:''};openSheet(`<h3>${id?'编辑版本':'新增论文版本'}</h3><div class="field"><label>版本名称</label><input id="f-name" value="${esc(x.name)}" placeholder="例如：V3 导师修改稿"></div><div class="form2"><div class="field"><label>日期</label><input id="f-date" type="date" value="${esc(x.date)}"></div><div class="field"><label>阶段</label><select id="f-stage">${['章节稿','初稿','导师修改稿','预答辩稿','送审稿','答辩稿','定稿','其他'].map(s=>`<option ${x.stage===s?'selected':''}>${s}</option>`)}</select></div></div><div class="field"><label>文件位置 / 文件名（可选）</label><input id="f-location" value="${esc(x.fileLocation||'')}" placeholder="例如：iCloud/论文/V3.docx"></div><div class="field"><label>本版本主要变化</label><textarea id="f-note">${esc(x.note||'')}</textarea></div><div class="notice">保存时会自动记录当前论文累计字数：${fmt(totalWords())} 字。</div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('versions','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveVersion('${id}')">保存</button></div>`)}
function saveVersion(id){const old=state.versions.find(x=>x.id===id),eventDate=$('#f-date').value,times=auditFields(old,eventDate);const v={id:id||uid(),name:$('#f-name').value.trim(),date:eventDate,stage:$('#f-stage').value,fileLocation:$('#f-location').value.trim(),note:$('#f-note').value.trim(),wordCount:old?.wordCount??totalWords(),...times};if(!v.name)return alert('请填写版本名称');const i=state.versions.findIndex(x=>x.id===id);if(i>=0)state.versions[i]=v;else state.versions.push(v);closeSheet();save()}
function finalCheckForm(id){const x=state.finalChecks.find(v=>v.id===id)||{category:'自定义',title:'',done:false,notes:''};openSheet(`<h3>${id?'编辑检查项':'新增检查项'}</h3><div class="field"><label>分类</label><input id="f-category" value="${esc(x.category)}"></div><div class="field"><label>检查内容</label><input id="f-title" value="${esc(x.title)}"></div><div class="field"><label>备注</label><textarea id="f-notes">${esc(x.notes||'')}</textarea></div><div class="field"><label>状态</label><select id="f-done"><option value="0" ${!x.done?'selected':''}>未完成</option><option value="1" ${x.done?'selected':''}>已完成</option></select></div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('finalChecks','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveFinalCheck('${id}')">保存</button></div>`)}
function saveFinalCheck(id){const old=state.finalChecks.find(x=>x.id===id),done=$('#f-done').value==='1',times=auditFields(old),now=nowStamp();const v={id:id||uid(),category:$('#f-category').value.trim()||'自定义',title:$('#f-title').value.trim(),notes:$('#f-notes').value.trim(),done,...times,completedAt:done?(old?.completedAt||now):''};if(!v.title)return alert('请填写检查内容');const i=state.finalChecks.findIndex(x=>x.id===id);if(i>=0)state.finalChecks[i]=v;else state.finalChecks.push(v);closeSheet();save()}
function toggleFinalCheck(id,done){const x=state.finalChecks.find(v=>v.id===id);if(x){x.done=done;x.updatedAt=nowStamp();x.createdAt=x.createdAt||x.updatedAt;x.completedAt=done?(x.completedAt||x.updatedAt):'';save()}}
function defenseForm(id){const x=state.defense.find(v=>v.id===id)||{title:'',type:'可能提问',status:'待准备',answer:'',notes:'',confidence:1,createdAt:iso(),updatedAt:iso()};openSheet(`<h3>${id?'编辑答辩准备':'新增答辩准备'}</h3><div class="field"><label>事项 / 问题</label><input id="f-title" value="${esc(x.title)}"></div><div class="form2"><div class="field"><label>类型</label><select id="f-type">${['答辩PPT','自我陈述','可能提问','回答要点','材料清单','模拟答辩','其他'].map(s=>`<option ${x.type===s?'selected':''}>${s}</option>`)}</select></div><div class="field"><label>状态</label><select id="f-status">${['待准备','准备中','已完成'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`)}</select></div></div><div class="field"><label>熟悉度（1=不熟，5=很稳）</label><select id="f-confidence">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(x.confidence)===n?'selected':''}>${n}</option>`)}</select></div><div class="field"><label>回答 / 核心要点</label><textarea id="f-answer">${esc(x.answer||'')}</textarea></div><div class="field"><label>备注</label><textarea id="f-notes">${esc(x.notes||'')}</textarea></div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('defense','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveDefense('${id}')">保存</button></div>`)}
function saveDefense(id){const old=state.defense.find(x=>x.id===id),status=$('#f-status').value,times=auditFields(old),now=nowStamp();const v={id:id||uid(),title:$('#f-title').value.trim(),type:$('#f-type').value,status,confidence:+$('#f-confidence').value||1,answer:$('#f-answer').value.trim(),notes:$('#f-notes').value.trim(),...times,completedAt:status==='已完成'?(old?.completedAt||now):''};if(!v.title)return alert('请填写答辩事项');const i=state.defense.findIndex(x=>x.id===id);if(i>=0)state.defense[i]=v;else state.defense.push(v);closeSheet();save()}

function globalSearch(){openSheet(`<h3>全局搜索</h3><div class="searchbox"><input id="globalQ" placeholder="搜章节、问题、文献、导师意见、待办、图表……" oninput="runGlobalSearch(this.value)" autofocus></div><div id="searchResults"><div class="empty">输入关键词即可搜索全部论文记录。</div></div>`);setTimeout(()=>$('#globalQ')?.focus(),100)}
function runGlobalSearch(q){q=String(q||'').trim().toLowerCase();const box=$('#searchResults');if(!q){box.innerHTML='<div class="empty">输入关键词即可搜索全部论文记录。</div>';return}let r=[];const push=(type,title,text,open)=>{if((title+' '+text).toLowerCase().includes(q))r.push({type,title,text,open})};state.chapters.forEach(x=>{push('章节',x.title,x.notes,`chapterDetail('${x.id}')`);(x.sections||[]).forEach(s=>push('小节',s.title,s.notes,`chapterDetail('${x.id}')`))});state.problems.forEach(x=>push('问题',x.title,[x.description,x.method,x.resolution,x.lesson,x.evidence].join(' '),`problemDetail('${x.id}')`));state.literature.forEach(x=>push('文献',x.title,[x.authors,x.tags,x.notes,x.citation,x.usedIn].join(' '),`literatureForm('${x.id}')`));state.feedback.forEach(x=>push('修改',x.title,x.detail,`feedbackForm('${x.id}')`));state.todos.forEach(x=>push('待办',x.title,x.notes,`todoForm('${x.id}')`));state.meetings.forEach(x=>push('会议',x.topic,[x.notes,x.actions].join(' '),`meetingForm('${x.id}')`));state.figures.forEach(x=>push('图表',(x.no||'')+' '+x.title,x.notes,`figureForm('${x.id}')`));state.versions.forEach(x=>push('版本',x.name,x.note,`versionForm('${x.id}')`));state.defense.forEach(x=>push('答辩',x.title,[x.answer,x.notes].join(' '),`defenseForm('${x.id}')`));box.innerHTML=r.length?r.slice(0,40).map(x=>`<div class="card" onclick="closeSheet();setTimeout(()=>${x.open},50)"><div class="row"><div class="title">${esc(x.title)}</div><span class="chip blue">${x.type}</span></div><div class="meta">${esc(x.text||'').slice(0,110)}</div></div>`).join(''):'<div class="empty">没有找到匹配内容。</div>'}

function settingsForm(){const s=state.settings;openSheet(`<h3>论文与写作设置</h3>
 <div class="field"><label>论文题目</label><input id="f-thesis" value="${esc(s.thesisTitle)}"></div>
 <div class="form2"><div class="field"><label>学校（可选）</label><input id="f-school" value="${esc(s.school||'')}"></div><div class="field"><label>学位类型</label><select id="f-degree">${['硕士','博士','本科'].map(x=>`<option ${s.degreeType===x?'selected':''}>${x}</option>`)}</select></div></div>
 <div class="field"><label>当前阶段</label><select id="f-stage">${['开题后整理','正文写作','导师修改','预答辩准备','送审准备','答辩准备','定稿'].map(x=>`<option ${s.currentStage===x?'selected':''}>${x}</option>`)}</select></div>
 <div class="form2"><div class="field"><label>总目标字数</label><input id="f-total" type="number" value="${s.totalWordGoal}"></div><div class="field"><label>每日目标字数</label><input id="f-daily" type="number" value="${s.dailyWordGoal}"></div></div>
 <div class="field"><label>每周目标字数</label><input id="f-weekly" type="number" value="${s.weeklyWordGoal||10000}"></div>
 <div class="form2"><div class="field"><label>写作开始日期</label><input id="f-start" type="date" value="${s.startDate||iso()}"></div><div class="field"><label>初稿日期</label><input id="f-first" type="date" value="${s.firstDraftDate||''}"></div></div>
 <div class="form2"><div class="field"><label>预计提交日期</label><input id="f-submit" type="date" value="${s.submissionDate||''}"></div><div class="field"><label>预答辩日期</label><input id="f-predef" type="date" value="${s.preDefenseDate||''}"></div></div>
 <div class="form2"><div class="field"><label>正式答辩日期</label><input id="f-defense" type="date" value="${s.defenseDate||''}"></div><div class="field"><label>定稿日期</label><input id="f-final" type="date" value="${s.finalDate||''}"></div></div>
 <div class="form2"><div class="field"><label>专注分钟</label><input id="f-focus" type="number" value="${s.focusMinutes}"></div><div class="field"><label>休息分钟</label><input id="f-break" type="number" value="${s.breakMinutes}"></div></div>
 <div class="field"><label>新写作记录默认章节</label><select id="f-defaultChapter"><option value="">第1章 / 当前首章</option>${state.chapters.map(c=>`<option value="${c.id}" ${s.defaultChapterId===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div>
 <div class="notice">这些参数会影响首页进度、目标、倒计时和完成时间预测。</div><div class="actions"><button class="btn primary" onclick="saveSettings()">保存设置</button></div>`)}
function saveSettings(){state.settings={...state.settings,thesisTitle:$('#f-thesis').value.trim()||'我的硕士学位论文',school:$('#f-school').value.trim(),degreeType:$('#f-degree').value,currentStage:$('#f-stage').value,totalWordGoal:+$('#f-total').value||80000,dailyWordGoal:+$('#f-daily').value||2000,weeklyWordGoal:+$('#f-weekly').value||10000,startDate:$('#f-start').value,firstDraftDate:$('#f-first').value,submissionDate:$('#f-submit').value,preDefenseDate:$('#f-predef').value,defenseDate:$('#f-defense').value,finalDate:$('#f-final').value,focusMinutes:+$('#f-focus').value||25,breakMinutes:+$('#f-break').value||5,defaultChapterId:$('#f-defaultChapter').value,updatedAt:nowStamp()};focusSeconds=state.settings.focusMinutes*60;closeSheet();save()}
function removeItem(key,id){if(!confirm('确定删除这条记录吗？'))return;state[key]=state[key].filter(x=>x.id!==id);closeSheet();save()}
function exportBackup(){maybeSnapshot(true);const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`学术猫论文工作台-V5-备份-${iso()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importBackup(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!v||typeof v!=='object')throw new Error();if(confirm('导入会覆盖当前数据，确定继续吗？')){maybeSnapshot(true);state=normalize(v);save();alert('导入成功')}}catch(e){alert('备份文件无法读取')}};r.readAsText(f)};inp.click()}
function exportCSV(){let rows=[['模块','业务日期','创建时间','最后修改','完成/解决时间','标题','章节/用途','状态','详情']];state.writingLogs.forEach(x=>rows.push(['写作',x.date,x.createdAt||'',x.updatedAt||'', '',`${x.words}字`,chapterTitle(x.chapterId),`${x.minutes}分钟`,x.note||'']));state.problems.forEach(x=>rows.push(['问题',dateOnly(x.createdAt),x.createdAt||'',x.updatedAt||'',x.resolvedAt||'',x.title,x.chapter,x.status,[x.description,x.resolution,x.lesson].join(' | ')]));state.feedback.forEach(x=>rows.push(['修改',dateOnly(x.createdAt),x.createdAt||'',x.updatedAt||'',x.completedAt||'',x.title,x.chapter,x.status,x.detail||'']));state.todos.forEach(x=>rows.push(['待办',dateOnly(x.createdAt),x.createdAt||'',x.updatedAt||'',x.completedAt||'',x.title,x.chapter,x.done?'已完成':'待完成',x.notes||'']));state.literature.forEach(x=>rows.push(['文献','',x.createdAt||'',x.updatedAt||'','',x.title,x.usedIn,x.status,[x.authors,x.year,x.language,x.tags].join(' | ')]));state.meetings.forEach(x=>rows.push(['会议',x.date,x.createdAt||'',x.updatedAt||'','',x.topic,x.withWhom,'',x.actions||x.notes||'']));state.figures.forEach(x=>rows.push(['图表','',x.createdAt||'',x.updatedAt||'','',`${x.no||''} ${x.title}`,x.chapter,x.status,x.notes||'']));state.milestones.forEach(x=>rows.push(['节点',x.date,x.createdAt||'',x.updatedAt||'','',x.title,'',x.status,'']));state.versions.forEach(x=>rows.push(['版本',x.date,x.createdAt||'',x.updatedAt||'','',x.name,x.stage,'',x.note||'']));state.defense.forEach(x=>rows.push(['答辩',dateOnly(x.createdAt),x.createdAt||'',x.updatedAt||'',x.completedAt||'',x.title,x.type,x.status,x.notes||'']));const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`学术猫论文数据-V6.1-${iso()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function manualSnapshot(){maybeSnapshot(true);alert('已创建本地历史快照。最多保留最近 6 份。')}
function snapshotManager(){let arr=[];try{arr=JSON.parse(localStorage.getItem(SNAPSHOT_KEY)||'[]')}catch(e){}openSheet(`<h3>本地历史快照</h3><div class="notice">用于误删或误改后的快速恢复。快照仍保存在本机，不能替代导出到 iCloud/电脑的备份。</div>${arr.map((x,i)=>`<div class="card"><div class="row"><div><div class="title">${esc(x.label||'快照')}</div><div class="meta">${new Date(x.ts).toLocaleString('zh-CN')} · ${fmt((x.state?.chapters||[]).reduce((s,c)=>s+Number(c.currentWords||0),0))}字</div></div><button class="pill-btn" style="padding:7px 9px" onclick="restoreSnapshot('${x.id}')">恢复</button></div></div>`).join('')||'<div class="empty">暂无快照。</div>'}`)}
function restoreSnapshot(id){let arr=[];try{arr=JSON.parse(localStorage.getItem(SNAPSHOT_KEY)||'[]')}catch(e){}const x=arr.find(v=>v.id===id);if(!x||!confirm('恢复该快照会覆盖当前数据，确定吗？'))return;state=normalize(x.state);save();closeSheet();alert('已恢复快照')}

function renderAll(){renderHome();renderChapters();renderProblems();renderResources();renderStats();renderSettings();renderFocus();$('#fab').onclick=()=>{if(currentView==='chapters')chapterForm();else if(currentView==='problems')problemForm();else if(currentView==='focus')writingLogForm();else if(currentView==='resources'){if(resourceTab==='literature')literatureForm();if(resourceTab==='feedback')feedbackForm();if(resourceTab==='todos')todoForm();if(resourceTab==='meetings')meetingForm();if(resourceTab==='figures')figureForm();if(resourceTab==='milestones')milestoneForm();if(resourceTab==='versions')versionForm();if(resourceTab==='finalcheck')finalCheckForm();if(resourceTab==='defense')defenseForm()}else if(currentView==='home')writingLogForm()};$('#fab').style.display=(currentView==='stats'||currentView==='settings')?'none':'block'}
$$('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.view));
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
maybeSnapshot();renderAll();
</script>
</body>
