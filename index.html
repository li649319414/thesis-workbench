<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#102e61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学术猫">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>学术猫·论文工作台 V6.6</title>
<style>
:root{
  --bg:#f6f2e8;--card:#fffdf8;--navy:#102e61;--navy2:#183f7a;--gold:#c99a34;
  --text:#182132;--muted:#717988;--line:#e7e0d5;--good:#2d7d5a;--warn:#b97822;
  --bad:#b95852;--shadow:0 8px 28px rgba(21,36,63,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:rgba(246,242,232,.92);backdrop-filter:blur(16px);padding:14px 18px 10px;border-bottom:1px solid rgba(231,224,213,.7)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:48px;height:48px;border-radius:15px;object-fit:cover;box-shadow:var(--shadow);background:#fff;border:1px solid rgba(201,154,52,.18)}
.brand h1{font-size:18px;margin:0;color:var(--navy);font-weight:800;letter-spacing:.2px}
.brand p{font-size:12px;margin:3px 0 0;color:var(--muted)}
.view{display:none;padding:14px 14px 28px;max-width:760px;margin:0 auto}
.view.active{display:block}
.hero{background:linear-gradient(135deg,#102e61,#1a447f);color:#fff;border-radius:24px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-35px;bottom:-38px;width:170px;height:170px;border:2px solid rgba(202,154,52,.32);border-radius:50%;box-shadow:0 0 0 22px rgba(202,154,52,.08),0 0 0 46px rgba(202,154,52,.05)}
.hero-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.hero .eyebrow{font-size:12px;opacity:.78}.hero .big{font-size:30px;font-weight:850;margin-top:7px}.hero .big small{font-size:13px;font-weight:600;opacity:.8}
.progress{height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin:14px 0 8px}
.progress>span{height:100%;display:block;background:linear-gradient(90deg,#f2c565,#c99a34);border-radius:99px}
.hero-note{font-size:12px;opacity:.83}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 8px;text-align:center;box-shadow:0 3px 12px rgba(15,35,65,.03)}.stat.editable{cursor:pointer;position:relative}.stat.editable:after{content:'可设置';position:absolute;right:7px;top:6px;font-size:8px;color:var(--gold);font-weight:750}.stat.editable:active{transform:scale(.985)}
.stat .label{font-size:10px;color:var(--muted);white-space:nowrap}.stat .num{font-size:18px;font-weight:800;color:var(--navy);margin-top:5px}.stat .unit{font-size:10px;font-weight:600}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}
.section-title h2{font-size:16px;margin:0;color:var(--navy)}.section-title .sub{font-size:11px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:15px;text-align:left;box-shadow:0 4px 14px rgba(18,46,97,.04);color:var(--text)}
.iconbox{width:36px;height:36px;border-radius:12px;background:#f7f2e8;color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;margin-bottom:9px;border:1px solid rgba(201,154,52,.18)}
.quick strong{display:block;color:var(--navy);font-size:14px}.quick span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 4px 14px rgba(18,46,97,.035);margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.row-start{display:flex;gap:10px;align-items:flex-start}
.title{font-weight:760;color:var(--text);font-size:14px}.meta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.55}
.chip{display:inline-flex;align-items:center;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:700}
.chip.good{color:var(--good);background:#eaf5ee}.chip.warn{color:var(--warn);background:#fff2dc}.chip.bad{color:var(--bad);background:#fbe8e5}.chip.blue{color:var(--navy);background:#e8eef8}
.small-progress{height:6px;background:#ece8e0;border-radius:99px;overflow:hidden;margin:10px 0 3px}.small-progress span{display:block;height:100%;background:var(--navy);border-radius:99px}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:30;border:0;width:54px;height:54px;border-radius:50%;background:var(--navy);color:#fff;font-size:26px;box-shadow:0 10px 25px rgba(16,46,97,.28)}
.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:99px;color:var(--muted);font-size:12px}
.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,253,248,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;overflow:hidden;gap:2px;justify-content:space-around}
.bottomnav::-webkit-scrollbar{display:none}
.navbtn{border:0;background:transparent;color:#8a8f98;font-size:10px;padding:4px 4px;flex:1;min-width:0}.navbtn .ico{font-size:18px;display:block;line-height:22px}.navbtn.active{color:var(--gold);font-weight:800}
.sheet-wrap{display:none;position:fixed;inset:0;z-index:100;background:rgba(12,18,30,.33);align-items:flex-end}.sheet-wrap.open{display:flex}
.sheet{width:100%;max-height:88vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:14px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px rgba(0,0,0,.15)}
.handle{width:42px;height:5px;background:#d8d2c8;border-radius:99px;margin:0 auto 14px}.sheet h3{margin:0 0 14px;color:var(--navy);font-size:18px}
.field{margin:10px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;padding:12px 13px;border-radius:13px;outline:none;font-size:16px;color:var(--text)}
.field textarea{min-height:86px;resize:vertical}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions{display:flex;gap:9px;margin-top:15px}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:750}.btn.primary{background:var(--navy);color:#fff;flex:1}.btn.soft{background:#ebe7df;color:var(--navy)}.btn.danger{background:#fbe8e5;color:var(--bad)}
.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:8px}.toolbar button{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:8px 10px;font-size:11px;color:var(--navy)}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;overflow:hidden}
.bar-chart{height:150px;display:flex;align-items:flex-end;gap:8px;padding:20px 4px 0;border-bottom:1px solid var(--line)}
.bar-wrap{flex:1;text-align:center;min-width:0}.bar{background:var(--navy);border-radius:6px 6px 2px 2px;min-height:2px;position:relative}.bar.gold{background:var(--gold)}
.bar-val{font-size:9px;color:var(--muted);position:absolute;top:-16px;left:50%;transform:translateX(-50%)}.bar-label{font-size:9px;color:var(--muted);margin-top:5px}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.summary{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px}.summary .l{font-size:10px;color:var(--muted)}.summary .n{font-size:21px;font-weight:850;color:var(--navy);margin-top:4px}
.focus-wrap{text-align:center;background:linear-gradient(145deg,#102e61,#173d75);color:white;border-radius:24px;padding:22px 16px;margin-bottom:12px}
.timer{width:190px;height:190px;border-radius:50%;border:3px solid rgba(201,154,52,.9);display:flex;align-items:center;justify-content:center;margin:18px auto;font-size:42px;font-weight:800}
.focus-controls{display:flex;justify-content:center;gap:9px}.focus-controls button{border:0;border-radius:99px;padding:10px 18px;font-weight:750}.focus-controls .go{background:#f2d48d;color:#102e61}.focus-controls .ghost{background:rgba(255,255,255,.14);color:#fff}
.detail-block{background:#f7f3eb;border-radius:13px;padding:11px;margin-top:9px}.detail-block b{font-size:11px;color:var(--navy)}.detail-block p{font-size:12px;line-height:1.6;margin:5px 0 0;color:#454c58;white-space:pre-wrap}
.kpi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:9px 0 12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}.kpi b{display:block;color:var(--navy);font-size:19px}.kpi span{font-size:10px;color:var(--muted)}
.notice{font-size:11px;color:var(--muted);background:#efeae1;border-radius:12px;padding:10px 12px;line-height:1.6}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill-btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;color:var(--navy);font-weight:700}

.top-search{margin-left:auto;width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--navy);font-size:22px;display:flex;align-items:center;justify-content:center}
.health{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.health .hcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px}
.health .hlabel{font-size:10px;color:var(--muted)}.health .hnum{font-size:17px;font-weight:850;color:var(--navy);margin-top:4px;line-height:1.35}
.goodtxt{color:var(--good)!important}.warntxt{color:var(--warn)!important}.badtxt{color:var(--bad)!important}
.due-badge{font-size:10px;padding:4px 7px;border-radius:99px;background:#f2eee7;color:var(--muted);white-space:nowrap}
.due-badge.overdue{background:#fbe8e5;color:var(--bad)}.due-badge.today{background:#fff2dc;color:var(--warn)}
.searchbox{position:sticky;top:-14px;background:var(--card);padding:2px 0 9px;z-index:2}.searchbox input{width:100%;border:1px solid var(--line);background:#fff;padding:12px 13px;border-radius:13px;font-size:16px}
.checkrow{display:flex;gap:10px;align-items:flex-start}.checkrow input{width:20px;height:20px;margin-top:1px;flex:0 0 auto}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;min-width:0}.calendar-head button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;color:var(--navy);flex:0 0 auto}.calendar-head .title{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;width:100%;overflow:hidden}.cal-week{font-size:9px;color:var(--muted);text-align:center;padding:4px 0;min-width:0}
.cal-day{width:100%;min-width:0;padding:0;aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:10px;color:var(--muted);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.cal-day.empty{border-color:transparent;background:transparent}
.cal-day.lv1{background:#edf1f7}.cal-day.lv2{background:#cfd9e8;color:#27466f}.cal-day.lv3{background:#91a8c8;color:#fff}.cal-day.lv4{background:#173d75;color:#fff}.cal-day.today{outline:2px solid var(--gold)}.cal-dot{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.alert-card{border-left:4px solid var(--warn)}.alert-card.danger{border-left-color:var(--bad)}
.tag{display:inline-block;font-size:9px;padding:3px 6px;border-radius:7px;background:#eef2f8;color:var(--navy);margin:3px 3px 0 0}
.star{color:var(--gold);font-size:16px}.section-mini{background:#f8f5ef;border:1px solid var(--line);border-radius:13px;padding:10px;margin-top:8px}
.segment{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}.segment button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;padding:9px 6px;font-size:11px}.segment button.active{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:800}
.period-nav{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;margin:0 0 8px}.period-nav>button{border:1px solid var(--line);background:var(--card);color:var(--navy);border-radius:11px;padding:10px 9px;font-size:11px;font-weight:700}.period-center{min-width:0;text-align:center}.period-center b{display:block;color:var(--navy);font-size:12px;margin-bottom:5px}.period-center input{width:100%;max-width:180px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;color:var(--text);font-size:12px}.time-meta{margin-top:6px;color:#8a7b65;font-size:10px}.week-jump{cursor:pointer}.week-jump:active{transform:scale(.995)}
.spark{display:flex;align-items:flex-end;gap:5px;height:95px;padding-top:18px;border-bottom:1px solid var(--line)}.spark .bar-wrap{height:100%;display:flex;flex-direction:column;justify-content:flex-end}.spark .bar{width:100%}
.progress-ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--navy) var(--ring),#e9e5dd 0);position:relative}.progress-ring:after{content:"";position:absolute;inset:6px;background:var(--card);border-radius:50%}.progress-ring b{position:relative;z-index:1;font-size:11px;color:var(--navy)}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mini-cell{background:#f8f5ef;border-radius:12px;padding:9px;text-align:center}.mini-cell b{font-size:16px;color:var(--navy);display:block}.mini-cell span{font-size:9px;color:var(--muted)}
.badge-num{display:inline-flex;min-width:22px;height:22px;padding:0 6px;align-items:center;justify-content:center;border-radius:99px;background:#eef2f8;color:var(--navy);font-size:10px;font-weight:800}


.analysis-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px;overflow:hidden}
.analysis-card .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}.analysis-card .head .title{font-size:13px}.analysis-card .head .meta{margin-top:2px;text-align:right}
.goal-line{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:8px}.goal-line b{font-size:23px;color:var(--navy)}.goal-line span{font-size:10px;color:var(--muted)}
.insight-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}.insight-cell{background:#f8f5ef;border:1px solid var(--line);border-radius:13px;padding:10px;min-width:0}.insight-cell .k{font-size:9px;color:var(--muted)}.insight-cell .v{font-size:17px;font-weight:850;color:var(--navy);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.insight-cell .d{font-size:9px;margin-top:3px;color:var(--muted)}
.compare-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.compare-cell{background:#f8f5ef;border-radius:12px;padding:9px 7px;text-align:center;min-width:0}.compare-cell b{font-size:13px;display:block;color:var(--navy);white-space:nowrap}.compare-cell span{display:block;font-size:8px;color:var(--muted);margin-top:3px}.delta-up{color:var(--good)!important}.delta-down{color:var(--bad)!important}.delta-flat{color:var(--muted)!important}
.closure-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.closure-box{background:#f8f5ef;border:1px solid var(--line);border-radius:14px;padding:11px}.closure-box .name{font-size:11px;font-weight:800;color:var(--navy)}.closure-box .nums{font-size:18px;font-weight:850;color:var(--text);margin-top:6px}.closure-box .desc{font-size:9px;color:var(--muted);line-height:1.5;margin-top:4px}
.chapter-progress-list{display:grid;gap:8px}.chapter-progress-item{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px;cursor:pointer;overflow:hidden}.chapter-progress-item .chapter-meta{font-size:9px;color:var(--muted);margin-top:4px}.chapter-progress-item .row{min-width:0}.chapter-progress-item .title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.analysis-note{font-size:9px;color:var(--muted);line-height:1.55;margin-top:7px}

@media (max-width:390px){.stats4{grid-template-columns:repeat(2,1fr)}.segment{grid-template-columns:repeat(5,1fr)}.period-nav{grid-template-columns:1fr 1.25fr 1fr}.period-nav>button{padding:9px 4px;font-size:10px}.calendar-grid{gap:4px}.cal-day{font-size:9px;border-radius:8px}.calendar-head button{padding:5px 8px}.calendar-head .title{font-size:13px}.compare-grid{gap:5px}.compare-cell{padding:8px 4px}.closure-row{grid-template-columns:1fr}.insight-grid{gap:6px}}

.settings-page-head{display:flex;align-items:center;gap:12px;margin:2px 2px 16px}
.settings-page-head img{width:54px;height:54px;border-radius:16px;object-fit:cover}
.settings-page-head h2{margin:0;color:var(--navy);font-size:19px}.settings-page-head p{margin:4px 0 0;color:var(--muted);font-size:11px}
.settings-section{margin:18px 0 8px}.settings-section h3{margin:0 2px 8px;color:var(--navy);font-size:14px}.settings-section .desc{font-size:10px;color:var(--muted);margin:-3px 2px 9px}
.setting-row{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 13px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.setting-row .left{min-width:0}.setting-row .name{font-size:13px;font-weight:750}.setting-row .value{font-size:10px;color:var(--muted);margin-top:3px;word-break:break-all}.setting-row .chev{color:#a0a5ad;font-size:18px}
.danger-zone{border:1px solid #efd0cc;background:#fff9f8}.version-badge{display:inline-flex;padding:3px 7px;border-radius:99px;background:#e8eef8;color:var(--navy);font-size:10px;font-weight:800}


.workspace-switch,.records-switch{margin:2px 0 12px}
.page-head{display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px}
.page-head h2{margin:0;color:var(--navy);font-size:17px}
.page-head .sub{font-size:11px;color:var(--muted)}


.today-progress-card{padding:13px 14px}.today-progress-card .top{display:flex;justify-content:space-between;align-items:center;gap:10px}.today-progress-card .pct{font-size:20px;font-weight:850;color:var(--navy)}
.health-status{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:800}.health-status.good{background:#eaf5ee;color:var(--good)}.health-status.warn{background:#fff2dc;color:var(--warn)}.health-status.bad{background:#fbe8e5;color:var(--bad)}
.priority-list .card{padding:12px}.priority-no{width:25px;height:25px;border-radius:9px;background:#f3ead6;color:#8a681f;display:grid;place-items:center;font-size:11px;font-weight:850;flex:0 0 auto}
.continue-card{border-left:4px solid var(--gold);cursor:pointer}.continue-card:active{transform:scale(.995)}
.workload-line{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.workload-line>div{background:#f8f5ef;border-radius:11px;padding:9px;text-align:center}.workload-line b{display:block;color:var(--navy);font-size:15px}.workload-line span{font-size:9px;color:var(--muted)}

 ['参考文献','正文引用与参考文献一一对应'],['参考文献','中英文参考文献格式统一'],['参考文献','作者、年份、期刊卷期页码已核对'],
 ['格式','字体字号、行距、页边距符合要求'],['格式','页眉页脚、页码及分节正确'],['格式','图表清晰度与分辨率已检查'],

 ],

};
function clone(x){return JSON.parse(JSON.stringify(x))}
function normalize(v){
 const n=Object.assign(clone(defaults),v||{});
 n.settings=Object.assign({},defaults.settings,(v&&v.settings)||{});if(!n.settings.dailyGoals||typeof n.settings.dailyGoals!=='object'||Array.isArray(n.settings.dailyGoals))n.settings.dailyGoals={};
 n.ui=Object.assign({},defaults.ui,(v&&v.ui)||{});n.ui.collapsedChapters=Object.assign({},n.ui.collapsedChapters||{});

 keys.forEach(k=>{if(!Array.isArray(n[k]))n[k]=[]});
 const migrated=nowStamp();
 const withLegacyTime=(x,fallback='')=>{x=Object.assign({},x);if(!x.createdAt&&fallback)x.createdAt=fallback;if(!x.createdAt&&!x.migratedAt)x.migratedAt=migrated;if(!x.updatedAt&&x.createdAt)x.updatedAt=x.createdAt;return x};
 n.chapters=n.chapters.map(c=>{const base=withLegacyTime(Object.assign({id:uid(),title:'未命名章节',targetWords:0,currentWords:0,status:'未开始',notes:'',sections:[],tasks:[]},c));base.tasks=(Array.isArray(c.tasks)?c.tasks:[]).map(t=>withLegacyTime(Object.assign({id:uid(),title:'未命名任务',priority:'中',due:'',done:false,notes:'',sectionId:''},t),t.createdAt||''));base.sections=(Array.isArray(c.sections)?c.sections:[]).map(sec=>{const s=withLegacyTime(Object.assign({id:uid(),title:'未命名小节',targetWords:0,currentWords:0,status:'未开始',notes:'',checks:{}},sec));s.checks=Object.assign({text:false,figures:false,citations:false,feedback:false},sec.checks||{});return s});return base});

function saveTodayGoal(){const el=$('#f-today-goal');if(!el)return;const raw=el.value.trim();if(raw==='')return alert('请输入今日目标字数');const v=Number(raw);if(!Number.isFinite(v)||v<0)return alert('请输入 0 或更大的数字');state.settings.dailyGoals=state.settings.dailyGoals||{};state.settings.dailyGoals[iso()]=Math.round(v);state.settings.updatedAt=nowStamp();closeSheet();save()}
function resetTodayGoal(){state.settings.dailyGoals=state.settings.dailyGoals||{};delete state.settings.dailyGoals[iso()];state.settings.updatedAt=nowStamp();closeSheet();save()}

function todayGoalProgress(){const g=dailyGoal(),w=todayWords();return {goal:g,words:w,pct:pct(w,g),remain:Math.max(0,g-w)}}
function workloadSummary(){const remain=Math.max(0,Number(state.settings.totalWordGoal||0)-totalWords()),sub=state.settings.submissionDate,days=sub?Math.max(0,daysBetween(iso(),sub)):null,required=days&&remain?Math.ceil(remain/days):remain?remain:0;return {remain,days,required}}
function healthLevel(){const h=healthSummary(),w=workloadSummary(),avg=Math.max(0,h.pred.avg||0);let level='正常',cls='good';if(h.late||h.overdue>=2||h.high>=3||(w.required>0&&avg>0&&w.required>avg*1.5)){level='紧张';cls='bad'}else if(h.high||h.overdue||h.late||(w.required>0&&avg>0&&w.required>avg*1.15)){level='注意';cls='warn'}return {level,cls}}
function lastWriting(){return state.writingLogs.slice().sort((a,b)=>String(b.updatedAt||b.createdAt||b.date).localeCompare(String(a.updatedAt||a.createdAt||a.date)))[0]||null}
function continueLastWriting(){const x=lastWriting();if(x){focusPresetChapterId=x.chapterId||'';focusPresetSectionId=x.sectionId||''}go('focus')}
function todayRoutes(){return state.writingRoutes.filter(x=>x.date===iso()).sort((a,b)=>(a.done-b.done)||(Number(a.order||0)-Number(b.order||0))||String(a.createdAt||'').localeCompare(String(b.createdAt||'')))}
function routeLabel(x){return `${chapterTitle(x.chapterId)}${x.sectionId?' · '+sectionTitle(x.chapterId,x.sectionId):''}`}
function startRoute(id){const x=state.writingRoutes.find(v=>v.id===id);if(!x)return;focusPresetChapterId=x.chapterId||'';focusPresetSectionId=x.sectionId||'';go('focus')}
function todayPriorityItems(limit=3){let items=[];todayRoutes().filter(x=>!x.done).forEach(x=>items.push({score:95,type:'写作路线',title:x.title||routeLabel(x),meta:routeLabel(x),open:`startRoute('${x.id}')`}));state.todos.filter(x=>!x.done).forEach(x=>{let score=x.priority==='高'?80:x.priority==='中'?55:35;if(x.due){const d=daysBetween(iso(),x.due);if(d<0)score+=35;else if(d===0)score+=25;else if(d<=2)score+=12}items.push({score,type:'待办',title:x.title,meta:`${x.chapter||'未指定章节'}${x.due?' · '+x.due:''}`,open:`todoForm('${x.id}')`})});state.problems.filter(x=>x.status!=='已解决').forEach(x=>items.push({score:x.priority==='高'?85:x.priority==='中'?50:30,type:'问题',title:x.title,meta:`${x.priority||'中'}优先级 · 已卡 ${blockerDays(x)} 天`,open:`problemDetail('${x.id}')`}));state.feedback.filter(x=>x.status!=='已完成').forEach(x=>items.push({score:x.priority==='高'?82:x.priority==='中'?48:28,type:'修改',title:x.title,meta:`${x.round||'修改任务'} · ${x.chapter||'未指定章节'}`,open:`feedbackForm('${x.id}')`}));state.chapters.forEach(c=>(c.tasks||[]).filter(t=>!t.done).forEach(t=>{let score=t.priority==='高'?75:t.priority==='中'?45:25;if(t.due&&daysBetween(iso(),t.due)<=0)score+=20;items.push({score,type:'章节任务',title:t.title,meta:`${c.title}${t.due?' · '+t.due:''}`,open:`chapterDetail('${c.id}')`})}));return items.sort((a,b)=>b.score-a.score).slice(0,limit)}
function blockerDays(x){if(!x||x.status==='已解决')return 0;const d=dateOnly(x.createdAt||x.migratedAt||iso());return Math.max(0,daysBetween(d,iso()))}
function sectionCheckPct(s){const c=Object.assign({text:false,figures:false,citations:false,feedback:false},s?.checks||{}),vals=Object.values(c);return Math.round(vals.filter(Boolean).length/vals.length*100)}
function sectionChecksHTML(s){const c=Object.assign({text:false,figures:false,citations:false,feedback:false},s?.checks||{});return `<div class="check-pills"><span class="check-pill ${c.text?'done':''}">正文${c.text?'✓':'○'}</span><span class="check-pill ${c.figures?'done':''}">图表${c.figures?'✓':'○'}</span><span class="check-pill ${c.citations?'done':''}">引文${c.citations?'✓':'○'}</span><span class="check-pill ${c.feedback?'done':''}">修改${c.feedback?'✓':'○'}</span></div>`}
function relatedSectionText(key){if(!key)return '';const [cid,sid]=String(key).split('::');return `${chapterTitle(cid)} · ${sectionTitle(cid,sid)}`}
function submissionReadiness(){const checksDone=state.finalChecks.filter(x=>x.done).length,checksTotal=state.finalChecks.length,figOpen=state.figures.filter(x=>x.status!=='已完成'||!x.citedInText||!x.captionChecked||!x.sourceChecked).length,litOpen=state.literature.filter(x=>x.status!=='已引用').length,openProblems=state.problems.filter(x=>x.status!=='已解决'&&x.priority==='高').length,score=Math.max(0,Math.round((checksTotal?checksDone/checksTotal*70:0)+(figOpen===0?15:Math.max(0,15-figOpen*3))+(openProblems===0?10:Math.max(0,10-openProblems*3))+(state.literature.length&&litOpen<state.literature.length?5:0)));let level='需继续完善',cls='bad';if(score>=90){level='基本就绪';cls='good'}else if(score>=70){level='接近就绪';cls='warn'}return {checksDone,checksTotal,figOpen,litOpen,openProblems,score,level,cls}}


function pct(a,b){return b?Math.max(0,Math.min(100,Math.round(Number(a||0)/Number(b)*100))):0}
function chapterTitle(id){return state.chapters.find(x=>x.id===id)?.title||'未指定章节'}
function sectionTitle(cid,sid){return state.chapters.find(x=>x.id===cid)?.sections?.find(x=>x.id===sid)?.title||''}
function streak(){
 if(state.settings.countStreak===false)return 0;
 const dates=new Set(state.writingLogs.filter(x=>Number(x.words)>0).map(x=>x.date));if(!dates.size)return 0;
 let d=dateObj(iso()),n=0;if(!dates.has(localISO(d))){d.setDate(d.getDate()-1);if(!dates.has(localISO(d)))return 0}
 while(dates.has(localISO(d))){n++;d.setDate(d.getDate()-1)}return n;
}
function statusChip(s){const cls=['已解决','已完成','已引用','已精读'].includes(s)?'good':(['未解决','高','逾期'].includes(s)?'bad':'warn');return `<span class="chip ${cls}">${esc(s)}</span>`}
function dueBadge(d,done=false){if(!d||done)return '';const diff=daysBetween(iso(),d);const cls=diff<0?'overdue':diff===0?'today':'';const txt=diff<0?`逾期 ${Math.abs(diff)} 天`:diff===0?'今天截止':`剩 ${diff} 天`;return `<span class="due-badge ${cls}">${txt}</span>`}
function recentDailyAvg(days=14){let sum=0;for(let i=0;i<days;i++)sum+=wordsOn(addDays(iso(),-i));return Math.round(sum/days)}
function predictedDate(){const remain=Math.max(0,Number(state.settings.totalWordGoal||0)-totalWords()),avg=recentDailyAvg(14);if(remain<=0)return {date:iso(),avg,days:0};if(avg<=0)return {date:'—',avg,days:null};const days=Math.ceil(remain/avg);return {date:addDays(iso(),days),avg,days}}
function unresolvedHigh(){return state.problems.filter(x=>x.status!=='已解决'&&x.priority==='高').length+state.feedback.filter(x=>x.status!=='已完成'&&x.priority==='高').length}
function overdueTodos(){return state.todos.filter(x=>!x.done&&x.due&&daysBetween(iso(),x.due)<0).length}
function healthSummary(){const pred=predictedDate(),sub=state.settings.submissionDate,late=pred.date!=='—'&&sub&&daysBetween(sub,pred.date)>0;return {pred,late,high:unresolvedHigh(),overdue:overdueTodos()}}
function formatDateCN(s){if(!s)return '—';const d=dateObj(s);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}

function navGroup(view){if(['problems','focus'].includes(view))return 'chapters';return view}
function workspaceSwitcher(active){return `<div class="segment workspace-switch" style="grid-template-columns:repeat(3,1fr)"><button class="${active==='chapters'?'active':''}" onclick="go('chapters')">章节管理</button><button class="${active==='problems'?'active':''}" onclick="go('problems')">问题答疑</button><button class="${active==='focus'?'active':''}" onclick="go('focus')">专注写作</button></div>`}
function recordsSwitcher(active){return `<div class="segment records-switch" style="grid-template-columns:repeat(2,1fr)"><button class="${active==='resources'?'active':''}" onclick="go('resources')">资料流程</button><button class="${active==='stats'?'active':''}" onclick="go('stats')">统计分析</button></div>`}

function go(view){currentView=view;$$('.view').forEach(v=>v.classList.remove('active'));$('#view-'+view).classList.add('active');const group=navGroup(view);$$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===group));$('#bottomnav').style.display='flex';$('#fab').style.display=(view==='stats'||view==='settings')?'none':'block';window.scrollTo({top:0,behavior:'instant'});renderAll()}
function openSheet(html){$('#sheetContent').innerHTML=html;$('#sheetWrap').classList.add('open')}
function closeSheet(){$('#sheetWrap').classList.remove('open')}
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet()});

 const total=totalWords(),goal=Number(state.settings.totalWordGoal||80000),p=pct(total,goal),dleft=Math.max(0,daysBetween(iso(),state.settings.defenseDate)),todayGoal=dailyGoal(iso()),tg=todayGoalProgress(),wl=workloadSummary(),hl=healthLevel();
 const unresolved=state.problems.filter(x=>x.status!=='已解决').length,todoPending=state.todos.filter(x=>!x.done).length,h=healthSummary(),last=lastWriting(),top3=todayPriorityItems(3);
 $('#view-home').innerHTML=`

 <div class="card today-progress-card" onclick="todayGoalForm()"><div class="top"><div><div class="title">今日完成度</div><div class="meta">${fmt(tg.words)} / ${fmt(tg.goal)} 字${tg.remain?` · 还差 ${fmt(tg.remain)} 字`:' · 今日目标已完成'}</div></div><div class="pct">${tg.pct}%</div></div><div class="small-progress"><span style="width:${tg.pct}%"></span></div></div>
 ${last?`<div class="card continue-card" onclick="continueLastWriting()"><div class="row"><div><div class="title">继续上次写作</div><div class="meta">${esc(chapterTitle(last.chapterId))}${last.sectionId?' · '+esc(sectionTitle(last.chapterId,last.sectionId)):''} · 上次 +${fmt(last.words)} 字</div></div><span class="chip warn">继续 ›</span></div></div>`:''}
 <div class="section-title"><h2>今日三件事</h2><span class="sub">自动按紧急程度排序</span></div><div class="priority-list">${top3.length?top3.map((x,i)=>`<div class="card" onclick="${x.open}"><div class="row-start"><div class="priority-no">${i+1}</div><div style="flex:1;min-width:0"><div class="row"><div class="title">${esc(x.title)}</div><span class="chip blue">${esc(x.type)}</span></div><div class="meta">${esc(x.meta)}</div></div></div></div>`).join(''):'<div class="card"><div class="title">今天没有紧急事项</div><div class="meta">可以从“开始写作”或“今日写作路线”安排下一步。</div></div>'}</div>
 <div class="section-title"><h2>论文健康度</h2><span class="health-status ${hl.cls}">${hl.level}</span></div>
 <div class="health"><div class="hcard"><div class="hlabel">近14日日均</div><div class="hnum">${fmt(h.pred.avg)} 字/天</div></div><div class="hcard"><div class="hlabel">预计达到目标</div><div class="hnum ${h.late?'badtxt':'goodtxt'}">${h.pred.date==='—'?'暂无足够数据':formatDateCN(h.pred.date)}</div></div><div class="hcard"><div class="hlabel">高优先级未闭环</div><div class="hnum ${h.high?'badtxt':'goodtxt'}">${h.high} 项</div></div><div class="hcard"><div class="hlabel">逾期待办</div><div class="hnum ${h.overdue?'badtxt':'goodtxt'}">${h.overdue} 项</div></div></div>
 <div class="card"><div class="title">距提交的剩余工作量</div><div class="workload-line"><div><b>${fmt(wl.remain)}</b><span>剩余字数</span></div><div><b>${wl.days===null?'—':wl.days}</b><span>距提交天数</span></div><div><b>${wl.days===null?'—':fmt(wl.required)}</b><span>建议日均字数</span></div></div></div>

 ${urgentBlock()}<div class="section-title"><h2>最近动态</h2><span class="sub">所有模块自动汇总</span></div>${recentActivity()}`;

function urgentBlock(){
 let items=[];
 state.todos.filter(x=>!x.done&&x.due).forEach(x=>items.push({score:daysBetween(iso(),x.due)<0?100:40,date:x.due,title:x.title,meta:`待办 · ${x.priority||'中'}优先级`,open:`todoForm('${x.id}')`,danger:daysBetween(iso(),x.due)<0}));
 state.problems.filter(x=>x.status!=='已解决'&&x.priority==='高').forEach(x=>items.push({score:80,date:x.createdAt,title:x.title,meta:'高优先级问题未解决',open:`problemDetail('${x.id}')`,danger:true}));
 state.feedback.filter(x=>x.status!=='已完成'&&x.priority==='高').forEach(x=>items.push({score:75,date:x.createdAt,title:x.title,meta:'高优先级修改未完成',open:`feedbackForm('${x.id}')`,danger:true}));
 items.sort((a,b)=>b.score-a.score||String(a.date).localeCompare(String(b.date)));if(!items.length)return '';
 return `<div class="section-title"><h2>需要优先处理</h2><span class="sub">${items.length} 项</span></div>${items.slice(0,5).map(x=>`<div class="card alert-card ${x.danger?'danger':''}" onclick="${x.open}"><div class="row"><div><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.meta)}</div></div>${x.date?dueBadge(x.date,false):''}</div></div>`).join('')}`;
}
function recentActivity(){
 let items=[];
 const add=(x,title,meta,fallback='')=>items.push({time:x.updatedAt||x.createdAt||fallback||x.date||'',title,meta});
 state.writingLogs.forEach(x=>add(x,`写作 +${x.words} 字`,x.note||chapterTitle(x.chapterId),x.date));
 state.problems.forEach(x=>add(x,`问题：${x.title}`,`${x.status} · ${x.type||'未分类'}`));
 state.feedback.forEach(x=>add(x,`修改：${x.title}`,`${x.status} · ${x.source||'未注明来源'}`));
 state.todos.forEach(x=>add(x,`待办：${x.title}`,x.done?'已完成':'待完成'));
 state.versions.forEach(x=>add(x,`版本：${x.name}`,`${x.stage||'版本记录'} · ${fmt(x.wordCount||0)}字`,x.date));
 state.defense.forEach(x=>add(x,`答辩：${x.title}`,x.status||'待准备'));
 state.meetings.forEach(x=>add(x,`导师会议：${x.topic}`,x.actions?'已记录下一步行动':'会议记录',x.date));
 items.sort((a,b)=>String(b.time).localeCompare(String(a.time)));if(!items.length)return `<div class="empty">还没有记录。今天写第一笔，就从这里开始。</div>`;
 return items.slice(0,7).map(x=>`<div class="card"><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.meta)}</div><div class="meta time-meta">⏱ ${esc(fmtStamp(x.time)||'历史记录')}</div></div>`).join('');
}

function writingRouteForm(id){const x=state.writingRoutes.find(v=>v.id===id)||{date:iso(),chapterId:state.settings.defaultChapterId||state.chapters[0]?.id||'',sectionId:'',title:'',targetWords:0,done:false,order:todayRoutes().length+1};const opts=[];state.chapters.forEach(c=>{opts.push(`<option value="${c.id}::" ${x.chapterId===c.id&&!x.sectionId?'selected':''}>${esc(c.title)}（整章）</option>`);(c.sections||[]).forEach(s=>opts.push(`<option value="${c.id}::${s.id}" ${x.chapterId===c.id&&x.sectionId===s.id?'selected':''}>${esc(c.title)} · ${esc(s.title)}</option>`))});openSheet(`<h3>${id?'编辑写作路线':'安排今日写作路线'}</h3><div class="field"><label>日期</label><input id="f-route-date" type="date" value="${esc(x.date||iso())}"></div><div class="field"><label>章节 / 小节</label><select id="f-route-section">${opts.join('')}</select></div><div class="field"><label>今天要完成什么</label><input id="f-route-title" value="${esc(x.title||'')}" placeholder="例如：写完4.2评价结果解释"></div><div class="form2"><div class="field"><label>目标字数（可选）</label><input id="f-route-words" type="number" value="${x.targetWords||0}"></div><div class="field"><label>顺序</label><input id="f-route-order" type="number" value="${x.order||1}"></div></div><div class="field"><label>状态</label><select id="f-route-done"><option value="0" ${!x.done?'selected':''}>待完成</option><option value="1" ${x.done?'selected':''}>已完成</option></select></div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('writingRoutes','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveWritingRoute('${id||''}')">保存</button></div>`)}
function saveWritingRoute(id){const old=state.writingRoutes.find(x=>x.id===id),parts=$('#f-route-section').value.split('::'),times=auditFields(old,$('#f-route-date').value);const v={id:id||uid(),date:$('#f-route-date').value,chapterId:parts[0]||'',sectionId:parts[1]||'',title:$('#f-route-title').value.trim(),targetWords:+$('#f-route-words').value||0,order:+$('#f-route-order').value||1,done:$('#f-route-done').value==='1',...times};if(!v.chapterId)return alert('请选择章节');const i=state.writingRoutes.findIndex(x=>x.id===id);if(i>=0)state.writingRoutes[i]=v;else state.writingRoutes.push(v);closeSheet();save()}

function writingRouteHTML(){const rows=todayRoutes();return `<div class="card"><div class="route-head"><div><div class="title">今日写作路线</div><div class="meta">先安排小节，再进入专注写作</div></div><button class="tiny-btn" onclick="writingRouteForm()">+ 安排</button></div>${rows.length?rows.map(x=>`<div class="route-item"><input type="checkbox" ${x.done?'checked':''} onchange="toggleWritingRoute('${x.id}',this.checked)"><div class="route-main" onclick="writingRouteForm('${x.id}')"><div class="title">${esc(x.title||routeLabel(x))}</div><div class="meta">${esc(routeLabel(x))}${x.targetWords?' · 目标 '+fmt(x.targetWords)+' 字':''}</div></div>${!x.done?`<div class="route-actions"><button class="tiny-btn" onclick="startRoute('${x.id}')">开始</button></div>`:''}</div>`).join(''):'<div class="empty" style="padding:16px 6px">今天还没安排写作路线。可按 1～3 个小节拆开推进。</div>'}</div>`}

function chapterDetail(id){const c=state.chapters.find(x=>x.id===id);if(!c)return;const p=pct(c.currentWords,c.targetWords),tasks=c.tasks||[];openSheet(`<h3>${esc(c.title)}</h3><div class="row"><div class="meta">${fmt(c.currentWords)} / ${fmt(c.targetWords)} 字 · ${esc(c.status)}</div><b style="color:var(--navy)">${p}%</b></div><div class="small-progress"><span style="width:${p}%"></span></div>${auditHTML(c)}${c.notes?`<div class="detail-block"><b>章节备注 / 待补内容</b><p>${esc(c.notes)}</p></div>`:''}<div class="section-title"><h2>章节任务</h2><button class="pill-btn" style="padding:7px 10px" onclick="chapterTaskForm('${id}')">+ 任务</button></div>${tasks.length?tasks.map(t=>`<div class="chapter-task"><div class="checkrow"><input type="checkbox" ${t.done?'checked':''} onchange="toggleChapterTask('${id}','${t.id}',this.checked)"><div style="flex:1" onclick="chapterTaskForm('${id}','${t.id}')"><div class="title">${esc(t.title)}</div><div class="meta">${esc(t.priority||'中')}优先级${t.sectionId?' · '+esc(sectionTitle(id,t.sectionId)):''}${t.due?' · '+esc(t.due):''}</div></div></div></div>`).join(''):'<div class="empty" style="padding:12px">还没有章节任务，可拆成“补图、补文献、写结果、核对格式”等。</div>'}<div class="section-title"><h2>小节清单</h2><button class="pill-btn" style="padding:7px 10px" onclick="sectionForm('${id}')">+ 小节</button></div>${(c.sections||[]).map(s=>`<div class="section-mini" onclick="event.stopPropagation();sectionForm('${id}','${s.id}')"><div class="row"><div style="min-width:0"><div class="title">${esc(s.title)}</div><div class="meta">${fmt(s.currentWords||0)} / ${fmt(s.targetWords||0)} 字 · ${esc(s.status||'')} · 完成条件 ${sectionCheckPct(s)}%</div></div><b>${pct(s.currentWords,s.targetWords)}%</b></div><div class="small-progress"><span style="width:${pct(s.currentWords,s.targetWords)}%"></span></div>${sectionChecksHTML(s)}${auditHTML(s)}</div>`).join('')||'<div class="empty" style="padding:14px">还没有小节。可细化到 1.1、1.2、1.3 级别管理。</div>'}<div class="actions"><button class="btn soft" onclick="chapterForm('${id}')">编辑章节</button><button class="btn primary" onclick="closeSheet();writingLogForm(null,'${id}')">给本章记字数</button></div>`) }

function chapterTaskForm(cid,tid){const c=state.chapters.find(x=>x.id===cid);if(!c)return;const x=(c.tasks||[]).find(t=>t.id===tid)||{title:'',sectionId:'',priority:'中',due:'',done:false,notes:''};openSheet(`<h3>${tid?'编辑章节任务':'新增章节任务'} · ${esc(c.title)}</h3><div class="field"><label>任务</label><input id="f-task-title" value="${esc(x.title||'')}" placeholder="例如：补4.2结果图说明"></div><div class="form2"><div class="field"><label>关联小节</label><select id="f-task-sec"><option value="">整章</option>${(c.sections||[]).map(s=>`<option value="${s.id}" ${x.sectionId===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select></div><div class="field"><label>优先级</label><select id="f-task-priority">${['高','中','低'].map(v=>`<option ${x.priority===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label>截止日期</label><input id="f-task-due" type="date" value="${esc(x.due||'')}"></div><div class="field"><label>说明</label><textarea id="f-task-notes">${esc(x.notes||'')}</textarea></div><div class="field"><label>状态</label><select id="f-task-done"><option value="0" ${!x.done?'selected':''}>待完成</option><option value="1" ${x.done?'selected':''}>已完成</option></select></div><div class="actions">${tid?`<button class="btn danger" onclick="removeChapterTask('${cid}','${tid}')">删除</button>`:''}<button class="btn primary" onclick="saveChapterTask('${cid}','${tid||''}')">保存</button></div>`)}
function saveChapterTask(cid,tid){const c=state.chapters.find(x=>x.id===cid);if(!c)return;c.tasks=c.tasks||[];const old=c.tasks.find(x=>x.id===tid),done=$('#f-task-done').value==='1',times=auditFields(old),now=nowStamp();const v={id:tid||uid(),title:$('#f-task-title').value.trim(),sectionId:$('#f-task-sec').value,priority:$('#f-task-priority').value,due:$('#f-task-due').value,notes:$('#f-task-notes').value.trim(),done,...times,completedAt:done?(old?.completedAt||now):''};if(!v.title)return alert('请填写任务');const i=c.tasks.findIndex(x=>x.id===tid);if(i>=0)c.tasks[i]=v;else c.tasks.push(v);c.updatedAt=nowStamp();closeSheet();save()}
function toggleChapterTask(cid,tid,done){const c=state.chapters.find(x=>x.id===cid),t=c?.tasks?.find(x=>x.id===tid);if(t){t.done=done;t.updatedAt=nowStamp();t.completedAt=done?(t.completedAt||t.updatedAt):'';c.updatedAt=t.updatedAt;save()}}
function removeChapterTask(cid,tid){const c=state.chapters.find(x=>x.id===cid);if(!c||!confirm('确定删除这个章节任务吗？'))return;c.tasks=(c.tasks||[]).filter(x=>x.id!==tid);c.updatedAt=nowStamp();closeSheet();save()}

function chapterForm(id){const x=state.chapters.find(v=>v.id===id)||{id:'',title:'',targetWords:0,currentWords:0,status:'未开始',notes:'',sections:[]};openSheet(`<h3>${id?'编辑章节':'新增章节'}</h3><div class="field"><label>章节名称</label><input id="f-title" value="${esc(x.title)}"></div><div class="form2"><div class="field"><label>目标字数</label><input id="f-target" type="number" value="${x.targetWords||0}"></div><div class="field"><label>当前字数</label><input id="f-current" type="number" value="${x.currentWords||0}"></div></div><div class="field"><label>状态</label><select id="f-status">${['未开始','进行中','已完成'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`)}</select></div><div class="field"><label>备注 / 待补内容</label><textarea id="f-notes">${esc(x.notes||'')}</textarea></div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('chapters','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveChapter('${id}')">保存</button></div>`)}
function saveChapter(id){const old=state.chapters.find(x=>x.id===id),times=auditFields(old);const v={id:id||uid(),title:$('#f-title').value.trim(),targetWords:+$('#f-target').value||0,currentWords:+$('#f-current').value||0,status:$('#f-status').value,notes:$('#f-notes').value.trim(),sections:old?.sections||[],tasks:old?.tasks||[],...times};if(!v.title)return alert('请填写章节名称');const i=state.chapters.findIndex(x=>x.id===id);if(i>=0)state.chapters[i]=v;else state.chapters.push(v);closeSheet();save()}
function sectionForm(cid,sid){const c=state.chapters.find(x=>x.id===cid);if(!c)return;const x=c.sections.find(v=>v.id===sid)||{title:'',targetWords:0,currentWords:0,status:'未开始',notes:'',checks:{text:false,figures:false,citations:false,feedback:false}},ck=Object.assign({text:false,figures:false,citations:false,feedback:false},x.checks||{});openSheet(`<h3>${sid?'编辑小节':'新增小节'} · ${esc(c.title)}</h3><div class="field"><label>小节名称</label><input id="f-title" value="${esc(x.title)}" placeholder="例如：4.2 危险性评价结果"></div><div class="form2"><div class="field"><label>目标字数</label><input id="f-target" type="number" value="${x.targetWords||0}"></div><div class="field"><label>当前字数</label><input id="f-current" type="number" value="${x.currentWords||0}"></div></div><div class="field"><label>状态</label><select id="f-status">${['未开始','进行中','已完成'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>小节完成条件</label><div class="field-checks"><label class="field-check"><input id="f-ck-text" type="checkbox" ${ck.text?'checked':''}>正文完成</label><label class="field-check"><input id="f-ck-figures" type="checkbox" ${ck.figures?'checked':''}>图表完成</label><label class="field-check"><input id="f-ck-citations" type="checkbox" ${ck.citations?'checked':''}>引文核对</label><label class="field-check"><input id="f-ck-feedback" type="checkbox" ${ck.feedback?'checked':''}>导师修改完成</label></div></div><div class="field"><label>备注</label><textarea id="f-notes">${esc(x.notes||'')}</textarea></div><div class="actions">${sid?`<button class="btn danger" onclick="removeSection('${cid}','${sid}')">删除</button>`:''}<button class="btn primary" onclick="saveSection('${cid}','${sid||''}')">保存</button></div>`) }
function saveSection(cid,sid){const c=state.chapters.find(x=>x.id===cid);if(!c)return;const old=c.sections.find(x=>x.id===sid),times=auditFields(old);const checks={text:$('#f-ck-text').checked,figures:$('#f-ck-figures').checked,citations:$('#f-ck-citations').checked,feedback:$('#f-ck-feedback').checked};const v={id:sid||uid(),title:$('#f-title').value.trim(),targetWords:+$('#f-target').value||0,currentWords:+$('#f-current').value||0,status:$('#f-status').value,notes:$('#f-notes').value.trim(),checks,...times};if(!v.title)return alert('请填写小节名称');const i=c.sections.findIndex(x=>x.id===sid);if(i>=0)c.sections[i]=v;else c.sections.push(v);c.updatedAt=nowStamp();closeSheet();save()}

function renderProblems(){
 const list=state.problems.filter(x=>problemFilter==='all'||(problemFilter==='open'?x.status!=='已解决':problemFilter==='solved'?x.status==='已解决':x.priority==='高')).sort((a,b)=>((a.status==='已解决')-(b.status==='已解决'))||((b.priority==='高')-(a.priority==='高'))||String(b.updatedAt||b.createdAt).localeCompare(String(a.updatedAt||a.createdAt)));
 const solved=state.problems.filter(x=>x.status==='已解决').length,avgSolve=averageSolveDays();
 $('#view-problems').innerHTML=`<div class="page-head"><div><h2>写作台</h2><div class="sub">问题不仅记录，还关联到小节、文献和修改任务</div></div></div>${workspaceSwitcher('problems')}<div class="section-title" style="margin-top:2px"><h2>问题记录 / 答疑</h2><span class="sub">问题 → 处理 → 结果 → 复盘</span></div><div class="tabs"><button class="${problemFilter==='all'?'active':''}" onclick="problemFilter='all';renderProblems()">全部 ${state.problems.length}</button><button class="${problemFilter==='open'?'active':''}" onclick="problemFilter='open';renderProblems()">未闭环 ${state.problems.length-solved}</button><button class="${problemFilter==='solved'?'active':''}" onclick="problemFilter='solved';renderProblems()">已解决 ${solved}</button><button class="${problemFilter==='high'?'active':''}" onclick="problemFilter='high';renderProblems()">高优先级</button></div>${list.map(x=>`<div class="card" onclick="problemDetail('${x.id}')"><div class="row"><div class="title">${esc(x.title)}</div>${statusChip(x.status)}</div><div class="meta">${esc(x.chapter||'未指定章节')} · ${esc(x.type||'未分类')} · ${esc(x.priority||'中')}优先级${x.status!=='已解决'?' · 已卡 '+blockerDays(x)+' 天':''}</div>${x.relatedSectionKey?`<div class="assoc">关联：${esc(relatedSectionText(x.relatedSectionKey))}</div>`:''}${x.description?`<div class="meta">${esc(x.description).slice(0,95)}${x.description.length>95?'…':''}</div>`:''}${auditHTML(x)}</div>`).join('')||'<div class="empty">暂时没有问题记录。遇到卡点就记下来，解决后补上结果和复盘。</div>'}<div class="kpi-strip"><div class="kpi"><b>${state.problems.length}</b><span>问题总数</span></div><div class="kpi"><b>${solved}</b><span>已解决</span></div><div class="kpi"><b>${avgSolve===null?'—':avgSolve}</b><span>平均解决天数</span></div></div>`;
}
function averageSolveDays(){const v=state.problems.filter(x=>x.status==='已解决'&&x.createdAt&&x.resolvedAt).map(x=>Math.max(0,daysBetween(x.createdAt,x.resolvedAt)));return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null}
function problemForm(id){const x=state.problems.find(v=>v.id===id)||{title:'',chapter:'',type:'结构逻辑',description:'',status:'未解决',method:'',resolution:'',lesson:'',priority:'中',source:'自己发现',evidence:'',createdAt:iso(),resolvedAt:'',relatedSectionKey:'',relatedLiteratureId:'',relatedFeedbackId:''};let secOpts='<option value="">不关联小节</option>',litOpts='<option value="">不关联文献</option>',fbOpts='<option value="">不关联修改任务</option>';state.chapters.forEach(c=>(c.sections||[]).forEach(s=>{const k=`${c.id}::${s.id}`;secOpts+=`<option value="${k}" ${x.relatedSectionKey===k?'selected':''}>${esc(c.title)} · ${esc(s.title)}</option>`}));state.literature.forEach(v=>litOpts+=`<option value="${v.id}" ${x.relatedLiteratureId===v.id?'selected':''}>${esc(v.title)}</option>`);state.feedback.filter(v=>v.status!=='已完成'||v.id===x.relatedFeedbackId).forEach(v=>fbOpts+=`<option value="${v.id}" ${x.relatedFeedbackId===v.id?'selected':''}>${esc(v.title)}</option>`);openSheet(`<h3>${id?'编辑问题':'记录今天遇到的问题'}</h3><div class="field"><label>问题标题</label><input id="f-title" value="${esc(x.title)}" placeholder="例如：第4章图表说明怎么写"></div><div class="form2"><div class="field"><label>所属章节（文字）</label><input id="f-chapter" value="${esc(x.chapter||'')}" placeholder="第4章"></div><div class="field"><label>问题类型</label><select id="f-type">${['结构逻辑','文字表达','图表规范','数据分析','文献引用','格式排版','方法设计','导师意见','答辩准备','其他'].map(s=>`<option ${x.type===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="field"><label>关联到具体小节</label><select id="f-related-section">${secOpts}</select></div><div class="form2"><div class="field"><label>来源</label><select id="f-source">${['自己发现','导师提出','同学讨论','文献启发','规范要求','答辩/评审','其他'].map(s=>`<option ${x.source===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>优先级</label><select id="f-priority">${['高','中','低'].map(s=>`<option ${x.priority===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="form2"><div class="field"><label>关联文献</label><select id="f-related-lit">${litOpts}</select></div><div class="field"><label>关联导师修改</label><select id="f-related-feedback">${fbOpts}</select></div></div><div class="field"><label>问题描述</label><textarea id="f-desc">${esc(x.description||'')}</textarea></div><div class="field"><label>状态</label><select id="f-status">${['未解决','处理中','已解决','需继续跟进'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>解决方式 / 处理过程</label><textarea id="f-method">${esc(x.method||'')}</textarea></div><div class="field"><label>依据 / 相关资料</label><textarea id="f-evidence" placeholder="可记文献、规范、导师原话或数据依据">${esc(x.evidence||'')}</textarea></div><div class="field"><label>最终解决结果</label><textarea id="f-resolution">${esc(x.resolution||'')}</textarea></div><div class="field"><label>经验总结 / 下次怎么做</label><textarea id="f-lesson">${esc(x.lesson||'')}</textarea></div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('problems','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveProblem('${id||''}')">保存</button></div>`) }
function saveProblem(id){const old=state.problems.find(x=>x.id===id),status=$('#f-status').value,times=auditFields(old),now=nowStamp();const v={id:id||uid(),title:$('#f-title').value.trim(),chapter:$('#f-chapter').value.trim(),type:$('#f-type').value,source:$('#f-source').value,description:$('#f-desc').value.trim(),status,priority:$('#f-priority').value,method:$('#f-method').value.trim(),evidence:$('#f-evidence').value.trim(),resolution:$('#f-resolution').value.trim(),lesson:$('#f-lesson').value.trim(),relatedSectionKey:$('#f-related-section').value,relatedLiteratureId:$('#f-related-lit').value,relatedFeedbackId:$('#f-related-feedback').value,...times,resolvedAt:status==='已解决'?(old?.resolvedAt||now):''};if(!v.title)return alert('请填写问题标题');const i=state.problems.findIndex(x=>x.id===id);if(i>=0)state.problems[i]=v;else state.problems.push(v);closeSheet();save()}
function problemDetail(id){const x=state.problems.find(v=>v.id===id);if(!x)return;const lit=state.literature.find(v=>v.id===x.relatedLiteratureId),fb=state.feedback.find(v=>v.id===x.relatedFeedbackId);openSheet(`<h3>${esc(x.title)}</h3><div class="row"><div class="meta">${esc(x.chapter||'未指定章节')} · ${esc(x.type||'未分类')} · ${esc(x.priority||'中')}优先级${x.status!=='已解决'?' · 已卡 '+blockerDays(x)+' 天':''}</div>${statusChip(x.status)}</div><div class="meta">来源：${esc(x.source||'未记录')}</div>${x.relatedSectionKey?`<div class="assoc">关联小节：${esc(relatedSectionText(x.relatedSectionKey))}</div>`:''}${lit?`<div class="assoc">关联文献：${esc(lit.title)}</div>`:''}${fb?`<div class="assoc">关联修改：${esc(fb.title)}</div>`:''}${auditHTML(x)}${x.resolvedAt?`<div class="meta time-meta">✓ 解决 ${esc(fmtStamp(x.resolvedAt))}</div>`:''}${x.description?`<div class="detail-block"><b>问题描述</b><p>${esc(x.description)}</p></div>`:''}${x.method?`<div class="detail-block"><b>处理过程</b><p>${esc(x.method)}</p></div>`:''}${x.evidence?`<div class="detail-block"><b>依据 / 相关资料</b><p>${esc(x.evidence)}</p></div>`:''}${x.resolution?`<div class="detail-block"><b>解决结果</b><p>${esc(x.resolution)}</p></div>`:''}${x.lesson?`<div class="detail-block"><b>复盘总结</b><p>${esc(x.lesson)}</p></div>`:''}<div class="actions"><button class="btn soft" onclick="closeSheet();problemForm('${id}')">编辑</button>${x.status!=='已解决'?`<button class="btn primary" onclick="markSolved('${id}')">标记已解决</button>`:`<button class="btn primary" onclick="reopenProblem('${id}')">重新打开</button>`}</div>`) }
function markSolved(id){const x=state.problems.find(v=>v.id===id);if(x){x.status='已解决';x.resolvedAt=nowStamp();x.updatedAt=nowStamp();x.createdAt=x.createdAt||x.updatedAt}closeSheet();save()}

 const tabs=[['literature','文献'],['feedback','修改'],['todos','待办'],['meetings','会议'],['figures','图表'],['milestones','节点'],['versions','版本'],['finalcheck','送审'],['defense','答辩']];let body='';

 }else if(resourceTab==='figures'){
  body=state.figures.map(x=>`<div class="card" onclick="figureForm('${x.id}')"><div class="row"><div class="title">${esc(x.no||'未编号')} ${esc(x.title)}</div>${statusChip(x.status||'待制作')}</div><div class="meta">${esc(x.kind||'图')} · ${esc(x.chapter||'未指定章节')} · 图题${x.captionChecked?'✓':'○'} · 正文${x.insertedInText?'✓':'○'} · 英文题${x.englishCaptionChecked?'✓':'○'} · 引用${x.citedInText?'✓':'○'} · 来源${x.sourceChecked?'✓':'○'}</div>${x.fileName?`<div class="meta">文件：${esc(x.fileName)}${x.sourcePath?' · '+esc(x.sourcePath):''}</div>`:''}${auditHTML(x)}</div>`).join('')||'<div class="empty">还没有图表清单。现在可同时管理文件名、原始数据位置、正文插入和英文图题。</div>';

  body=state.milestones.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(x=>`<div class="card" onclick="milestoneForm('${x.id}')"><div class="row"><div class="title">${esc(x.title)}</div>${x.date?dueBadge(x.date,x.status==='已完成'):statusChip(x.status||'待完成')}</div><div class="meta">${esc(x.date||'未定日期')} · ${esc(x.status||'待完成')}</div>${auditHTML(x,x.date)}</div>`).join('')||'<div class="empty">还没有时间节点。可添加初稿、预答辩、送审、答辩、定稿等。</div>';
 }else if(resourceTab==='versions'){
  body=state.versions.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(x=>{const prev=state.versions.find(v=>v.id===x.comparedToId);return `<div class="card" onclick="versionForm('${x.id}')"><div class="row"><div class="title">${esc(x.name)}</div><span class="chip blue">${esc(x.date||'')}</span></div><div class="meta">${esc(x.stage||'未分类')} · 当时 ${fmt(x.wordCount||0)} 字${x.fileLocation?' · '+esc(x.fileLocation):''}</div>${prev?`<div class="meta">对比：${esc(prev.name)}</div>`:''}${x.diffNote?`<div class="meta">差异：${esc(x.diffNote).slice(0,110)}</div>`:x.note?`<div class="meta">${esc(x.note)}</div>`:''}${auditHTML(x,x.date)}</div>`}).join('')||'<div class="empty">还没有版本记录。形成重要稿件时记一笔，并说明和上一版改了什么。</div>';
 }else if(resourceTab==='finalcheck'){
  const r=submissionReadiness();body=`<div class="card readiness ${r.cls}"><div class="row"><div><div class="title">送审检查中心 · ${r.level}</div><div class="meta">检查项 ${r.checksDone}/${r.checksTotal} · 图表待完善 ${r.figOpen} · 高优先级问题 ${r.openProblems}</div></div><div class="progress-ring" style="--ring:${r.score}%"><b>${r.score}%</b></div></div></div>`+state.finalChecks.map(x=>`<div class="card"><div class="checkrow"><input type="checkbox" ${x.done?'checked':''} onchange="toggleFinalCheck('${x.id}',this.checked)"><div style="flex:1"><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.category)}${x.notes?' · '+esc(x.notes):''}</div>${auditHTML(x)}</div><button class="pill-btn" style="padding:6px 8px" onclick="finalCheckForm('${x.id}')">编辑</button></div></div>`).join('')+`<button class="pill-btn" style="width:100%" onclick="finalCheckForm()">+ 自定义检查项</button>`;
 }else{
  body=state.defense.slice().sort((a,b)=>(a.status==='已完成')-(b.status==='已完成')).map(x=>`<div class="card" onclick="defenseForm('${x.id}')"><div class="row"><div class="title">${esc(x.title)}</div>${statusChip(x.status||'待准备')}</div><div class="meta">${esc(x.type||'答辩事项')} · 熟悉度 ${x.confidence||1}/5</div>${x.answer?`<div class="meta">${esc(x.answer).slice(0,100)}</div>`:''}${auditHTML(x)}</div>`).join('')||'<div class="empty">还没有答辩准备记录。可记录PPT、陈述稿、可能提问、回答要点和材料清单。</div>';
 }
 $('#view-resources').innerHTML=`<div class="resource-page-head"><div><h2>资料流程</h2><p>把文献、待办、会议、图表、版本和送审检查拆开管理，减少来回切换。</p></div><div class="badge">${resourceTabTitle()}</div></div><div class="resource-shortcuts"><button class="shortcut-tile" onclick="resourceTab='literature';renderResources()"><b>${state.literature.length}</b><span>文献</span></button><button class="shortcut-tile" onclick="resourceTab='todos';renderResources()"><b>${state.todos.filter(x=>!x.done).length}</b><span>待办</span></button><button class="shortcut-tile" onclick="resourceTab='feedback';renderResources()"><b>${state.feedback.filter(x=>x.status!=='已完成').length}</b><span>待修改</span></button><button class="shortcut-tile" onclick="resourceTab='figures';renderResources()"><b>${state.figures.length}</b><span>图表</span></button><button class="shortcut-tile" onclick="resourceTab='meetings';renderResources()"><b>${state.meetings.length}</b><span>会议</span></button><button class="shortcut-tile" onclick="resourceTab='finalcheck';renderResources()"><b>${state.finalChecks.filter(x=>x.done).length}/${state.finalChecks.length}</b><span>送审检查</span></button></div><div class="resource-intro">${resourceTabDesc()}</div><div class="sticky-lite"><div class="tabs compact">${tabs.map(t=>`<button class="${resourceTab===t[0]?'active':''}" onclick="resourceTab='${t[0]}';renderResources()">${t[1]}</button>`).join('')}</div></div>${body}`;
}
function tagsHTML(tags){const arr=String(tags||'').split(/[,，\s]+/).filter(Boolean);return arr.length?`<div>${arr.slice(0,6).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}

function weekStart(date=statsAnchor){const d=dateObj(date),dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return localISO(d)}
function weekData(anchor=statsAnchor){const arr=[],mon=dateObj(weekStart(anchor));for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const k=localISO(d);arr.push({date:k,label:'一二三四五六日'[i],value:wordsOn(k)})}return arr}
function monthBuckets(date=statsAnchor){const d0=dateObj(date),y=d0.getFullYear(),m=d0.getMonth(),days=new Date(y,m+1,0).getDate(),b=[0,0,0,0,0,0];state.writingLogs.forEach(x=>{const d=dateObj(x.date);if(d.getFullYear()===y&&d.getMonth()===m){b[Math.min(5,Math.floor((d.getDate()-1)/5))]+=Number(x.words||0)}});return b.map((v,i)=>({label:i<5?`${i*5+1}-${i*5+5}`:`26-${days}`,value:v}))}
function yearData(year=dateObj(statsAnchor).getFullYear()){return Array.from({length:12},(_,m)=>({label:`${m+1}月`,value:state.writingLogs.filter(x=>{const d=dateObj(x.date);return d.getFullYear()===year&&d.getMonth()===m}).reduce((s,x)=>s+Number(x.words||0),0)}))}
function todaySessions(date=statsAnchor){return state.writingLogs.filter(x=>x.date===date).sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||''))).map((x,i)=>({label:`${i+1}`,value:Number(x.words||0),title:x.note||chapterTitle(x.chapterId)}))}
function barChart(data,labelPrefix=''){const max=Math.max(1,...data.map(x=>x.value));return `<div class="bar-chart">${data.map((x,i)=>`<div class="bar-wrap"><div class="bar ${i===data.length-1?'gold':''}" style="height:${Math.max(2,x.value/max*110)}px"><span class="bar-val">${x.value}</span></div><div class="bar-label">${esc(labelPrefix+x.label)}</div></div>`).join('')}</div>`}
function rangeDates(range,anchor=statsAnchor){const now=dateObj(anchor);if(range==='today')return [localISO(now),localISO(now)];if(range==='week'){const a=weekStart(anchor);return [a,addDays(a,6)]}if(range==='month')return [`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`,localISO(new Date(now.getFullYear(),now.getMonth()+1,0,12))];if(range==='year')return [`${now.getFullYear()}-01-01`,`${now.getFullYear()}-12-31`];return ['0000-01-01','9999-12-31']}
function inDateRange(v,a,b){const d=dateOnly(v);return !!d&&d>=a&&d<=b}
function rangeSummary(range,anchor=statsAnchor){const [a,b]=rangeDates(range,anchor),logs=state.writingLogs.filter(x=>x.date>=a&&x.date<=b),words=logs.reduce((s,x)=>s+Number(x.words||0),0),mins=logs.reduce((s,x)=>s+Number(x.minutes||0),0),problems=state.problems.filter(x=>inDateRange(x.createdAt,a,b)).length,solved=state.problems.filter(x=>inDateRange(x.resolvedAt,a,b)).length,todos=state.todos.filter(x=>x.done&&inDateRange(x.completedAt||x.updatedAt,a,b)).length,feedback=state.feedback.filter(x=>x.status==='已完成'&&inDateRange(x.completedAt||x.updatedAt,a,b)).length,meetings=state.meetings.filter(x=>x.date>=a&&x.date<=b).length;return {words,mins,sessions:logs.length,problems,solved,todos,feedback,meetings}}
function previousAnchor(range,anchor=statsAnchor){const d=dateObj(anchor);if(range==='today')d.setDate(d.getDate()-1);else if(range==='week')d.setDate(d.getDate()-7);else if(range==='month'){d.setDate(1);d.setMonth(d.getMonth()-1)}else if(range==='year')d.setFullYear(d.getFullYear()-1);return localISO(d)}
function compareText(cur,prev){cur=Number(cur||0);prev=Number(prev||0);if(prev===0&&cur===0)return {text:'—',cls:'delta-flat'};if(prev===0&&cur>0)return {text:'新增',cls:'delta-up'};const v=Math.round((cur-prev)/Math.abs(prev)*100);if(v>0)return {text:`↑ ${v}%`,cls:'delta-up'};if(v<0)return {text:`↓ ${Math.abs(v)}%`,cls:'delta-down'};return {text:'→ 0%',cls:'delta-flat'}}
function periodGoal(range=statsRange,anchor=statsAnchor){const daily=Math.max(0,Number(state.settings.dailyWordGoal||0)),weekly=Math.max(0,Number(state.settings.weeklyWordGoal||daily*7)),d=dateObj(anchor);if(range==='today')return dailyGoal(dateOnly(anchor));if(range==='week')return weekly;if(range==='month'){const days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return Math.round(weekly*days/7)}if(range==='year')return Math.round(weekly*365.25/7);return Math.max(0,Number(state.settings.totalWordGoal||0))}
function periodWordsForGoal(range=statsRange,s=null){if(range==='all')return totalWords();return (s||rangeSummary(range)).words}
function comparisonHTML(range=statsRange,anchor=statsAnchor,current=null){if(range==='all')return '';const prevAnchor=previousAnchor(range,anchor),prev=rangeSummary(range,prevAnchor),cur=current||rangeSummary(range,anchor),a=compareText(cur.words,prev.words),b=compareText(cur.mins,prev.mins),c=compareText(cur.sessions,prev.sessions),label=range==='today'?'前一天':range==='week'?'上一周':range==='month'?'上个月':'上一年';return `<div class="analysis-card"><div class="head"><div><div class="title">环比变化</div><div class="meta">与${label}相比</div></div><div class="meta">${esc(periodLabel(range,anchor))}</div></div><div class="compare-grid"><div class="compare-cell"><b class="${a.cls}">${a.text}</b><span>写作字数</span></div><div class="compare-cell"><b class="${b.cls}">${b.text}</b><span>专注时长</span></div><div class="compare-cell"><b class="${c.cls}">${c.text}</b><span>写作会话</span></div></div></div>`}
function goalProgressHTML(range=statsRange,anchor=statsAnchor,current=null){const goal=periodGoal(range,anchor),done=periodWordsForGoal(range,current),raw=goal?Math.round(done/goal*100):0,p=Math.min(100,Math.max(0,raw)),remain=Math.max(0,goal-done),name=range==='all'?'论文总目标':range==='today'?'单日目标':range==='week'?'每周目标':range==='month'?'月度参考目标':'年度参考目标';return `<div class="analysis-card"><div class="head"><div><div class="title">目标完成情况</div><div class="meta">${name}</div></div><b style="color:var(--gold)">${goal?raw+'%':'未设置'}</b></div><div class="goal-line"><div><b>${fmt(done)}</b><span> 字已完成</span></div><span>${goal?`目标 ${fmt(goal)} 字 · ${remain?`还差 ${fmt(remain)} 字`:'已达成'}`:'请先在“我的”设置写作目标'}</span></div><div class="small-progress"><span style="width:${p}%"></span></div>${range==='month'||range==='year'?'<div class="analysis-note">月度/年度参考目标由“每周目标”按周期天数折算，仅用于观察写作节奏。</div>':''}</div>`}
function bestWritingDay(range=statsRange,anchor=statsAnchor){const [a,b]=rangeDates(range,anchor),map={};state.writingLogs.forEach(x=>{if(x.date>=a&&x.date<=b)map[x.date]=(map[x.date]||0)+Number(x.words||0)});const arr=Object.entries(map).sort((x,y)=>y[1]-x[1]);return arr[0]||null}
function efficiencyHTML(range=statsRange,anchor=statsAnchor,current=null){const s=current||rangeSummary(range,anchor),avgWords=s.sessions?Math.round(s.words/s.sessions):0,avgMins=s.sessions?Math.round(s.mins/s.sessions):0,wph=s.mins?Math.round(s.words/(s.mins/60)):0,best=bestWritingDay(range,anchor);return `<div class="section-title"><h2>写作效率</h2><span class="sub">由字数与写作时长自动计算</span></div><div class="insight-grid"><div class="insight-cell"><div class="k">平均每次写作</div><div class="v">${fmt(avgWords)} 字</div><div class="d">${s.sessions} 次会话</div></div><div class="insight-cell"><div class="k">平均每小时</div><div class="v">${fmt(wph)} 字</div><div class="d">按记录分钟数换算</div></div><div class="insight-cell"><div class="k">平均每次时长</div><div class="v">${fmt(avgMins)} 分</div><div class="d">单次专注节奏</div></div><div class="insight-cell"><div class="k">最高产的一天</div><div class="v">${best?fmt(best[1])+' 字':'—'}</div><div class="d">${best?best[0]:'暂无写作记录'}</div></div></div>`}
function stampMs(v){if(!v)return NaN;const s=String(v).trim().replace(' ','T');const t=new Date(s.length===10?s+'T12:00:00':s).getTime();return Number.isFinite(t)?t:NaN}
function closeTimeText(items,endField){const vals=items.map(x=>{const a=stampMs(x.createdAt),b=stampMs(x[endField]||x.updatedAt);return Number.isFinite(a)&&Number.isFinite(b)&&b>=a?(b-a)/3600000:null}).filter(v=>v!==null);if(!vals.length)return '暂无';const avg=vals.reduce((s,x)=>s+x,0)/vals.length;return avg<24?`${Math.round(avg)} 小时`:`${(avg/24).toFixed(1)} 天`}
function closureHTML(range=statsRange,anchor=statsAnchor){const [a,b]=rangeDates(range,anchor),problemNew=state.problems.filter(x=>inDateRange(x.createdAt,a,b)).length,problemSolvedItems=state.problems.filter(x=>inDateRange(x.resolvedAt,a,b)),problemOpen=state.problems.filter(x=>x.status!=='已解决').length,feedbackNew=state.feedback.filter(x=>inDateRange(x.createdAt,a,b)).length,feedbackDoneItems=state.feedback.filter(x=>x.status==='已完成'&&inDateRange(x.completedAt||x.updatedAt,a,b)),feedbackOpen=state.feedback.filter(x=>x.status!=='已完成').length;return `<div class="section-title"><h2>问题与修改闭环</h2><span class="sub">周期变化 + 当前积压</span></div><div class="closure-row"><div class="closure-box" onclick="go('problems')"><div class="name">问题闭环</div><div class="nums">${problemNew} 新增 · ${problemSolvedItems.length} 解决</div><div class="desc">当前未解决 ${problemOpen} 项 · 平均解决 ${closeTimeText(problemSolvedItems,'resolvedAt')}</div></div><div class="closure-box" onclick="resourceTab='feedback';go('resources')"><div class="name">导师修改</div><div class="nums">${feedbackNew} 新增 · ${feedbackDoneItems.length} 完成</div><div class="desc">当前未完成 ${feedbackOpen} 项 · 平均完成 ${closeTimeText(feedbackDoneItems,'completedAt')}</div></div></div>`}
