function quickPrivacySettings(){const s=state.settings;openSheet(`<h3>显示偏好</h3><div class="field"><label>连续写作天数</label><select id="f-countStreak"><option value="1" ${s.countStreak!==false?'selected':''}>开启</option><option value="0" ${s.countStreak===false?'selected':''}>关闭</option></select></div><div class="field"><label>首页显示论文题目</label><select id="f-hideTitle"><option value="0" ${!s.hideThesisTitle?'selected':''}>显示</option><option value="1" ${s.hideThesisTitle?'selected':''}>隐藏</option></select></div><div class="actions"><button class="btn primary" onclick="savePrivacySettings()">保存</button></div>`)}
function savePrivacySettings(){state.settings.countStreak=$('#f-countStreak').value==='1';state.settings.hideThesisTitle=$('#f-hideTitle').value==='1';state.settings.updatedAt=nowStamp();closeSheet();save()}
async function clearAppCache(){if(!confirm('刷新程序缓存不会删除论文记录。确定继续吗？'))return;try{if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}const regs=await navigator.serviceWorker?.getRegistrations?.();if(regs)for(const r of regs)await r.update();alert('程序缓存已清理，即将重新加载。');location.reload()}catch(e){alert('缓存清理未完全完成，可以关闭 App 后重新打开。')}}
function showUsageHelp(){openSheet(`<h3>使用说明</h3><div class="detail-block"><b>建议工作流</b><p>1. 首页看今天优先事项和论文健康度。\n2. 写作时用“开始写作”，结束后登记字数和时长。\n3. 卡点记到“问题”，解决后补解决结果和复盘。\n4. 导师意见、文献、图表、会议、版本、答辩都放在“资料”。\n5. “记录”里可在“资料流程 / 统计分析”间切换；“我的”负责参数、备份和程序管理。</p></div><div class="detail-block"><b>数据安全</b><p>建议每周至少导出一次 JSON，并保存到 iCloud Drive 或电脑。删除网页 App、清理 Safari 网站数据或系统存储清理都可能影响本地记录。</p></div>`)}
function resetAllData(){if(!confirm('第一次确认：真的要清空全部论文数据吗？'))return;if(!confirm('第二次确认：此操作不可撤销。请确认你已经导出 JSON 备份。'))return;localStorage.removeItem(STORAGE_KEY);LEGACY_KEYS.forEach(k=>localStorage.removeItem(k));localStorage.removeItem(SNAPSHOT_KEY);state=load();save();alert('全部论文数据已清空。')}

function renderFocus(){const route=todayRoutes().find(x=>!x.done&&(focusPresetChapterId?x.chapterId===focusPresetChapterId:true)),target=focusPresetChapterId?`${chapterTitle(focusPresetChapterId)}${focusPresetSectionId?' · '+sectionTitle(focusPresetChapterId,focusPresetSectionId):''}`:(route?routeLabel(route):'未指定章节');$('#view-focus').innerHTML=`<div class="page-head"><div><h2>写作台</h2><div class="sub">专注完成后自动弹出写作登记</div></div></div>${workspaceSwitcher('focus')}<div class="section-title" style="margin-top:2px"><h2>专注写作</h2><button class="pill-btn" style="padding:8px 12px" onclick="go('home')">返回</button></div><div class="focus-wrap"><div style="font-size:12px;opacity:.75">沉浸写作计时</div><div class="focus-current">当前：${esc(target)}</div><div class="timer" id="timer">${timerText()}</div><div class="focus-controls"><button class="go" onclick="toggleFocus()">${focusRunning?'暂停':'开始专注'}</button><button class="ghost" onclick="resetFocus()">重置</button></div></div><div class="card"><div class="row"><div><div class="title">登记成果</div><div class="meta">完整专注结束时会自动弹出；也可以现在手动登记。</div></div><button class="tiny-btn" onclick="writingLogForm('',focusPresetChapterId,focusPresetSectionId)">登记</button></div></div>${writingRouteHTML()}<div class="section-title"><h2>最近写作记录</h2></div>${state.writingLogs.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,12).map(x=>`<div class="card" onclick="writingLogForm('${x.id}')"><div class="row"><div class="title">+${fmt(x.words)} 字</div><span class="chip blue">${esc(x.date)}</span></div><div class="meta">${esc(chapterTitle(x.chapterId))}${x.sectionId?' · '+esc(sectionTitle(x.chapterId,x.sectionId)):''} · ${fmt(x.minutes)} 分钟${x.note?' · '+esc(x.note):''}</div>${auditHTML(x,x.date)}</div>`).join('')||'<div class="empty">还没有写作记录。</div>'}`;}
function timerText(){const m=Math.floor(focusSeconds/60),s=focusSeconds%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function toggleFocus(){focusRunning=!focusRunning;if(focusRunning){focusTimer=setInterval(()=>{focusSeconds--;const el=$('#timer');if(el)el.textContent=timerText();if(focusSeconds<=0){clearInterval(focusTimer);focusRunning=false;navigator.vibrate?.(200);const mins=state.settings.focusMinutes,route=todayRoutes().find(x=>!x.done&&(focusPresetChapterId?x.chapterId===focusPresetChapterId:true));if(!focusPresetChapterId&&route){focusPresetChapterId=route.chapterId;focusPresetSectionId=route.sectionId||''}focusSeconds=state.settings.focusMinutes*60;renderFocus();setTimeout(()=>writingLogForm('',focusPresetChapterId,focusPresetSectionId,mins),80)}},1000)}else clearInterval(focusTimer);renderFocus()}
function resetFocus(){clearInterval(focusTimer);focusRunning=false;focusSeconds=state.settings.focusMinutes*60;renderFocus()}
function writingLogForm(id,presetCid,presetSid,presetMinutes){const old=state.writingLogs.find(x=>x.id===id)||{date:iso(),chapterId:presetCid||state.settings.defaultChapterId||state.chapters[0]?.id||'',sectionId:presetSid||'',words:'',minutes:presetMinutes||state.settings.focusMinutes,note:''};openSheet(`<h3>${id?'编辑写作记录':'登记本次写作'}</h3>${presetMinutes?`<div class="notice">本轮专注已完成，${presetMinutes} 分钟已自动带入。</div>`:''}<div class="field"><label>日期</label><input id="f-date" type="date" value="${old.date||iso()}"></div><div class="field"><label>所属章节</label><select id="f-ch" onchange="refreshSectionSelect()">${state.chapters.map(c=>`<option value="${c.id}" ${old.chapterId===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><div class="field"><label>具体小节（可选）</label><select id="f-sec"></select></div><div class="form2"><div class="field"><label>本次新增字数</label><input id="f-words" type="number" inputmode="numeric" value="${old.words||''}"></div><div class="field"><label>实际用时（分钟）</label><input id="f-min" type="number" inputmode="numeric" value="${old.minutes||state.settings.focusMinutes}"></div></div><div class="field"><label>本次完成内容</label><textarea id="f-note">${esc(old.note||'')}</textarea></div><div class="actions">${id?`<button class="btn danger" onclick="deleteWritingLog('${id}')">删除</button>`:'<button class="btn soft" onclick="closeSheet()">取消</button>'}<button class="btn primary" onclick="saveWritingLog('${id||''}')">保存</button></div>`);setTimeout(()=>refreshSectionSelect(old.sectionId||presetSid||''),0)}
function refreshSectionSelect(selected=''){const sel=$('#f-sec'),cid=$('#f-ch')?.value;if(!sel)return;const secs=state.chapters.find(x=>x.id===cid)?.sections||[];sel.innerHTML=`<option value="">不指定小节</option>`+secs.map(s=>`<option value="${s.id}" ${selected===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}
function applyWritingDelta(cid,sid,delta){const c=state.chapters.find(x=>x.id===cid),now=nowStamp();if(c){c.currentWords=Math.max(0,Number(c.currentWords||0)+delta);c.updatedAt=now;c.createdAt=c.createdAt||now}if(c&&sid){const s=c.sections.find(x=>x.id===sid);if(s){s.currentWords=Math.max(0,Number(s.currentWords||0)+delta);s.updatedAt=now;s.createdAt=s.createdAt||now}}}
function saveWritingLog(id){const old=state.writingLogs.find(x=>x.id===id),words=+$('#f-words').value||0,minutes=+$('#f-min').value||0,cid=$('#f-ch').value,sid=$('#f-sec').value;if(words<=0)return alert('请填写本次新增字数');if(old)applyWritingDelta(old.chapterId,old.sectionId,-Number(old.words||0));applyWritingDelta(cid,sid,words);const workDate=$('#f-date').value,times=auditFields(old,workDate);const v={id:id||uid(),date:workDate,chapterId:cid,sectionId:sid,words,minutes,note:$('#f-note').value.trim(),...times};const i=state.writingLogs.findIndex(x=>x.id===id);if(i>=0)state.writingLogs[i]=v;else state.writingLogs.push(v);if(!old&&minutes>0){const ft=auditFields(null,workDate);state.focusLogs.push({id:uid(),date:v.date,minutes,task:v.note,...ft})}if(!old&&workDate===iso()){const route=state.writingRoutes.find(r=>!r.done&&r.date===workDate&&r.chapterId===cid&&(!r.sectionId||r.sectionId===sid));if(route){route.done=true;route.updatedAt=nowStamp();route.completedAt=route.updatedAt}}focusPresetChapterId=cid;focusPresetSectionId=sid;closeSheet();save();go('home')}
function deleteWritingLog(id){const x=state.writingLogs.find(v=>v.id===id);if(!x||!confirm('删除后会同步扣减对应章节/小节字数，确定吗？'))return;applyWritingDelta(x.chapterId,x.sectionId,-Number(x.words||0));state.writingLogs=state.writingLogs.filter(v=>v.id!==id);closeSheet();save()}

function literatureForm(id){const x=state.literature.find(v=>v.id===id)||{title:'',authors:'',year:'',journal:'',doi:'',language:'中文',paperType:'期刊论文',status:'待阅读',usedIn:'',tags:'',favorite:false,citation:'',researchMethod:'',keyConclusion:'',quote:'',notes:''};openSheet(`<h3>${id?'编辑文献':'新增文献卡片'}</h3><div class="field"><label>文献标题</label><input id="f-title" value="${esc(x.title)}"></div><div class="form2"><div class="field"><label>作者</label><input id="f-authors" value="${esc(x.authors)}"></div><div class="field"><label>年份</label><input id="f-year" value="${esc(x.year)}"></div></div><div class="form2"><div class="field"><label>期刊 / 学校 / 来源</label><input id="f-journal" value="${esc(x.journal||'')}"></div><div class="field"><label>DOI</label><input id="f-doi" value="${esc(x.doi||'')}"></div></div><div class="form2"><div class="field"><label>语言</label><select id="f-language">${['中文','英文','其他'].map(s=>`<option ${x.language===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>类型</label><select id="f-paperType">${['期刊论文','硕士论文','博士论文','会议论文','专著','标准/规范','报告','其他'].map(s=>`<option ${x.paperType===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="form2"><div class="field"><label>阅读状态</label><select id="f-status">${['待阅读','粗读','已浏览','已精读','已引用'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>可用于</label><input id="f-used" value="${esc(x.usedIn)}" placeholder="第1章研究现状"></div></div><div class="field"><label>研究方法</label><textarea id="f-method">${esc(x.researchMethod||'')}</textarea></div><div class="field"><label>关键结论</label><textarea id="f-conclusion">${esc(x.keyConclusion||'')}</textarea></div><div class="field"><label>可引用原文 / 页码</label><textarea id="f-quote">${esc(x.quote||'')}</textarea></div><div class="field"><label>标签（逗号分隔）</label><input id="f-tags" value="${esc(x.tags||'')}" placeholder="易发性, 随机森林, 近五年"></div><div class="field"><label>收藏</label><select id="f-favorite"><option value="0" ${!x.favorite?'selected':''}>普通</option><option value="1" ${x.favorite?'selected':''}>★ 重点文献</option></select></div><div class="field"><label>参考文献格式 / 链接</label><textarea id="f-citation">${esc(x.citation||'')}</textarea></div><div class="field"><label>个人笔记</label><textarea id="f-notes">${esc(x.notes||'')}</textarea></div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('literature','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveLiterature('${id||''}')">保存</button></div>`) }
function saveLiterature(id){const old=state.literature.find(x=>x.id===id),times=auditFields(old);const v={id:id||uid(),title:$('#f-title').value.trim(),authors:$('#f-authors').value.trim(),year:$('#f-year').value.trim(),journal:$('#f-journal').value.trim(),doi:$('#f-doi').value.trim(),language:$('#f-language').value,paperType:$('#f-paperType').value,status:$('#f-status').value,usedIn:$('#f-used').value.trim(),researchMethod:$('#f-method').value.trim(),keyConclusion:$('#f-conclusion').value.trim(),quote:$('#f-quote').value.trim(),tags:$('#f-tags').value.trim(),favorite:$('#f-favorite').value==='1',citation:$('#f-citation').value.trim(),notes:$('#f-notes').value.trim(),...times};if(!v.title)return alert('请填写文献标题');const i=state.literature.findIndex(x=>x.id===id);if(i>=0)state.literature[i]=v;else state.literature.push(v);closeSheet();save()}
function feedbackForm(id){const x=state.feedback.find(v=>v.id===id)||{title:'',chapter:'',source:'导师',round:'第1轮修改',priority:'中',status:'待修改',detail:'',createdAt:iso(),completedAt:''};openSheet(`<h3>${id?'编辑修改任务':'新增导师意见 / 修改任务'}</h3><div class="field"><label>修改事项</label><input id="f-title" value="${esc(x.title)}"></div><div class="form2"><div class="field"><label>所属章节</label><input id="f-chapter" value="${esc(x.chapter)}"></div><div class="field"><label>来源</label><select id="f-source">${['导师','自查','盲审','格式规范','预答辩','正式答辩','其他'].map(s=>`<option ${x.source===s?'selected':''}>${s}</option>`)}</select></div></div><div class="field"><label>修改轮次</label><input id="f-round" value="${esc(x.round||'')}" placeholder="例如：导师第2轮 / 预答辩后"></div><div class="form2"><div class="field"><label>优先级</label><select id="f-priority">${['高','中','低'].map(s=>`<option ${x.priority===s?'selected':''}>${s}</option>`)}</select></div><div class="field"><label>状态</label><select id="f-status">${['待修改','进行中','已完成'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`)}</select></div></div><div class="field"><label>具体意见 / 修改说明</label><textarea id="f-detail">${esc(x.detail)}</textarea></div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('feedback','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveFeedback('${id}')">保存</button></div>`)}
function saveFeedback(id){const old=state.feedback.find(x=>x.id===id),status=$('#f-status').value,times=auditFields(old),now=nowStamp();const v={id:id||uid(),title:$('#f-title').value.trim(),chapter:$('#f-chapter').value.trim(),source:$('#f-source').value,round:$('#f-round').value.trim(),priority:$('#f-priority').value,status,detail:$('#f-detail').value.trim(),...times,completedAt:status==='已完成'?(old?.completedAt||now):''};if(!v.title)return alert('请填写修改事项');const i=state.feedback.findIndex(x=>x.id===id);if(i>=0)state.feedback[i]=v;else state.feedback.push(v);closeSheet();save()}
function todoForm(id){const x=state.todos.find(v=>v.id===id)||{title:'',chapter:'',priority:'中',due:'',notes:'',done:false,createdAt:iso(),updatedAt:iso()};openSheet(`<h3>${id?'编辑待办':'新增论文待办'}</h3><div class="field"><label>待办事项</label><input id="f-title" value="${esc(x.title)}"></div><div class="form2"><div class="field"><label>所属章节/模块</label><input id="f-chapter" value="${esc(x.chapter||'')}"></div><div class="field"><label>优先级</label><select id="f-priority">${['高','中','低'].map(s=>`<option ${x.priority===s?'selected':''}>${s}</option>`)}</select></div></div><div class="field"><label>截止日期</label><input id="f-due" type="date" value="${esc(x.due||'')}"></div><div class="field"><label>说明</label><textarea id="f-notes">${esc(x.notes||'')}</textarea></div><div class="field"><label>状态</label><select id="f-done"><option value="0" ${!x.done?'selected':''}>待完成</option><option value="1" ${x.done?'selected':''}>已完成</option></select></div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('todos','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveTodo('${id}')">保存</button></div>`)}
function saveTodo(id){const old=state.todos.find(x=>x.id===id),done=$('#f-done').value==='1',times=auditFields(old),now=nowStamp();const v={id:id||uid(),title:$('#f-title').value.trim(),chapter:$('#f-chapter').value.trim(),priority:$('#f-priority').value,due:$('#f-due').value,notes:$('#f-notes').value.trim(),done,...times,completedAt:done?(old?.completedAt||now):''};if(!v.title)return alert('请填写待办事项');const i=state.todos.findIndex(x=>x.id===id);if(i>=0)state.todos[i]=v;else state.todos.push(v);closeSheet();save()}
function meetingForm(id){const x=state.meetings.find(v=>v.id===id)||{date:iso(),topic:'',withWhom:'导师',notes:'',actions:'',nextDate:''};openSheet(`<h3>${id?'编辑导师会议':'记录导师会议 / 沟通'}</h3><div class="form2"><div class="field"><label>日期</label><input id="f-date" type="date" value="${esc(x.date)}"></div><div class="field"><label>沟通对象</label><input id="f-with" value="${esc(x.withWhom||'导师')}"></div></div><div class="field"><label>主题</label><input id="f-topic" value="${esc(x.topic)}" placeholder="例如：讨论第4章评价结果"></div><div class="field"><label>会议要点 / 导师原话</label><textarea id="f-notes">${esc(x.notes||'')}</textarea></div><div class="field"><label>明确的下一步行动</label><textarea id="f-actions" placeholder="建议一行一项，保存时可自动转待办">${esc(x.actions||'')}</textarea></div><div class="field"><label>下次沟通日期（可选）</label><input id="f-next" type="date" value="${esc(x.nextDate||'')}"></div><div class="field"><label>会议行动联动</label><select id="f-to-todos"><option value="0">只保存会议记录</option><option value="1">把“下一步行动”自动生成待办</option></select></div><div class="notice">自动生成待办时，会按换行或分号拆成多项；相同会议下不会重复生成同名待办。</div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('meetings','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveMeeting('${id||''}')">保存</button></div>`) }
function saveMeeting(id){const old=state.meetings.find(x=>x.id===id),eventDate=$('#f-date').value,times=auditFields(old,eventDate),meetingId=id||uid();const v={id:meetingId,date:eventDate,topic:$('#f-topic').value.trim(),withWhom:$('#f-with').value.trim(),notes:$('#f-notes').value.trim(),actions:$('#f-actions').value.trim(),nextDate:$('#f-next').value,...times};if(!v.topic)return alert('请填写会议主题');const i=state.meetings.findIndex(x=>x.id===id);if(i>=0)state.meetings[i]=v;else state.meetings.push(v);if($('#f-to-todos').value==='1'&&v.actions){const actions=v.actions.split(/[\n；;]+/).map(s=>s.trim()).filter(Boolean),now=nowStamp();actions.forEach(title=>{if(!state.todos.some(t=>t.sourceMeetingId===meetingId&&t.title===title))state.todos.push({id:uid(),title,chapter:'',priority:'中',due:v.nextDate||'',notes:`来自导师会议：${v.topic}`,done:false,sourceMeetingId:meetingId,createdAt:now,updatedAt:now,migratedAt:''})})}closeSheet();save()}

lick="removeItem('figures','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveFigure('${id||''}')">保存</button></div>`) }
function saveFigure(id){const old=state.figures.find(x=>x.id===id),times=auditFields(old);const v={id:id||uid(),kind:$('#f-kind').value,no:$('#f-no').value.trim(),title:$('#f-title').value.trim(),chapter:$('#f-chapter').value.trim(),status:$('#f-status').value,fileName:$('#f-file').value.trim(),sourcePath:$('#f-sourcepath').value.trim(),captionChecked:$('#f-caption').checked,englishCaptionChecked:$('#f-engcaption').checked,insertedInText:$('#f-inserted').checked,citedInText:$('#f-cited').checked,sourceChecked:$('#f-sourcecheck').checked,notes:$('#f-notes').value.trim(),...times};if(!v.title)return alert('请填写图表名称');const i=state.figures.findIndex(x=>x.id===id);if(i>=0)state.figures[i]=v;else state.figures.push(v);closeSheet();save()}

function finalCheckForm(id){const x=state.finalChecks.find(v=>v.id===id)||{category:'自定义',title:'',done:false,notes:''};openSheet(`<h3>${id?'编辑检查项':'新增检查项'}</h3><div class="field"><label>分类</label><input id="f-category" value="${esc(x.category)}"></div><div class="field"><label>检查内容</label><input id="f-title" value="${esc(x.title)}"></div><div class="field"><label>备注</label><textarea id="f-notes">${esc(x.notes||'')}</textarea></div><div class="field"><label>状态</label><select id="f-done"><option value="0" ${!x.done?'selected':''}>未完成</option><option value="1" ${x.done?'selected':''}>已完成</option></select></div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('finalChecks','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveFinalCheck('${id}')">保存</button></div>`)}
function saveFinalCheck(id){const old=state.finalChecks.find(x=>x.id===id),done=$('#f-done').value==='1',times=auditFields(old),now=nowStamp();const v={id:id||uid(),category:$('#f-category').value.trim()||'自定义',title:$('#f-title').value.trim(),notes:$('#f-notes').value.trim(),done,...times,completedAt:done?(old?.completedAt||now):''};if(!v.title)return alert('请填写检查内容');const i=state.finalChecks.findIndex(x=>x.id===id);if(i>=0)state.finalChecks[i]=v;else state.finalChecks.push(v);closeSheet();save()}

function defenseForm(id){const x=state.defense.find(v=>v.id===id)||{title:'',type:'可能提问',status:'待准备',answer:'',notes:'',confidence:1,createdAt:iso(),updatedAt:iso()};openSheet(`<h3>${id?'编辑答辩准备':'新增答辩准备'}</h3><div class="field"><label>事项 / 问题</label><input id="f-title" value="${esc(x.title)}"></div><div class="form2"><div class="field"><label>类型</label><select id="f-type">${['答辩PPT','自我陈述','可能提问','回答要点','材料清单','模拟答辩','其他'].map(s=>`<option ${x.type===s?'selected':''}>${s}</option>`)}</select></div><div class="field"><label>状态</label><select id="f-status">${['待准备','准备中','已完成'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`)}</select></div></div><div class="field"><label>熟悉度（1=不熟，5=很稳）</label><select id="f-confidence">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(x.confidence)===n?'selected':''}>${n}</option>`)}</select></div><div class="field"><label>回答 / 核心要点</label><textarea id="f-answer">${esc(x.answer||'')}</textarea></div><div class="field"><label>备注</label><textarea id="f-notes">${esc(x.notes||'')}</textarea></div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('defense','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveDefense('${id}')">保存</button></div>`)}
function saveDefense(id){const old=state.defense.find(x=>x.id===id),status=$('#f-status').value,times=auditFields(old),now=nowStamp();const v={id:id||uid(),title:$('#f-title').value.trim(),type:$('#f-type').value,status,confidence:+$('#f-confidence').value||1,answer:$('#f-answer').value.trim(),notes:$('#f-notes').value.trim(),...times,completedAt:status==='已完成'?(old?.completedAt||now):''};if(!v.title)return alert('请填写答辩事项');const i=state.defense.findIndex(x=>x.id===id);if(i>=0)state.defense[i]=v;else state.defense.push(v);closeSheet();save()}

function globalSearch(){openSheet(`<h3>全局搜索</h3><div class="searchbox"><input id="globalQ" placeholder="搜章节、问题、文献、导师意见、待办、图表……" oninput="runGlobalSearch(this.value)" autofocus></div><div id="searchResults"><div class="empty">输入关键词即可搜索全部论文记录。</div></div>`);setTimeout(()=>$('#globalQ')?.focus(),100)}
function runGlobalSearch(q){q=String(q||'').trim().toLowerCase();const box=$('#searchResults');if(!q){box.innerHTML='<div class="empty">输入关键词即可搜索全部论文记录。</div>';return}let r=[];const push=(type,title,text,open)=>{if((title+' '+text).toLowerCase().includes(q))r.push({type,title,text,open})};state.chapters.forEach(x=>{push('章节',x.title,x.notes,`chapterDetail('${x.id}')`);(x.sections||[]).forEach(s=>push('小节',s.title,s.notes,`chapterDetail('${x.id}')`));(x.tasks||[]).forEach(t=>push('章节任务',t.title,t.notes,`chapterDetail('${x.id}')`))});state.writingRoutes.forEach(x=>push('写作路线',x.title,routeLabel(x),`writingRouteForm('${x.id}')`));state.problems.forEach(x=>push('问题',x.title,[x.description,x.method,x.resolution,x.lesson,x.evidence,relatedSectionText(x.relatedSectionKey)].join(' '),`problemDetail('${x.id}')`));state.literature.forEach(x=>push('文献',x.title,[x.authors,x.journal,x.doi,x.tags,x.notes,x.citation,x.usedIn,x.researchMethod,x.keyConclusion,x.quote].join(' '),`literatureForm('${x.id}')`));state.feedback.forEach(x=>push('修改',x.title,[x.round,x.detail].join(' '),`feedbackForm('${x.id}')`));state.todos.forEach(x=>push('待办',x.title,x.notes,`todoForm('${x.id}')`));state.meetings.forEach(x=>push('会议',x.topic,[x.notes,x.actions].join(' '),`meetingForm('${x.id}')`));state.figures.forEach(x=>push('图表',(x.no||'')+' '+x.title,[x.notes,x.fileName,x.sourcePath].join(' '),`figureForm('${x.id}')`));state.versions.forEach(x=>push('版本',x.name,[x.note,x.diffNote].join(' '),`versionForm('${x.id}')`));state.defense.forEach(x=>push('答辩',x.title,[x.answer,x.notes].join(' '),`defenseForm('${x.id}')`));box.innerHTML=r.length?r.slice(0,40).map(x=>`<div class="card" onclick="closeSheet();setTimeout(()=>${x.open},50)"><div class="row"><div class="title">${esc(x.title)}</div><span class="chip blue">${x.type}</span></div><div class="meta">${esc(x.text||'').slice(0,110)}</div></div>`).join(''):'<div class="empty">没有找到匹配内容。</div>'}
function settingsForm(){const s=state.settings;openSheet(`<h3>论文与写作设置</h3>
 <div class="field"><label>论文题目</label><input id="f-thesis" value="${esc(s.thesisTitle)}"></div>
 <div class="form2"><div class="field"><label>学校（可选）</label><input id="f-school" value="${esc(s.school||'')}"></div><div class="field"><label>学位类型</label><select id="f-degree">${['硕士','博士','本科'].map(x=>`<option ${s.degreeType===x?'selected':''}>${x}</option>`)}</select></div></div>
 <div class="field"><label>当前阶段</label><select id="f-stage">${['开题后整理','正文写作','导师修改','预答辩准备','送审准备','答辩准备','定稿'].map(x=>`<option ${s.currentStage===x?'selected':''}>${x}</option>`)}</select></div>

 <div class="form2"><div class="field"><label>预计提交日期</label><input id="f-submit" type="date" value="${s.submissionDate||''}"></div><div class="field"><label>预答辩日期</label><input id="f-predef" type="date" value="${s.preDefenseDate||''}"></div></div>
 <div class="form2"><div class="field"><label>正式答辩日期</label><input id="f-defense" type="date" value="${s.defenseDate||''}"></div><div class="field"><label>定稿日期</label><input id="f-final" type="date" value="${s.finalDate||''}"></div></div>

 <div class="field"><label>新写作记录默认章节</label><select id="f-defaultChapter"><option value="">第1章 / 当前首章</option>${state.chapters.map(c=>`<option value="${c.id}" ${s.defaultChapterId===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div>
 <div class="notice">这些参数会影响首页进度、目标、倒计时和完成时间预测。</div><div class="actions"><button class="btn primary" onclick="saveSettings()">保存设置</button></div>`)}
function saveSettings(){state.settings={...state.settings,thesisTitle:$('#f-thesis').value.trim()||'我的硕士学位论文',school:$('#f-school').value.trim(),degreeType:$('#f-degree').value,currentStage:$('#f-stage').value,totalWordGoal:+$('#f-total').value||80000,dailyWordGoal:+$('#f-daily').value||2000,weeklyWordGoal:+$('#f-weekly').value||10000,startDate:$('#f-start').value,firstDraftDate:$('#f-first').value,submissionDate:$('#f-submit').value,preDefenseDate:$('#f-predef').value,defenseDate:$('#f-defense').value,finalDate:$('#f-final').value,focusMinutes:+$('#f-focus').value||25,breakMinutes:+$('#f-break').value||5,defaultChapterId:$('#f-defaultChapter').value,updatedAt:nowStamp()};focusSeconds=state.settings.focusMinutes*60;closeSheet();save()}
function removeItem(key,id){if(!confirm('确定删除这条记录吗？'))return;state[key]=state[key].filter(x=>x.id!==id);closeSheet();save()}

const DB_NAME='AcademicCatThesisDBV66';
const DB_VERSION=1;
const DB_STORES=['state','images','snapshots','trash','meta'];
const TRASH_FALLBACK_KEY='academicCatThesisTrashV66';
let academicDB=null,dbReady=false,dbInitPromise=null,swRegistration=null,updateAvailable=false;

function ensureV66State(){
 state.ui=Object.assign({statsDetailed:false,collapsedChapters:{},archiveCompleted:true},state.ui||{});
 state.settings=Object.assign({lastUsedChapterId:'',lastUsedSectionId:''},state.settings||{});
}

function openAcademicDB(){
 if(dbInitPromise)return dbInitPromise;
 dbInitPromise=new Promise((resolve,reject)=>{
  if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return}
  const req=indexedDB.open(DB_NAME,DB_VERSION);
  req.onupgradeneeded=()=>{const db=req.result;DB_STORES.forEach(name=>{if(!db.objectStoreNames.contains(name)){db.createObjectStore(name,{keyPath:name==='state'||name==='meta'?'key':'id'})}})};
  req.onsuccess=()=>{academicDB=req.result;dbReady=true;resolve(academicDB)};
  req.onerror=()=>reject(req.error||new Error('IndexedDB open failed'));
 });
 return dbInitPromise;
}
function idbStore(name,mode='readonly'){if(!academicDB)throw new Error('DB not ready');return academicDB.transaction(name,mode).objectStore(name)}
function idbGet(name,key){return new Promise((res,rej)=>{try{const r=idbStore(name).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function idbGetAll(name){return new Promise((res,rej)=>{try{const r=idbStore(name).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function idbPut(name,value){return new Promise((res,rej)=>{try{const r=idbStore(name,'readwrite').put(value);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function idbDelete(name,key){return new Promise((res,rej)=>{try{const r=idbStore(name,'readwrite').delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function idbClear(name){return new Promise((res,rej)=>{try{const r=idbStore(name,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function persistStateIDB(){try{await openAcademicDB();await idbPut('state',{key:'main',value:clone(state),updatedAt:nowStamp()});await idbPut('meta',{key:'lastWrite',value:nowStamp()})}catch(e){console.warn('IDB persist fallback',e)}}
async function initV66Database(){
 try{
  await openAcademicDB();
  const saved=await idbGet('state','main');
  if(saved?.value){state=normalize(saved.value);ensureV66State()}
  else{
   await idbPut('snapshots',{id:uid(),ts:Date.now(),label:'V6.5 → V6.6 迁移前快照',state:clone(state),kind:'migration'});
   await idbPut('state',{key:'main',value:clone(state),updatedAt:nowStamp()});
   const verify=await idbGet('state','main'),keys=['chapters','writingLogs','problems','literature','todos','feedback','figures','meetings'];const verified=!!verify?.value&&keys.every(k=>(verify.value[k]||[]).length===(state[k]||[]).length);
   await idbPut('meta',{key:'migration',value:{from:'V6.5/localStorage',at:nowStamp(),verified}});if(!verified)throw new Error('迁移校验未通过');
  }
  await cleanOldSnapshots();await cleanOldTrash();
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  renderAll();updateStorageStatus();
 }catch(e){console.warn('IndexedDB unavailable, compatibility mode',e);updateStorageStatus(false)}
}

function save(options={}){
 ensureV66State();
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}
 persistStateIDB();maybeSnapshot();
 if(options.render!==false)renderAll();
}
async function maybeSnapshot(force=false,label=''){
 try{
  await openAcademicDB();const arr=(await idbGetAll('snapshots')).sort((a,b)=>b.ts-a.ts),now=Date.now(),last=arr[0]?.ts||0;
  if(force||now-last>6*3600000){await idbPut('snapshots',{id:uid(),ts:now,label:label||(force?'手动快照':'自动快照'),state:clone(state),kind:force?'manual':'auto'});await cleanOldSnapshots()}
 }catch(e){
  try{let arr=JSON.parse(localStorage.getItem(SNAPSHOT_KEY)||'[]');const now=Date.now(),last=arr[0]?.ts||0;if(force||now-last>6*3600000){arr.unshift({id:uid(),ts:now,label:label||(force?'手动快照':'自动快照'),state:clone(state)});localStorage.setItem(SNAPSHOT_KEY,JSON.stringify(arr.slice(0,12)))}}catch(_){}
 }
}
async function cleanOldSnapshots(){if(!dbReady)return;const arr=(await idbGetAll('snapshots')).sort((a,b)=>b.ts-a.ts);for(const x of arr.slice(12))await idbDelete('snapshots',x.id)}

function trashLabel(module,item){const names={chapters:'章节',writingLogs:'写作记录',writingRoutes:'写作路线',problems:'问题',feedback:'导师修改',literature:'文献',figures:'图表',milestones:'节点',todos:'待办',versions:'版本',defense:'答辩',meetings:'会议',chapterTasks:'章节任务',sections:'小节'};return `${names[module]||module} · ${item?.title||item?.name||item?.topic||item?.no||'未命名'}`}

async function getTrash(){try{await openAcademicDB();return (await idbGetAll('trash')).sort((a,b)=>b.deletedAt-a.deletedAt)}catch(e){try{return JSON.parse(localStorage.getItem(TRASH_FALLBACK_KEY)||'[]')}catch(_){return []}}}
async function restoreTrash(id){const arr=await getTrash(),e=arr.find(x=>x.id===id);if(!e)return;const m=e.module,item=e.item,ctx=e.context||{};
 if(m==='storedImage'&&ctx.image){try{await openAcademicDB();await idbPut('images',ctx.image)}catch(err){} }
 else if(m==='sections'){const c=state.chapters.find(x=>x.id===ctx.parentChapterId);if(c&&!c.sections.some(x=>x.id===item.id))c.sections.push(item)}
 else if(m==='chapterTasks'){const c=state.chapters.find(x=>x.id===ctx.parentChapterId);if(c&&!c.tasks.some(x=>x.id===item.id))c.tasks.push(item)}
 else if(Array.isArray(state[m])&&!state[m].some(x=>x.id===item.id)){state[m].push(item);if(m==='writingLogs')applyWritingDelta(item.chapterId,item.sectionId,Number(item.words||0))}
 try{await idbDelete('trash',id)}catch(err){const rest=arr.filter(x=>x.id!==id);localStorage.setItem(TRASH_FALLBACK_KEY,JSON.stringify(rest))}
 save();closeSheet();showToast('已从回收站恢复')
}

function toggleChapterCollapse(id){ensureV66State();state.ui.collapsedChapters[id]=!state.ui.collapsedChapters[id];save({render:false});renderChapters()}
function renderChapters(){
 ensureV66State();
 const cards=state.chapters.map(c=>{const p=pct(c.currentWords,c.targetWords),sec=c.sections||[],tasks=c.tasks||[],collapsed=state.ui.collapsedChapters[c.id]!==false,td=tasks.filter(t=>t.done).length;return `<div class="card chapter-tree"><div class="row chapter-tree-head" onclick="toggleChapterCollapse('${c.id}')"><div style="min-width:0"><div class="title">${collapsed?'›':'⌄'} ${esc(c.title)}</div><div class="meta">${fmt(c.currentWords)} / ${fmt(c.targetWords)} 字 · ${esc(c.status||'')} · ${sec.length} 小节 · 任务 ${td}/${tasks.length}</div></div><div class="progress-ring" style="--ring:${p}%"><b>${p}%</b></div></div><div class="small-progress"><span style="width:${p}%"></span></div>${collapsed?'':`<div class="tree-body"><div class="tree-actions"><button class="tiny-btn" onclick="event.stopPropagation();chapterDetail('${c.id}')">详情</button><button class="tiny-btn" onclick="event.stopPropagation();sectionForm('${c.id}')">+ 小节</button><button class="tiny-btn" onclick="event.stopPropagation();chapterTaskForm('${c.id}')">+ 任务</button></div>${sec.map(s=>`<div class="tree-item" onclick="sectionForm('${c.id}','${s.id}')"><span>${esc(s.title)}</span><small>${pct(s.currentWords,s.targetWords)}% · ${esc(s.status||'')}</small></div>`).join('')||'<div class="meta">暂无小节</div>'}${tasks.filter(t=>!t.done).slice(0,5).map(t=>`<div class="tree-item task" onclick="chapterTaskForm('${c.id}','${t.id}')"><span>□ ${esc(t.title)}</span><small>${esc(t.priority||'中')} · ${esc(t.due||'未定日期')}</small></div>`).join('')}</div>`}</div>`}).join('');
 $('#view-chapters').innerHTML=`<div class="page-head"><div><h2>写作台</h2><div class="sub">章节默认折叠，展开后直接处理小节和任务</div></div></div>${workspaceSwitcher('chapters')}${writingRouteHTML()}<div class="section-title" style="margin-top:14px"><h2>章节树</h2><span class="sub">${state.chapters.length} 章 · ${state.chapters.reduce((s,c)=>s+(c.sections?.length||0),0)} 小节</span></div>${cards||'<div class="empty">暂无章节</div>'}`
}

function setResourceGroup(g){resourceGroup=g;const first={materials:'literature',execution:'todos',delivery:'versions'}[g];resourceTab=first;resourceFilter=g==='materials'?'all':'active';resourceSort='default';resourceListLimit=36;renderResources()}
function resourceGroupForTab(tab){if(['literature','figures','images'].includes(tab))return'materials';if(['todos','feedback','meetings','milestones'].includes(tab))return'execution';return'delivery'}
function setResourceTab(tab){resourceTab=tab;resourceGroup=resourceGroupForTab(tab);resourceFilter=['todos','feedback','figures','defense'].includes(tab)?'active':'all';resourceSort='default';resourceListLimit=36;renderResources()}
function setResourceFilter(v){resourceFilter=v;resourceListLimit=36;renderResources()}
function setResourceSort(v){resourceSort=v;resourceListLimit=36;renderResources()}
function showMoreResources(){resourceListLimit+=36;renderResources()}
function archiveToggleHTML(doneCount){return doneCount?`<div class="archive-line"><span>已归档 ${doneCount} 项</span><button class="tiny-btn" onclick="setResourceFilter('${resourceFilter==='all'?'active':'all'}')">${resourceFilter==='all'?'隐藏已完成':'查看归档'}</button></div>`:''}
function resourceGroupHeader(){return `<div class="resource-groups"><button class="${resourceGroup==='materials'?'active':''}" onclick="setResourceGroup('materials')"><b>资料</b><span>文献 · 图表 · 图片</span></button><button class="${resourceGroup==='execution'?'active':''}" onclick="setResourceGroup('execution')"><b>执行</b><span>待办 · 修改 · 会议 · 节点</span></button><button class="${resourceGroup==='delivery'?'active':''}" onclick="setResourceGroup('delivery')"><b>交付</b><span>版本 · 送审 · 答辩</span></button></div>`}
function resourceTabs(){const all={materials:[['literature','文献'],['figures','图表'],['images','图片库']],execution:[['todos','待办'],['feedback','修改'],['meetings','会议'],['milestones','节点']],delivery:[['versions','版本'],['finalcheck','送审'],['defense','答辩']]};return all[resourceGroup]||all.materials}
function resourceControlsHTML(){if(resourceTab==='literature')return `<div class="filterbar"><button class="${resourceFilter==='all'?'active':''}" onclick="setResourceFilter('all')">全部</button><button class="${resourceFilter==='unread'?'active':''}" onclick="setResourceFilter('unread')">待读</button><button class="${resourceFilter==='deep'?'active':''}" onclick="setResourceFilter('deep')">精读</button><button class="${resourceFilter==='cited'?'active':''}" onclick="setResourceFilter('cited')">已引用</button><span class="filter-spacer"></span><button class="${resourceSort==='year'?'active':''}" onclick="setResourceSort('year')">按年份</button><button class="${resourceSort==='favorite'?'active':''}" onclick="setResourceSort('favorite')">按重点</button></div>`;if(['todos','feedback','figures','defense'].includes(resourceTab))return `<div class="filterbar"><button class="${resourceFilter==='active'?'active':''}" onclick="setResourceFilter('active')">进行中</button><button class="${resourceFilter==='all'?'active':''}" onclick="setResourceFilter('all')">全部</button><button class="${resourceFilter==='done'?'active':''}" onclick="setResourceFilter('done')">已完成</button><span class="filter-spacer"></span>${resourceTab==='todos'?`<button class="${resourceSort==='priority'?'active':''}" onclick="setResourceSort('priority')">优先级</button><button class="${resourceSort==='due'?'active':''}" onclick="setResourceSort('due')">截止日</button>`:''}${resourceTab==='feedback'?`<button class="${resourceSort==='priority'?'active':''}" onclick="setResourceSort('priority')">优先级</button>`:''}</div>`;return''}
function listMoreHTML(total){return total>resourceListLimit?`<button class="pill-btn" style="width:100%;margin-top:4px" onclick="showMoreResources()">再显示 ${Math.min(36,total-resourceListLimit)} 项</button>`:''}

function renderResources(){
 const tabs=resourceTabs();if(!tabs.some(t=>t[0]===resourceTab)){resourceTab=tabs[0][0]}
 let body='',total=0,doneCount=0;
 if(resourceTab==='literature'){
  let arr=state.literature.slice();if(resourceFilter==='unread')arr=arr.filter(x=>['待阅读','粗读','已浏览'].includes(x.status));if(resourceFilter==='deep')arr=arr.filter(x=>x.status==='已精读');if(resourceFilter==='cited')arr=arr.filter(x=>x.status==='已引用');if(resourceSort==='year')arr.sort((a,b)=>String(b.year).localeCompare(String(a.year)));else if(resourceSort==='favorite')arr.sort((a,b)=>(b.favorite?1:0)-(a.favorite?1:0)||String(b.year).localeCompare(String(a.year)));else arr.sort((a,b)=>(b.favorite?1:0)-(a.favorite?1:0)||String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||'')));total=arr.length;body=arr.slice(0,resourceListLimit).map(x=>`<div class="card" onclick="literatureForm('${x.id}')"><div class="row"><div class="title">${x.favorite?'<span class="star">★</span> ':''}${esc(x.title)}</div>${statusChip(x.status||'待阅读')}</div><div class="meta">${esc(x.authors||'')} ${esc(x.year||'')} ${x.journal?'· '+esc(x.journal):''} · 用于：${esc(x.usedIn||'未指定')}</div>${tagsHTML(x.tags)}${auditHTML(x)}</div>`).join('')||'<div class="empty">还没有匹配的文献。</div>';
 }else if(resourceTab==='todos'){
  let all=state.todos.slice();const pr={高:0,中:1,低:2};if(resourceSort==='priority')all.sort((a,b)=>(a.done-b.done)||(pr[a.priority]??1)-(pr[b.priority]??1)||String(a.due||'9999').localeCompare(String(b.due||'9999')));else all.sort((a,b)=>(a.done-b.done)||String(a.due||'9999').localeCompare(String(b.due||'9999')));doneCount=all.filter(x=>x.done).length;if(resourceFilter==='active')all=all.filter(x=>!x.done);if(resourceFilter==='done')all=all.filter(x=>x.done);total=all.length;body=all.slice(0,resourceListLimit).map(x=>`<div class="card" onclick="todoForm('${x.id}')"><div class="row"><div class="title">${x.done?'✓ ':''}${esc(x.title)}</div>${dueBadge(x.due,x.done)||statusChip(x.done?'已完成':'待完成')}</div><div class="meta">${esc(x.chapter||'未指定章节')} · ${esc(x.priority||'中')}优先级${x.due?' · '+esc(x.due):''}</div>${auditHTML(x)}</div>`).join('')||'<div class="empty">当前没有待办。</div>';
 }else if(resourceTab==='feedback'){
  let all=state.feedback.slice();const fp={高:0,中:1,低:2};all.sort((a,b)=>(a.status==='已完成')-(b.status==='已完成')+(resourceSort==='priority'?0:0)||((fp[a.priority]??1)-(fp[b.priority]??1))||String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));doneCount=all.filter(x=>x.status==='已完成').length;if(resourceFilter==='active')all=all.filter(x=>x.status!=='已完成');if(resourceFilter==='done')all=all.filter(x=>x.status==='已完成');total=all.length;body=all.slice(0,resourceListLimit).map(x=>`<div class="card" onclick="feedbackForm('${x.id}')"><div class="row"><div class="title">${esc(x.title)}</div>${statusChip(x.status)}</div><div class="meta">${esc(x.round||'未分轮次')} · ${esc(x.chapter||'未指定章节')} · ${esc(x.priority||'中')}优先级</div>${auditHTML(x)}</div>`).join('')||'<div class="empty">当前没有修改任务。</div>';
 }else if(resourceTab==='meetings'){
  let arr=state.meetings.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));total=arr.length;body=arr.slice(0,resourceListLimit).map(x=>`<div class="card" onclick="meetingForm('${x.id}')"><div class="row"><div class="title">${esc(x.topic)}</div><span class="chip blue">${esc(x.date||'')}</span></div><div class="meta">${esc(x.withWhom||'导师沟通')}${x.actions?' · '+esc(x.actions).slice(0,65):''}</div>${auditHTML(x,x.date)}</div>`).join('')||'<div class="empty">还没有导师会议记录。</div>';
 }else if(resourceTab==='figures'){
  let all=state.figures.slice();doneCount=all.filter(x=>x.status==='已完成').length;if(resourceFilter==='active')all=all.filter(x=>x.status!=='已完成');if(resourceFilter==='done')all=all.filter(x=>x.status==='已完成');total=all.length;body=all.slice(0,resourceListLimit).map(x=>`<div class="card" onclick="figureForm('${x.id}')"><div class="row"><div class="title">${esc(x.no||'未编号')} ${esc(x.title)}</div>${statusChip(x.status||'待制作')}</div><div class="meta">${esc(x.kind||'图')} · ${esc(x.chapter||'未指定章节')} · 图题${x.captionChecked?'✓':'○'} · 正文${x.insertedInText?'✓':'○'} · 引用${x.citedInText?'✓':'○'}</div>${auditHTML(x)}</div>`).join('')||'<div class="empty">还没有图表记录。</div>';
 }else if(resourceTab==='images'){
  body=`<div class="card"><div class="row"><div><div class="title">IndexedDB 图片资料库</div><div class="meta">图片原文件本地保存，不写入 localStorage，也不会上传 GitHub。</div></div><button class="tiny-btn" onclick="imageLibrary()">+ 图片</button></div></div><div id="resourceImageList"><div class="empty">正在读取图片……</div></div>`;setTimeout(()=>renderResourceImageList(),0)
 }else if(resourceTab==='milestones'){
  let arr=state.milestones.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));total=arr.length;body=arr.slice(0,resourceListLimit).map(x=>`<div class="card" onclick="milestoneForm('${x.id}')"><div class="row"><div class="title">${esc(x.title)}</div>${x.date?dueBadge(x.date,x.status==='已完成'):statusChip(x.status||'待完成')}</div><div class="meta">${esc(x.date||'未定日期')} · ${esc(x.status||'待完成')}</div>${auditHTML(x,x.date)}</div>`).join('')||'<div class="empty">还没有时间节点。</div>';
 }else if(resourceTab==='versions'){
  let arr=state.versions.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));total=arr.length;body=arr.slice(0,resourceListLimit).map(x=>`<div class="card" onclick="versionForm('${x.id}')"><div class="row"><div class="title">${esc(x.name)}</div><span class="chip blue">${esc(x.date||'')}</span></div><div class="meta">${esc(x.stage||'未分类')} · ${fmt(x.wordCount||0)} 字${x.diffNote?' · '+esc(x.diffNote).slice(0,70):''}</div>${auditHTML(x,x.date)}</div>`).join('')||'<div class="empty">还没有版本记录。</div>';
 }else if(resourceTab==='finalcheck'){
  const r=submissionReadiness();body=`<div class="card readiness ${r.cls}"><div class="row"><div><div class="title">送审检查中心 · ${r.level}</div><div class="meta">检查项 ${r.checksDone}/${r.checksTotal} · 图表待完善 ${r.figOpen} · 高优先级问题 ${r.openProblems}</div></div><div class="progress-ring" style="--ring:${r.score}%"><b>${r.score}%</b></div></div></div>`+state.finalChecks.map(x=>`<div class="card"><div class="checkrow"><input type="checkbox" ${x.done?'checked':''} onchange="toggleFinalCheck('${x.id}',this.checked)"><div style="flex:1"><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.category)}</div></div><button class="pill-btn" style="padding:6px 8px" onclick="finalCheckForm('${x.id}')">编辑</button></div></div>`).join('')+`<button class="pill-btn" style="width:100%" onclick="finalCheckForm()">+ 自定义检查项</button>`;
 }else{
  let all=state.defense.slice().sort((a,b)=>(a.status==='已完成')-(b.status==='已完成'));doneCount=all.filter(x=>x.status==='已完成').length;if(resourceFilter==='active')all=all.filter(x=>x.status!=='已完成');if(resourceFilter==='done')all=all.filter(x=>x.status==='已完成');total=all.length;body=all.slice(0,resourceListLimit).map(x=>`<div class="card" onclick="defenseForm('${x.id}')"><div class="row"><div class="title">${esc(x.title)}</div>${statusChip(x.status||'待准备')}</div><div class="meta">${esc(x.type||'答辩事项')} · 熟悉度 ${x.confidence||1}/5</div>${auditHTML(x)}</div>`).join('')||'<div class="empty">当前没有答辩准备记录。</div>';
 }
 $('#view-resources').innerHTML=`<div class="resource-page-head"><div><h2>资料流程</h2><p>按“资料—执行—交付”分组，常用内容更容易找到。</p></div><div class="badge">${resourceTabTitle()}</div></div>${resourceGroupHeader()}<div class="tabs compact">${tabs.map(t=>`<button class="${resourceTab===t[0]?'active':''}" onclick="setResourceTab('${t[0]}')">${t[1]}</button>`).join('')}</div>${resourceControlsHTML()}${body}${archiveToggleHTML(doneCount)}${listMoreHTML(total)}`
}
async function renderResourceImageList(){const target=$('#resourceImageList');if(!target)return;let arr=[];try{await openAcademicDB();arr=(await idbGetAll('images')).sort((a,b)=>b.createdAt-a.createdAt)}catch(e){}target.innerHTML=arr.length?arr.slice(0,40).map(x=>`<div class="image-row"><div class="image-thumb" id="rthumb-${x.id}"></div><div class="image-info"><b>${esc(x.name)}</b><span>${Math.max(1,Math.round((x.size||0)/1024))} KB · ${esc(x.ownerLabel||x.ownerType||'资料库')}</span></div><button class="tiny-btn" onclick="deleteStoredImage('${x.id}')">删除</button></div>`).join(''):'<div class="empty">还没有图片。点“+ 图片”从相册或文件中选择。</div>';for(const x of arr.slice(0,40)){const e=$(`#rthumb-${x.id}`);if(e&&x.blob){const u=URL.createObjectURL(x.blob);e.innerHTML=`<img src="${u}">`;setTimeout(()=>URL.revokeObjectURL(u),60000)}}}

function toggleStatsDetail(){ensureV66State();state.ui.statsDetailed=!state.ui.statsDetailed;save({render:false});renderStats()}
function renderStats(){
 ensureV66State();const labels={today:'单日',week:'每周',month:'每月',year:'年度',all:'总览'},s=rangeSummary(statsRange);let chart='';
 if(statsRange==='today')chart=`<div class="chart-card"><div class="row"><div class="title">${esc(periodLabel())} · 写作会话</div><div class="meta">共 ${s.sessions} 次</div></div>${todaySessions(statsAnchor).length?barChart(todaySessions(statsAnchor)):'<div class="empty">这一天还没有写作记录</div>'}</div>${state.ui.statsDetailed?dayRecordListHTML(statsAnchor):''}`;
 if(statsRange==='week')chart=`<div class="chart-card"><div class="row"><div class="title">本周每日字数</div><div class="meta">${esc(periodLabel())}</div></div>${barChart(weekData(statsAnchor),'周')}</div>${state.ui.statsDetailed?weekRecordListHTML(statsAnchor)+periodOtherRecordsHTML('week',statsAnchor):''}`;
 if(statsRange==='month')chart=`<div class="chart-card"><div class="row"><div class="title">${esc(periodLabel())}写作趋势</div><div class="meta">每5天汇总</div></div>${barChart(monthBuckets(statsAnchor))}</div>${state.ui.statsDetailed?calendarHTML(statsAnchor)+monthWeeksHTML(statsAnchor):''}`;
 if(statsRange==='year'){const y=dateObj(statsAnchor).getFullYear();chart=`<div class="chart-card"><div class="row"><div class="title">${y} 年月度字数</div><div class="meta">单位：字</div></div>${barChart(yearData(y))}</div>${state.ui.statsDetailed?calendarHTML(statsAnchor):''}`}
 if(statsRange==='all')chart=`${allStatsHTML()}${state.ui.statsDetailed?monthlyHistoryHTML(12)+calendarHTML():''}`;
 $('#view-stats').innerHTML=`<div class="stats-page-head"><div><h2>统计分析</h2><p>默认先看核心指标，需要时再展开详细记录、日历和历史下钻。</p></div><button class="mini" onclick="toggleStatsDetail()">${state.ui.statsDetailed?'收起详细':'展开详细'}</button></div><div class="segment">${Object.entries(labels).map(([k,v])=>`<button class="${statsRange===k?'active':''}" onclick="setStatsRange('${k}')">${v}</button>`).join('')}</div>${periodNavHTML()}<div class="summary-grid"><div class="summary"><div class="l">${labels[statsRange]}写作</div><div class="n">${fmt(s.words)}<small>字</small></div></div><div class="summary"><div class="l">专注时长</div><div class="n">${fmt(s.mins)}<small>分</small></div></div><div class="summary"><div class="l">写作会话</div><div class="n">${s.sessions}<small>次</small></div></div><div class="summary"><div class="l">新增/解决问题</div><div class="n">${s.problems}<small> / ${s.solved}</small></div></div></div>${statsInsightsHTML(statsRange,statsAnchor,s)}<div class="section-title"><h2>趋势${state.ui.statsDetailed?'与历史':''}</h2><span class="sub">${statsHintText()}</span></div>${chart}`
}

function writingLogForm(id,presetCid,presetSid,presetMinutes){const remembered=state.settings.lastUsedChapterId||state.settings.defaultChapterId||state.chapters[0]?.id||'';const old=state.writingLogs.find(x=>x.id===id)||{date:iso(),chapterId:presetCid||remembered,sectionId:presetSid||state.settings.lastUsedSectionId||'',words:'',minutes:presetMinutes||state.settings.focusMinutes,note:''};openSheet(`<h3>${id?'编辑写作记录':'登记本次写作'}</h3>${presetMinutes?`<div class="notice">本轮专注已完成，${presetMinutes} 分钟已自动带入。</div>`:''}<div class="field"><label>日期</label><input id="f-date" type="date" value="${old.date||iso()}"></div><div class="field"><label>所属章节</label><select id="f-ch" onchange="refreshSectionSelect()">${state.chapters.map(c=>`<option value="${c.id}" ${old.chapterId===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><div class="field"><label>具体小节（可选）</label><select id="f-sec"></select></div><div class="form2"><div class="field"><label>本次新增字数</label><input id="f-words" type="number" inputmode="numeric" value="${old.words||''}"></div><div class="field"><label>实际用时（分钟）</label><input id="f-min" type="number" inputmode="numeric" value="${old.minutes||state.settings.focusMinutes}"></div></div><div class="field"><label>本次完成内容</label><textarea id="f-note">${esc(old.note||'')}</textarea></div><div class="actions">${id?`<button class="btn danger" onclick="deleteWritingLog('${id}')">删除</button>`:'<button class="btn soft" onclick="closeSheet()">取消</button>'}<button class="btn primary" onclick="saveWritingLog('${id||''}')">保存</button></div>`);setTimeout(()=>refreshSectionSelect(old.sectionId||presetSid||''),0)}
function saveWritingLog(id){const old=state.writingLogs.find(x=>x.id===id),words=+$('#f-words').value||0,minutes=+$('#f-min').value||0,cid=$('#f-ch').value,sid=$('#f-sec').value;if(words<=0)return alert('请填写本次新增字数');if(old)applyWritingDelta(old.chapterId,old.sectionId,-Number(old.words||0));applyWritingDelta(cid,sid,words);const workDate=$('#f-date').value,times=auditFields(old,workDate);const v={id:id||uid(),date:workDate,chapterId:cid,sectionId:sid,words,minutes,note:$('#f-note').value.trim(),...times};const i=state.writingLogs.findIndex(x=>x.id===id);if(i>=0)state.writingLogs[i]=v;else state.writingLogs.push(v);if(!old&&minutes>0){const ft=auditFields(null,workDate);state.focusLogs.push({id:uid(),date:v.date,minutes,task:v.note,...ft})}if(!old&&workDate===iso()){const route=state.writingRoutes.find(r=>!r.done&&r.date===workDate&&r.chapterId===cid&&(!r.sectionId||r.sectionId===sid));if(route){route.done=true;route.updatedAt=nowStamp();route.completedAt=route.updatedAt}}state.settings.lastUsedChapterId=cid;state.settings.lastUsedSectionId=sid;focusPresetChapterId=cid;focusPresetSectionId=sid;closeSheet();save();go('home')}

function figureForm(id){const rid=id||uid(),x=state.figures.find(v=>v.id===id)||{kind:'图',no:'',title:'',chapter:'',status:'待制作',captionChecked:false,citedInText:false,sourceChecked:false,insertedInText:false,englishCaptionChecked:false,fileName:'',sourcePath:'',notes:''};openSheet(`<h3>${id?'编辑图表':'新增图表清单'}</h3><div class="form2"><div class="field"><label>类型</label><select id="f-kind"><option ${x.kind==='图'?'selected':''}>图</option><option ${x.kind==='表'?'selected':''}>表</option></select></div><div class="field"><label>编号</label><input id="f-no" value="${esc(x.no)}" placeholder="图3-2"></div></div><div class="field"><label>图表名称</label><input id="f-title" value="${esc(x.title)}"></div><div class="form2"><div class="field"><label>所属章节</label><input id="f-chapter" value="${esc(x.chapter)}"></div><div class="field"><label>状态</label><select id="f-status">${['待制作','制作中','待核对','已完成'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="form2"><div class="field"><label>图片/表格文件名</label><input id="f-file" value="${esc(x.fileName||'')}"></div><div class="field"><label>原始数据/工程文件位置</label><input id="f-sourcepath" value="${esc(x.sourcePath||'')}"></div></div><div class="field"><label>检查项</label><div class="field-checks"><label class="field-check"><input id="f-caption" type="checkbox" ${x.captionChecked?'checked':''}>中文图题/表题</label><label class="field-check"><input id="f-engcaption" type="checkbox" ${x.englishCaptionChecked?'checked':''}>英文图题/表题</label><label class="field-check"><input id="f-inserted" type="checkbox" ${x.insertedInText?'checked':''}>已插入正文</label><label class="field-check"><input id="f-cited" type="checkbox" ${x.citedInText?'checked':''}>正文引用已核对</label><label class="field-check"><input id="f-sourcecheck" type="checkbox" ${x.sourceChecked?'checked':''}>来源/注释已核对</label></div></div><div class="field"><label>备注</label><textarea id="f-notes">${esc(x.notes||'')}</textarea></div><div class="field"><label>本地图片（可多选）</label><input id="f-local-images" type="file" accept="image/*" multiple></div><div class="notice">选择的结果图、截图或图件预览会保存到 IndexedDB，并与这条图表记录关联。已有图片可在“资料 → 图片库”查看。</div><div class="actions">${id?`<button class="btn danger" onclick="removeItem('figures','${id}')">删除</button>`:''}<button class="btn primary" onclick="saveFigure('${rid}')">保存</button></div>`)}
async function saveFigure(id){const old=state.figures.find(x=>x.id===id),times=auditFields(old);const v={id:id||uid(),kind:$('#f-kind').value,no:$('#f-no').value.trim(),title:$('#f-title').value.trim(),chapter:$('#f-chapter').value.trim(),status:$('#f-status').value,fileName:$('#f-file').value.trim(),sourcePath:$('#f-sourcepath').value.trim(),captionChecked:$('#f-caption').checked,englishCaptionChecked:$('#f-engcaption').checked,insertedInText:$('#f-inserted').checked,citedInText:$('#f-cited').checked,sourceChecked:$('#f-sourcecheck').checked,notes:$('#f-notes').value.trim(),...times};if(!v.title)return alert('请填写图表名称');const files=[...($('#f-local-images')?.files||[])];const i=state.figures.findIndex(x=>x.id===id);if(i>=0)state.figures[i]=v;else state.figures.push(v);if(files.length){try{await storeImageFiles(files,'figures',v.id,`${v.no||''} ${v.title}`.trim())}catch(e){console.warn('image store failed',e);alert('图表记录会正常保存，但本次图片未能写入本地图片库。')}}closeSheet();save()}
function resourceTabTitle(){return ({literature:'文献卡片',feedback:'导师修改',todos:'论文待办',meetings:'导师会议',figures:'图表管理',images:'图片资料库',milestones:'时间节点',versions:'版本管理',finalcheck:'送审检查',defense:'答辩准备'})[resourceTab]||'资料流程'}

async function latestSnapshotTextV66(){try{await openAcademicDB();const a=(await idbGetAll('snapshots')).sort((x,y)=>y.ts-x.ts);return a.length?new Date(a[0].ts).toLocaleString('zh-CN'):'暂无'}catch(e){return latestSnapshotText()}}
async function updateStorageStatus(ok=dbReady){const el=$('#storageStatus');if(!el)return;let images=0,trash=0,snaps=0;try{images=(await idbGetAll('images')).length;trash=(await idbGetAll('trash')).length;snaps=(await idbGetAll('snapshots')).length}catch(e){}el.textContent=ok?`IndexedDB 正常 · 图片 ${images} · 快照 ${snaps} · 回收站 ${trash}`:'兼容存储模式 · 建议保留 JSON 备份'}
function renderSettings(){const s=state.settings;$('#view-settings').innerHTML=`<div class="settings-page-head"><img src="apple-touch-icon.png"><div><h2>我的</h2><p>设置、数据安全、离线状态和本地数据库集中管理</p></div></div><div class="settings-section"><h3>论文与写作</h3><div class="setting-row" onclick="settingsForm()"><div class="left"><div class="name">论文与时间节点</div><div class="value">${esc(s.thesisTitle)} · ${fmt(s.totalWordGoal)}字 · ${esc(s.currentStage||'正文写作')}</div></div><span class="chev">›</span></div><div class="setting-row" onclick="quickPrivacySettings()"><div class="left"><div class="name">显示与写作偏好</div><div class="value">默认每日 ${fmt(s.dailyWordGoal)} 字 · 专注 ${s.focusMinutes} 分钟</div></div><span class="chev">›</span></div></div><div class="settings-section"><h3>本地数据库</h3><div class="desc">V6.6 使用 IndexedDB 保存主数据和图片，localStorage 仅保留兼容镜像</div><div class="setting-row"><div class="left"><div class="name">存储状态</div><div class="value" id="storageStatus">正在检查……</div></div><span class="storage-dot ${dbReady?'ok':'warn'}"></span></div><div class="settings-grid"><button class="pill-btn" onclick="imageLibrary()">图片资料库</button><button class="pill-btn" onclick="trashManager()">回收站</button><button class="pill-btn" onclick="manualSnapshot()">立即快照</button><button class="pill-btn" onclick="snapshotManager()">历史快照</button></div></div><div class="settings-section"><h3>备份与检索</h3><div class="settings-grid"><button class="pill-btn" onclick="exportBackup()">导出 JSON</button><button class="pill-btn" onclick="importBackup()">导入 JSON</button><button class="pill-btn" onclick="exportCSV()">导出 CSV</button><button class="pill-btn" onclick="globalSearch()">全局搜索</button></div></div><div class="settings-section"><h3>离线与更新</h3><div class="setting-row"><div class="left"><div class="name">网络状态</div><div class="value">程序核心文件采用离线优先；联网后后台检查新版。</div></div><span id="networkBadge" class="network-badge">检测中</span></div><div class="settings-grid"><button class="pill-btn" onclick="checkForUpdate()">检查更新</button><button class="pill-btn" onclick="clearAppCache()">重建离线缓存</button></div></div><div class="settings-section"><h3>App 信息</h3><div class="setting-row"><div class="left"><div class="name">学术猫·论文工作台 <span class="version-badge">V6.6</span></div><div class="value">IndexedDB · 图片存储 · 自动快照 · 回收站 · 离线优先 · 五导航</div></div></div><button class="pill-btn" style="width:100%" onclick="showUsageHelp()">使用说明</button></div><div class="settings-section"><h3 style="color:var(--bad)">危险操作</h3><div class="setting-row danger-zone" onclick="resetAllDataV66()"><div class="left"><div class="name" style="color:var(--bad)">清空全部论文数据</div><div class="value">会清除 IndexedDB 主数据、图片、快照和回收站。建议先导出 JSON。</div></div><span class="chev">›</span></div></div>`;updateNetworkBadge();setTimeout(()=>updateStorageStatus(),0)}
async function resetAllDataV66(){if(!confirm('第一次确认：真的要清空全部论文数据吗？'))return;if(!confirm('第二次确认：包括本地图片、快照和回收站也会删除。'))return;await maybeSnapshot(true,'清空数据前快照');try{await openAcademicDB();for(const s of DB_STORES)await idbClear(s)}catch(e){}LEGACY_KEYS.concat([STORAGE_KEY]).forEach(k=>localStorage.removeItem(k));localStorage.removeItem(SNAPSHOT_KEY);localStorage.removeItem(TRASH_FALLBACK_KEY);state=normalize(clone(defaults));ensureV66State();save();alert('已清空并重新初始化')}

function exportBackup(){maybeSnapshot(true,'导出备份前快照');const payload={app:'AcademicCat',version:'6.6',exportedAt:nowStamp(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`学术猫论文工作台-V6.6-备份-${iso()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importBackup(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{let v=JSON.parse(r.result);v=v?.state||v;if(!v||typeof v!=='object')throw new Error();if(confirm('导入会覆盖当前数据，确定继续吗？')){await maybeSnapshot(true,'导入前自动快照');state=normalize(v);ensureV66State();save();alert('导入成功')}}catch(e){alert('备份文件无法读取')}};r.readAsText(f)};inp.click()}

function globalSearch(){openSheet(`<h3>全局搜索</h3><div class="searchbox"><input id="globalQ" placeholder="搜索章节、文献、问题、会议、版本、图片名称……" oninput="runGlobalSearchV66(this.value)" autofocus></div><div id="searchResults"><div class="empty">输入关键词，结果会标注来源并可直接打开。</div></div>`);setTimeout(()=>$('#globalQ')?.focus(),100)}
async function runGlobalSearchV66(q){runGlobalSearch(q);q=String(q||'').trim().toLowerCase();if(!q)return;const box=$('#searchResults');let imageHits=[];try{await openAcademicDB();imageHits=(await idbGetAll('images')).filter(x=>`${x.name} ${x.ownerLabel||''}`.toLowerCase().includes(q)).slice(0,10)}catch(e){}if(imageHits.length)box.innerHTML+=imageHits.map(x=>`<div class="card" onclick="imageLibrary('${esc(x.ownerType||'')}','${esc(x.ownerId||'')}','${esc(x.ownerLabel||'')}')"><div class="row"><div class="title">${esc(x.name)}</div><span class="chip blue">本地图片</span></div><div class="meta">${esc(x.ownerLabel||x.ownerType||'图片资料库')}</div></div>`).join('')}

function showUsageHelp(){openSheet(`<h3>V6.6 使用说明</h3><div class="detail-block"><b>日常使用</b><p>首页看今天最重要的事项；写作台管理章节、问题和专注写作；资料按“资料—执行—交付”三组管理；统计默认简洁显示，点“展开详细”查看日历和历史记录。</p></div><div class="detail-block"><b>本地数据</b><p>主数据与图片优先保存在 IndexedDB。每 6 小时最多自动创建一次快照；删除内容进入回收站并保留 30 天；程序更新前也会自动创建快照。</p></div><div class="detail-block"><b>备份建议</b><p>IndexedDB、快照和回收站都属于本机数据。仍建议定期导出 JSON 到 iCloud Drive 或电脑。JSON 备份保存论文结构和文字记录，本地图片请同时在原相册/文件中保留原件。</p></div>`) }

function renderAll(){ensureV66State();renderHome();const home=$('#view-home');if(home&&!home.querySelector('.stage-card'))home.insertAdjacentHTML('afterbegin',stageFocusHTML());renderChapters();renderProblems();renderResources();renderStats();renderSettings();renderFocus();updatePageIntro(currentView);$('#fab').onclick=quickAddMenu;$('#fab').style.display=(currentView==='stats'||currentView==='settings')?'none':'block'}

function handleViewport(){const vv=window.visualViewport;if(!vv)return;document.body.classList.toggle('keyboard-open',vv.height<window.innerHeight*0.78)}
if(window.visualViewport){visualViewport.addEventListener('resize',handleViewport);visualViewport.addEventListener('scroll',handleViewport)}
window.addEventListener('online',()=>{updateNetworkBadge();showToast('已恢复联网')});window.addEventListener('offline',()=>{updateNetworkBadge();showToast('当前离线，数据仍可本地保存')});

async function registerV66SW(){if(!('serviceWorker'in navigator))return;try{swRegistration=await navigator.serviceWorker.register('./sw.js');if(swRegistration.waiting)showUpdateBanner();swRegistration.addEventListener('updatefound',()=>{const w=swRegistration.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdateBanner()})});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(updateAvailable)location.reload()})}catch(e){console.warn(e)}}
function showUpdateBanner(){updateAvailable=true;const el=$('#updateBanner');if(el){el.classList.add('show');el.innerHTML=`<span>发现新版本</span><button onclick="applyAppUpdate()">备份并更新</button>`}}
async function applyAppUpdate(){await maybeSnapshot(true,'程序更新前自动快照');updateAvailable=true;if(swRegistration?.waiting)swRegistration.waiting.postMessage({type:'SKIP_WAITING'});else location.reload()}
async function checkForUpdate(){if(!swRegistration)await registerV66SW();try{await swRegistration?.update();showToast('已检查程序更新')}catch(e){showToast('当前无法检查更新')}}

$$('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.view));
maybeSnapshot();renderAll();updateNetworkBadge();registerV66SW();initV66Database();

</script>
</body>
